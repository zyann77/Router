<!DOCTYPE html>
<html lang="id" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#F3F5F7">
<title>Data PSB - RNB</title>
<script>try{var t=localStorage.getItem('psbTheme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;if(t==='dark')document.querySelector('meta[name=theme-color]').content='#0E1722'}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F7;--sf:#fff;--ink:#13202E;--mu:#617082;--ln:#E1E6EC;--ac:#0F6CBD;--aci:#fff;--acs:#E6F0FA;--ok:#12805C;--bad:#C23B3B;--bads:#FBEAEA;--fh:#EEF1F4;color-scheme:light}
:root[data-theme=dark]{--bg:#0E1722;--sf:#16222F;--ink:#E8EEF5;--mu:#8FA0B3;--ln:#243446;--ac:#5AAEF0;--aci:#06192B;--acs:#1A3550;--ok:#4FCB9A;--bad:#F27D7D;--bads:#40222A;--fh:#1B2A3A;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:100px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;gap:12px;height:60px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;color:var(--ink);text-decoration:none}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:18px;font-weight:800;line-height:1.2}
.ttl p{font-size:12px;color:var(--mu)}
:root[data-theme=dark] .moon,:root:not([data-theme=dark]) .sun{display:none}
.months{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 4px;margin:0 -16px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.chip small{font-size:12px;color:var(--mu);font-weight:600}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--aci)}
.chip.on small{color:inherit;opacity:.85}
.sum{background:var(--sf);border:1px solid var(--ln);border-radius:18px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr}
.sum>div{padding:14px 16px;min-width:0}
.sum>div:nth-child(2){border-left:1px solid var(--ln)}
.sum>div:nth-child(3){grid-column:1/-1;border-top:1px solid var(--ln)}
.sum span{display:block;font-size:12px;color:var(--mu);font-weight:600}
.sum b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum>div:nth-child(3) b{font-size:17px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 12px}
.search{flex:1 1 100%;position:relative}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--mu)}
.fld{width:100%;height:46px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:0 14px;font-size:16px}
.search .fld{padding-left:44px}
.sort{flex:1 1 0;min-width:0}
.btn{height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--aci)}
.btn-in{display:none}
body:not(.is-admin) .admin-only{display:none!important}
.cnt{font-size:13px;color:var(--mu);margin-bottom:10px}.cnt:empty{display:none}
.lh{display:none}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;grid-template-areas:"sp who pr" "sp pl pl" "sp wh wh" "ac ac ac";gap:2px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px;align-items:start}
.speed{grid-area:sp;width:56px;height:56px;border-radius:14px;background:var(--acs);color:var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.speed b{font-size:21px;font-weight:800}
.speed span{font-size:10px;font-weight:700;margin-top:3px}
.who{grid-area:who;min-width:0}
.who h3{font-size:16px;font-weight:700;line-height:1.3}
.who p{font-size:13px;color:var(--mu)}
.pr{grid-area:pr;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.pl{grid-area:pl;font-size:14px;font-weight:600;margin-top:6px}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--fh);color:var(--mu);font-size:11px;font-weight:700;vertical-align:1px}
.wh{grid-area:wh;color:var(--ok);font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.wh svg{width:14px;height:14px;stroke-width:3}
.acts{grid-area:ac;display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--ln)}
.sm{flex:1;height:38px;border-radius:10px;border:1px solid var(--ln);background:none;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.sm svg{width:15px;height:15px}
.sm.del{color:var(--bad)}.sm.del:hover{background:var(--bads)}
.empty{text-align:center;padding:48px 16px;color:var(--mu)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:4px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;height:56px;padding:0 22px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.ov{position:fixed;inset:0;background:rgba(5,12,20,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.ov.active{display:flex}
.sheet{background:var(--sf);width:100%;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:16px}
.ig{margin-bottom:14px}
.ig label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.ig small{display:block;color:var(--mu);font-size:12px;margin-top:4px}
.foot{display:flex;gap:10px;margin-top:18px}.foot .btn{flex:1}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));translate:-50% -20px;opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;transition:.25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;translate:-50% 0}
@media(min-width:800px){
.wrap{padding:0 24px}
.months{margin:0 -24px;padding:20px 24px 4px}
.sum{grid-template-columns:1fr 1.3fr 1.5fr}
.sum>div{padding:18px 22px}
.sum>div:nth-child(3){grid-column:auto;border-top:0;border-left:1px solid var(--ln)}
.sum b{font-size:26px}.sum>div:nth-child(3) b{font-size:18px}
.search{flex:1 1 280px}.sort{flex:0 0 210px}
.btn-in{display:inline-flex}.fab{display:none}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:18px;overflow:hidden}
.lh,.row{display:grid;grid-template-columns:56px minmax(0,2fr) 130px minmax(0,1.6fr) 120px;grid-template-areas:none;gap:16px;align-items:center;padding:12px 20px}
body.is-admin .lh,body.is-admin .row{grid-template-columns:56px minmax(0,2fr) 130px minmax(0,1.6fr) 120px 150px}
.lh{background:var(--fh);font-size:12px;font-weight:700;color:var(--mu);padding-top:10px;padding-bottom:10px}
.lh span:last-child{text-align:right}
body:not(.is-admin) .lh span:last-child{text-align:right}
.row{border:0;border-top:1px solid var(--ln);border-radius:0;margin:0}
.row:hover{background:var(--fh)}
.row>*{grid-area:auto}
.pl{margin:0}.lbl{display:none}
.acts{margin:0;padding:0;border:0;justify-content:flex-end}
.sm{flex:0 0 auto;padding:0 12px;height:36px}
.ov{align-items:center}
.sheet{max-width:480px;border-radius:20px;border:1px solid var(--ln)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <a href="index.html" class="ib" aria-label="Kembali"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></a>
  <div class="ttl"><h1>Data PSB</h1><p>Pelanggan pasang baru</p></div>
  <button class="ib" id="themeBtn" aria-label="Ganti mode terang atau gelap">
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div></header>

<main class="wrap">
  <nav class="months" id="months" aria-label="Pilih bulan"></nav>

  <section class="sum">
    <div><span id="sLbl">Terpasang</span><b id="sCount">0</b></div>
    <div><span>Total harga paket</span><b id="sTotal">Rp 0</b></div>
    <div><span>Paket terbanyak</span><b id="sTop">–</b></div>
  </section>

  <div class="bar">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" class="fld" placeholder="Cari nama atau alamat" oninput="renderList()"></label>
    <select id="sortSelect" class="fld sort" onchange="renderList()" aria-label="Urutkan data">
      <option value="date-asc" selected>Tanggal terlama</option>
      <option value="date-desc">Tanggal terbaru</option>
      <option value="name-asc">Nama A–Z</option>
      <option value="name-desc">Nama Z–A</option>
    </select>
    <button class="btn admin-only" onclick="exportDataPSB()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export Excel</button>
    <button class="btn pri btn-in admin-only" onclick="openModal()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Input PSB</button>
  </div>
  <div class="cnt" id="count"></div>
  <div class="list" id="psbList"></div>
</main>

<button class="btn pri fab admin-only" onclick="openModal()"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Input PSB</button>

<div class="ov" id="modalForm">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <h2 id="formTitle">Input data PSB</h2>
    <form id="psbForm">
      <input type="hidden" id="editId">
      <div class="ig"><label for="nama">Nama pelanggan</label><input type="text" id="nama" class="fld" required></div>
      <div class="ig"><label for="alamat">Alamat lengkap</label><input type="text" id="alamat" class="fld" required></div>
      <div class="ig"><label for="tanggal_pasang">Tanggal pasang</label><input type="date" id="tanggal_pasang" class="fld" required></div>
      <div class="ig"><label for="paket">Paket</label><select id="paket" class="fld" required onchange="updateHargaOtomatis()"></select></div>
      <div class="ig"><label for="harga">Harga (Rp)</label><input type="number" id="harga" class="fld" inputmode="numeric" required><small>Terisi otomatis dari paket, bisa diubah.</small></div>
      <div class="foot">
        <button type="button" class="btn" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn pri" id="saveBtn">Simpan data</button>
      </div>
    </form>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
if (!userLoggedIn) { window.location.href = 'index.html'; }
const isAdmin = !!userLoggedIn && userLoggedIn.role === 'admin';
document.body.classList.toggle('is-admin', isAdmin);

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const currentMonthIdx = new Date().getMonth();
let currentBulan = String(currentMonthIdx);
let allPsb = [];
const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

const PAKET = {
  'Paket Basic': [['Basic 5 Mbps',100000],['Basic 7 Mbps',100000]],
  'Paket Lite': [['Lite 10 Mbps',135000],['Lite 20 Mbps',165000],['Lite 30 Mbps',220000],['Lite 50 Mbps',300000]],
  'Paket Silver / Gold / Platinum': [['Silver 10 Mbps',150000],['Gold 20 Mbps',200000],['Platinum 30 Mbps',250000]],
  'Paket Broadband': [['Broadband Silver 100 Mbps',135000],['Broadband Gold 150 Mbps',165000],['Broadband Platinum 200 Mbps',220000]],
  'Paket Internet + TV': [['Tv + Inet 15 Mbps',200000],['Lite 20 Mbps + Tv',215000],['Broadband Gold 150 Mbps + Tv',240000],['Tv + Inet 20 Mbps',250000],['Tv + Inet 30 Mbps',300000]],
  'Paket Premium / Bisnis': [['Diamond 50 Mbps',500000],['Bussines 200 Mbps',500000],['Bussines + Tv 30 Mbps',600000],['Ruby 100 Mbps',800000]]
};
$('paket').innerHTML = '<option value="" data-harga="">Pilih paket</option>' + Object.entries(PAKET).map(([g, items]) =>
  `<optgroup label="${g}">${items.map(([n, h]) => `<option value="${n}" data-harga="${h}">${n} (Rp ${h.toLocaleString('id-ID')})</option>`).join('')}</optgroup>`).join('');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + (parseInt(n) || 0).toLocaleString('id-ID');
const tglFmt = s => { const d = new Date(s); return `${d.getDate()} ${namaBulan[d.getMonth()].slice(0,3)} ${d.getFullYear()}`; };

/* Mode terang / gelap */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('psbTheme', t); } catch (e) {}
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0E1722' : '#F3F5F7';
}
$('themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

function showToast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast.t); showToast.t = setTimeout(() => t.classList.remove('show'), 3000);
}

function openModal() {
  $('psbForm').reset(); $('editId').value = '';
  $('tanggal_pasang').value = new Date().toISOString().split('T')[0];
  $('formTitle').textContent = 'Input data PSB';
  $('modalForm').classList.add('active');
}
function closeModal() { $('modalForm').classList.remove('active'); }
$('modalForm').addEventListener('click', e => { if (e.target.id === 'modalForm') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function updateHargaOtomatis() {
  const o = $('paket').options[$('paket').selectedIndex];
  $('harga').value = o.getAttribute('data-harga') || '';
}

/* Pilihan bulan */
function renderBulanSelect() {
  const counts = {};
  allPsb.forEach(p => {
    if (p.tanggal_pasang) { const d = new Date(p.tanggal_pasang); if (!isNaN(d)) counts[d.getMonth()] = (counts[d.getMonth()] || 0) + 1; }
  });
  const chip = (v, label, n) => `<button class="chip ${currentBulan === v ? 'on' : ''}" onclick="onBulanChange('${v}')">${label}<small>${n}</small></button>`;
  let h = chip('all', 'Semua', allPsb.length);
  namaBulan.forEach((nama, i) => {
    const c = counts[i] || 0;
    if (c > 0 || i === currentMonthIdx) h += chip(String(i), nama.slice(0, 3), c);
  });
  const m = $('months'); m.innerHTML = h;
  const on = m.querySelector('.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function onBulanChange(val) { currentBulan = val; renderBulanSelect(); renderList(); }

async function loadData() {
  $('psbList').innerHTML = '<div class="empty">Memuat data…</div>';
  const { data, error } = await supabaseClient.from('psb').select('*').order('created_at', { ascending: false });
  if (error) { showToast('Gagal memuat data. Coba muat ulang halaman.'); $('psbList').innerHTML = '<div class="empty"><h3>Data belum bisa dimuat</h3>Periksa koneksi internet, lalu muat ulang halaman.</div>'; return; }
  allPsb = data || [];
  renderBulanSelect(); renderList();
}

const inMonth = p => currentBulan === 'all' || (p.tanggal_pasang && String(new Date(p.tanggal_pasang).getMonth()) === currentBulan);

function renderSummary(d) {
  const total = d.reduce((s, p) => s + (parseInt(p.harga) || 0), 0);
  const c = {}; d.forEach(p => { if (p.paket) c[p.paket] = (c[p.paket] || 0) + 1; });
  const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  $('sLbl').textContent = currentBulan === 'all' ? 'Terpasang, semua bulan' : 'Terpasang di ' + namaBulan[currentBulan];
  $('sCount').textContent = d.length + ' pelanggan';
  $('sTotal').textContent = rp(total);
  $('sTop').textContent = top ? top[0] : '–';
}

const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ICON_DEL = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

function renderList() {
  const list = $('psbList');
  const sortVal = $('sortSelect').value;
  const kw = $('searchInput').value.trim().toLowerCase();
  const bulanData = allPsb.filter(inMonth);
  renderSummary(bulanData);

  const f = bulanData.filter(p => !kw || (p.nama || '').toLowerCase().includes(kw) || (p.alamat || p.wilayah || '').toLowerCase().includes(kw));
  $('count').textContent = kw ? `${f.length} dari ${bulanData.length} pelanggan cocok dengan “${$('searchInput').value.trim()}”` : '';

  if (!f.length) {
    list.innerHTML = kw
      ? '<div class="empty"><h3>Tidak ada hasil</h3>Coba kata kunci lain atau pilih bulan yang berbeda.</div>'
      : `<div class="empty"><h3>Belum ada data</h3>${isAdmin ? 'Tekan “Input PSB” untuk menambah pelanggan baru.' : 'Belum ada pelanggan yang dipasang pada bulan ini.'}</div>`;
    return;
  }

  f.sort((a, b) => {
    const dA = new Date(a.tanggal_pasang || a.created_at), dB = new Date(b.tanggal_pasang || b.created_at);
    if (sortVal === 'date-asc') return dA - dB;
    if (sortVal === 'date-desc') return dB - dA;
    if (sortVal === 'name-asc') return (a.nama || '').localeCompare(b.nama || '');
    return (b.nama || '').localeCompare(a.nama || '');
  });

  const head = `<div class="lh"><span></span><span>Pelanggan</span><span>Tanggal pasang</span><span>Paket</span><span style="text-align:right">Harga</span>${isAdmin ? '<span>Aksi</span>' : ''}</div>`;
  list.innerHTML = head + f.map(p => {
    const paket = p.paket || '-';
    const m = paket.match(/(\d+)\s*Mbps/i);
    const tags = (/\btv\b/i.test(paket) ? '<span class="tag">+ TV</span>' : '') + (/bussines|business|diamond|ruby/i.test(paket) ? '<span class="tag">Bisnis</span>' : '');
    const acts = isAdmin ? `<div class="acts"><button class="sm" onclick="editData('${esc(p.id)}')">${ICON_EDIT}Edit</button><button class="sm del" onclick="deleteData('${esc(p.id)}')">${ICON_DEL}Hapus</button></div>` : '';
    return `<article class="row">
      <div class="speed"><b>${m ? m[1] : '–'}</b><span>Mbps</span></div>
      <div class="who"><h3>${esc(p.nama)}</h3><p>${esc(p.alamat || p.wilayah || '-')}</p></div>
      <div class="wh">${ICON_CHECK}<span><span class="lbl">Dipasang </span>${p.tanggal_pasang ? tglFmt(p.tanggal_pasang) : '-'}</span></div>
      <div class="pl">${esc(paket)}${tags}</div>
      <div class="pr">${rp(p.harga)}</div>
      ${acts}
    </article>`;
  }).join('');
}

/* Simpan data */
$('psbForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('editId').value, alamat = $('alamat').value, btn = $('saveBtn');
  const payload = {
    nama: $('nama').value, wilayah: alamat, alamat: alamat, paket: $('paket').value,
    harga: $('harga').value || '0', tanggal_pasang: $('tanggal_pasang').value, status: 'Selesai', hp: '-'
  };
  btn.disabled = true;
  const res = id ? await supabaseClient.from('psb').update(payload).eq('id', id) : await supabaseClient.from('psb').insert([payload]);
  btn.disabled = false;
  if (!res.error) { showToast('Data disimpan'); closeModal(); loadData(); }
  else { showToast('Gagal menyimpan: ' + res.error.message); }
});

async function deleteData(id) {
  if (!confirm('Hapus data ini permanen?')) return;
  const { error } = await supabaseClient.from('psb').delete().eq('id', id);
  if (!error) { showToast('Data dihapus'); loadData(); } else { showToast('Gagal menghapus: ' + error.message); }
}

function editData(id) {
  const d = allPsb.find(p => String(p.id) === String(id));
  if (!d) return;
  $('editId').value = d.id;
  $('nama').value = d.nama || '';
  $('alamat').value = d.alamat || d.wilayah || '';
  const tgl = d.tanggal_pasang || d.created_at;
  if (tgl) $('tanggal_pasang').value = tgl.split('T')[0];
  $('paket').value = d.paket || '';
  $('harga').value = d.harga || '';
  $('formTitle').textContent = 'Edit data PSB';
  $('modalForm').classList.add('active');
}

/* Export Excel */
async function exportDataPSB() {
  if (allPsb.length === 0) { showToast('Tidak ada data untuk diekspor'); return; }
  if (typeof ExcelJS === 'undefined') { showToast('Library ExcelJS belum dimuat'); return; }

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Data PSB');
  const bd = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };

  ws.mergeCells('A1:F1');
  const titleCell = ws.getCell('A1');
  const textBulan = currentBulan === 'all' ? 'SEMUA BULAN' : namaBulan[currentBulan].toUpperCase();
  titleCell.value = `Laporan Data PSB (${textBulan})`;
  titleCell.font = { bold: true, size: 14 };
  titleCell.alignment = { horizontal: 'center', vertical: 'middle' };

  const headerRow = ws.getRow(2);
  headerRow.values = ['No', 'Nama Pelanggan', 'Alamat', 'Tanggal Pasang', 'Paket', 'Harga (Rp)'];
  headerRow.eachCell(cell => {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF000000' } };
    cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.border = bd;
  });

  const data = allPsb.filter(inMonth);
  if (data.length === 0) { showToast('Tidak ada data di bulan ini untuk diekspor'); return; }
  data.sort((a, b) => new Date(a.tanggal_pasang || a.created_at) - new Date(b.tanggal_pasang || b.created_at));

  let totalHarga = 0;
  data.forEach((p, i) => {
    let tgl = '-';
    if (p.tanggal_pasang) { const d = new Date(p.tanggal_pasang); tgl = `${d.getDate()} ${namaBulan[d.getMonth()]} ${d.getFullYear()}`; }
    const h = p.harga ? parseInt(p.harga) : 0;
    totalHarga += h;
    const row = ws.addRow([i + 1, p.nama || '-', p.alamat || p.wilayah || '-', tgl, p.paket || '-', h.toLocaleString('id-ID')]);
    row.eachCell((cell, c) => {
      cell.border = bd;
      cell.alignment = (c === 1 || c === 4 || c === 6) ? { horizontal: 'center', vertical: 'middle' } : { vertical: 'middle' };
    });
  });

  const tr = 2 + data.length + 1;
  ws.mergeCells(`A${tr}:E${tr}`);
  const lbl = ws.getCell(`A${tr}`);
  lbl.value = 'TOTAL'; lbl.font = { bold: true }; lbl.alignment = { horizontal: 'right', vertical: 'middle' };
  const val = ws.getCell(`F${tr}`);
  val.value = totalHarga.toLocaleString('id-ID'); val.font = { bold: true }; val.alignment = { horizontal: 'center', vertical: 'middle' };
  ['A','B','C','D','E','F'].forEach(col => {
    const c = ws.getCell(`${col}${tr}`);
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' } };
    c.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'double' }, right: { style: 'thin' } };
  });

  [5, 25, 30, 20, 30, 15].forEach((w, i) => ws.getColumn(i + 1).width = w);
  ws.autoFilter = 'A2:F2';

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Data_PSB_RNB_${currentBulan === 'all' ? 'Semua_Bulan' : namaBulan[currentBulan]}.xlsx`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  showToast('Export Excel selesai');
}

loadData();
</script>
