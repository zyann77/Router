<!DOCTYPE html>
<html lang="id" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>Data PSB - RNB Premium</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <!-- Tambahan Library ExcelJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505; --glass-bg: rgba(255, 255, 255, 0.04); --glass-border: rgba(255, 255, 255, 0.08);
            --aurora-1: #8B5CF6; --aurora-2: #3B82F6; --accent-gold: #C9A961; --accent-gold-light: #E5C97A;
            --success: #10B981; --warning: #F59E0B; --danger: #EF4444;
            --text-main: #FFFFFF; --text-muted: #A1A1AA;
            --font-main: 'Poppins', sans-serif;
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-main); min-height: 100vh; overflow-x: hidden; padding-bottom: 120px; }

        .bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: var(--bg-dark); }
        .aurora-blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.25; mix-blend-mode: screen; }
        .blob-1 { width: 400px; height: 400px; background: var(--aurora-1); top: -10%; left: -10%; }
        .blob-2 { width: 350px; height: 350px; background: var(--aurora-2); bottom: -10%; right: -10%; }

        .top-header { position: sticky; top: 0; z-index: 100; background: rgba(5, 5, 5, 0.7); backdrop-filter: blur(30px); border-bottom: 1px solid var(--glass-border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { width: 36px; height: 36px; border-radius: 12px; background: var(--glass-bg); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; text-decoration: none; }
        .nav-btn svg { width: 18px; height: 18px; stroke: white; stroke-width: 1.5; fill: none; }
        .header-title-box { text-align: center; flex: 1; }
        .header-title { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }

        .container { max-width: 600px; margin: 0 auto; padding: 15px 20px; }

        .btn-add { width: 100%; padding: 12px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light)); color: #000; border: none; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(201,169,97,0.2); }
        .btn-add svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* KOTAK PENCARIAN */
        .search-box { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .search-box svg { width: 16px; height: 16px; stroke: var(--accent-gold); stroke-width: 2; fill: none; flex-shrink: 0; }
        .search-box input { background: none; border: none; color: white; font-size: 12px; width: 100%; outline: none; font-family: inherit; }
        .search-box input::placeholder { color: var(--text-muted); }

        .filter-label { font-size: 10px; color: var(--accent-gold); text-transform: uppercase; font-weight: 600; }
        .chips-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
        .chip { padding: 6px 14px; border-radius: 16px; font-size: 11px; font-weight: 500; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .chip.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: 600; }

        /* =========================================
           EFEK BORDER WARNA-WARNI MUTER (NEW)
           ========================================= */
        .cust-card { 
            position: relative; 
            border-radius: 14px; 
            padding: 12px 14px; 
            margin-bottom: 12px; 
            z-index: 1; 
            overflow: hidden; /* Agar cahaya muternya tidak keluar dari ujung radius */
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
        /* Cahaya yang muter */
        .cust-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent 0deg, transparent 250deg, var(--aurora-1) 280deg, var(--aurora-2) 320deg, var(--accent-gold) 360deg);
            animation: spinBg 4s linear infinite;
            z-index: -2;
        }
        
        /* Penutup dalam agar hanya terlihat sisi luarnya saja (border 1.5px) */
        .cust-card::after {
            content: '';
            position: absolute;
            inset: 1.5px; /* Ketebalan garis warna muter */
            background: #121215;
            border-radius: 13px; /* Radius dalam sedikit lebih kecil */
            z-index: -1;
        }

        @keyframes spinBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* ========================================= */

        .cust-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; gap: 10px; }
        .cust-name { font-size: 13px; font-weight: 600; color: white; line-height: 1.2; }
        .badge { display: inline-block; padding: 3px 6px; border-radius: 6px; font-size: 8px; font-weight: 600; margin: 0; white-space: nowrap; height: fit-content; }
        .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-done { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

        .cust-sub { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
        .cust-info { display: flex; align-items: flex-start; gap: 6px; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
        .cust-info svg { width: 14px; height: 14px; stroke: var(--accent-gold); stroke-width: 1.5; fill: none; flex-shrink: 0; }

        .cust-actions { display: flex; gap: 8px; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }
        .btn-action { padding: 6px 12px; border-radius: 8px; border: none; font-size: 11px; font-weight: 500; cursor: pointer; flex: 1; }
        .btn-edit { background: rgba(59, 130, 246, 0.15); color: #93C5FD; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: #FCA5A5; }

        /* Form Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; padding: 20px; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: rgba(20, 20, 25, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 15px; }
        .input-group { margin-bottom: 12px; }
        .input-label { display: block; font-size: 10px; color: var(--accent-gold); margin-bottom: 4px; text-transform: uppercase; font-weight: 600;}
        .input-field { width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-family: inherit; font-size: 12px; outline: none; color-scheme: dark;}
        .input-field:focus { border-color: var(--accent-gold); }
        
        .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(18, 18, 24, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); padding: 12px 20px; border-radius: 12px; z-index: 9999; font-size: 12px; color: white; transition: 0.4s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="bg-layer"><div class="aurora-blob blob-1"></div><div class="aurora-blob blob-2"></div></div>

    <div class="top-header">
        <a href="index.html" class="nav-btn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></a>
        <div class="header-title-box"><div class="header-title">Data PSB</div></div>
        <div style="width: 36px;"></div>
    </div>

    <div class="container">
        <!-- TOMBOL INPUT & EXPORT PSB -->
        <div id="adminActionButtons" style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn-add" style="margin-bottom: 0; flex: 1;" onclick="openModal()">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Input PSB
            </button>
            <button class="btn-add" style="margin-bottom: 0; flex: 1; background: linear-gradient(135deg, #10B981, #059669); color: white; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);" onclick="exportDataPSB()">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Export Excel
            </button>
        </div>

        <!-- KOTAK PENCARIAN -->
        <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Cari nama atau wilayah..." oninput="renderList()">
        </div>

        <!-- HEADER FILTER & SORTING -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div class="filter-label" id="labelBulan">Filter Bulan</div>
            
            <select id="sortSelect" class="input-field" style="width: auto; padding: 4px 8px; font-size: 10px; border-radius: 6px; cursor: pointer;" onchange="renderList()">
                <option value="date-desc">Terbaru (Baru-Lama)</option>
                <option value="date-asc">Terlama (Lama-Baru)</option>
                <option value="name-asc">Nama (A - Z)</option>
                <option value="name-desc">Nama (Z - A)</option>
            </select>
        </div>
        
        <!-- CHIPS BULAN -->
        <div class="chips-container" id="bulanChips"></div>

        <div id="psbList"></div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalForm">
        <div class="modal-content">
            <div class="modal-title" id="formTitle">Input Data PSB</div>
            <form id="psbForm">
                <input type="hidden" id="editId">
                <div class="input-group">
                    <label class="input-label">Nama Pelanggan</label>
                    <input type="text" id="nama" class="input-field" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Wilayah</label>
                    <select id="wilayah" class="input-field" required>
                        <option value="-">Belum Ditentukan (-)</option>
                        <option value="Sukamelang">Sukamelang</option>
                        <option value="Cibarola">Cibarola</option>
                        <option value="Panglejar">Panglejar</option>
                        <option value="Perum / Flamboyan">Perum / Flamboyan</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label">Tanggal Pasang (Tanggal PSB) *</label>
                    <input type="date" id="tanggal_pasang" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Paket *</label>
                    <select id="paket" class="input-field" required onchange="updateHargaOtomatis()">
                        <option value="" data-harga="">-- Pilih Paket --</option>
                        
                        <optgroup label="Paket Basic">
                            <option value="Basic 5 Mbps" data-harga="100000">Basic 5 Mbps (Rp 100.000)</option>
                            <option value="Basic 7 Mbps" data-harga="100000">Basic 7 Mbps (Rp 100.000)</option>
                        </optgroup>
                        
                        <optgroup label="Paket Lite">
                            <option value="Lite 10 Mbps" data-harga="135000">Lite 10 Mbps (Rp 135.000)</option>
                            <option value="Lite 20 Mbps" data-harga="165000">Lite 20 Mbps (Rp 165.000)</option>
                            <option value="Lite 30 Mbps" data-harga="220000">Lite 30 Mbps (Rp 220.000)</option>
                            <option value="Lite 50 Mbps" data-harga="300000">Lite 50 Mbps (Rp 300.000)</option>
                        </optgroup>
                        
                        <optgroup label="Paket Silver / Gold / Platinum">
                            <option value="Silver 10 Mbps" data-harga="150000">Silver 10 Mbps (Rp 150.000)</option>
                            <option value="Gold 20 Mbps" data-harga="200000">Gold 20 Mbps (Rp 200.000)</option>
                            <option value="Platinum 30 Mbps" data-harga="250000">Platinum 30 Mbps (Rp 250.000)</option>
                        </optgroup>
                        
                        <optgroup label="Paket Broadband">
                            <option value="Broadband Silver 100 Mbps" data-harga="135000">Broadband Silver 100 Mbps (Rp 135.000)</option>
                            <option value="Broadband Gold 150 Mbps" data-harga="165000">Broadband Gold 150 Mbps (Rp 165.000)</option>
                            <option value="Broadband Platinum 200 Mbps" data-harga="220000">Broadband Platinum 200 Mbps (Rp 220.000)</option>
                        </optgroup>
                        
                        <optgroup label="Paket Internet + TV">
                            <option value="Tv + Inet 15 Mbps" data-harga="200000">Tv + Inet 15 Mbps (Rp 200.000)</option>
                            <option value="Lite 20 Mbps + Tv" data-harga="215000">Lite 20 Mbps + Tv (Rp 215.000)</option>
                            <option value="Broadband Gold 150 Mbps + Tv" data-harga="240000">Broadband Gold 150 Mbps + Tv (Rp 240.000)</option>
                            <option value="Tv + Inet 20 Mbps" data-harga="250000">Tv + Inet 20 Mbps (Rp 250.000)</option>
                            <option value="Tv + Inet 30 Mbps" data-harga="300000">Tv + Inet 30 Mbps (Rp 300.000)</option>
                        </optgroup>
                        
                        <optgroup label="Paket Premium / Bisnis">
                            <option value="Diamond 50 Mbps" data-harga="500000">Diamond 50 Mbps (Rp 500.000)</option>
                            <option value="Bussines 200 Mbps" data-harga="500000">Bussines 200 Mbps (Rp 500.000)</option>
                            <option value="Bussines + Tv 30 Mbps" data-harga="600000">Bussines + Tv 30 Mbps (Rp 600.000)</option>
                            <option value="Ruby 100 Mbps" data-harga="800000">Ruby 100 Mbps (Rp 800.000)</option>
                        </optgroup>
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-label">Harga (Rp) *</label>
                    <input type="number" id="harga" class="input-field" placeholder="Otomatis terisi..." required>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 15px;">
                    <button type="button" class="btn-action btn-delete" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn-action" style="background: var(--accent-gold); color: black;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn) { window.location.href = 'index.html'; }
        
        const isAdmin = userLoggedIn.role === 'admin';
        
        if (!isAdmin) { 
            document.getElementById('adminActionButtons').style.display = 'none'; 
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentBulan = 'all';
        let allPsb = [];
        const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
        
        function openModal() { 
            document.getElementById('psbForm').reset(); 
            document.getElementById('editId').value = ''; 
            document.getElementById('tanggal_pasang').value = new Date().toISOString().split('T')[0];
            document.getElementById('formTitle').textContent = 'Input Data PSB'; 
            document.getElementById('modalForm').classList.add('active'); 
        }
        
        function closeModal() { document.getElementById('modalForm').classList.remove('active'); }

        function updateHargaOtomatis() {
            const selectPaket = document.getElementById('paket');
            const selectedOption = selectPaket.options[selectPaket.selectedIndex];
            const harga = selectedOption.getAttribute('data-harga');
            
            if(harga) {
                document.getElementById('harga').value = harga;
            } else {
                document.getElementById('harga').value = '';
            }
        }

        function renderBulanChips() { 
            const container = document.getElementById('bulanChips'); 
            container.innerHTML = `<div class="chip ${currentBulan === 'all' ? 'active' : ''}" onclick="filterByBulan('all', this)">Semua Bulan</div>`; 
            
            const bulanSet = new Set(); 
            allPsb.forEach(p => { 
                if (p.tanggal_pasang) { 
                    const d = new Date(p.tanggal_pasang); 
                    if (!isNaN(d)) bulanSet.add(d.getMonth()); 
                }
            }); 
            
            Array.from(bulanSet).sort((a,b)=>a-b).forEach(m => { 
                const count = allPsb.filter(p => p.tanggal_pasang && !isNaN(new Date(p.tanggal_pasang)) && new Date(p.tanggal_pasang).getMonth() === m).length; 
                container.innerHTML += `<div class="chip ${currentBulan === String(m) ? 'active' : ''}" onclick="filterByBulan('${m}', this)">${namaBulan[m]} (${count})</div>`; 
            }); 
        }

        function filterByBulan(b, el) { 
            currentBulan = b; 
            el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); 
            el.classList.add('active'); 
            renderList(); 
        }

        async function loadData() {
            document.getElementById('psbList').innerHTML = '<p style="text-align:center; color:gray; font-size:12px;">Memuat data...</p>';
            const { data, error } = await supabaseClient.from('psb').select('*').order('created_at', { ascending: false });
            if (error) { showToast('Gagal memuat data'); return; }
            allPsb = data || [];
            
            renderBulanChips();
            renderList();
        }

        function renderList() {
            const list = document.getElementById('psbList');
            const sortVal = document.getElementById('sortSelect').value;
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allPsb;
            
            if (currentBulan !== 'all') {
                filtered = filtered.filter(p => {
                    if (p.tanggal_pasang) {
                        return String(new Date(p.tanggal_pasang).getMonth()) === currentBulan;
                    }
                    return false;
                });
            }

            if (searchKeyword) {
                filtered = filtered.filter(p => 
                    p.nama.toLowerCase().includes(searchKeyword) || 
                    (p.wilayah && p.wilayah.toLowerCase().includes(searchKeyword))
                );
            }
            
            if (filtered.length === 0) { list.innerHTML = '<p style="text-align:center; color:gray; font-size: 12px; margin-top:20px;">Tidak ada data pada filter ini.</p>'; return; }
            
            filtered.sort((a,b) => {
                if (sortVal === 'date-desc') {
                    return new Date(b.tanggal_pasang || b.created_at) - new Date(a.tanggal_pasang || a.created_at);
                } else if (sortVal === 'date-asc') {
                    return new Date(a.tanggal_pasang || a.created_at) - new Date(b.tanggal_pasang || b.created_at);
                } else if (sortVal === 'name-asc') {
                    return a.nama.localeCompare(b.nama);
                } else if (sortVal === 'name-desc') {
                    return b.nama.localeCompare(a.nama);
                }
            });

            list.innerHTML = '';
            filtered.forEach(p => {
                const badge = '<span class="badge badge-done">SUDAH DIPASANG</span>';
                
                let tanggalInfo = '';
                if (p.tanggal_pasang) {
                    const d = new Date(p.tanggal_pasang);
                    tanggalInfo = `<div class="cust-info" style="color: var(--success); font-weight: 500;"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Dipasang: ${d.getDate()} ${namaBulan[d.getMonth()]} ${d.getFullYear()}</div>`;
                }

                let actionButtons = '';
                if (isAdmin) {
                    actionButtons = `
                        <div class="cust-actions">
                            <button class="btn-action btn-edit" onclick="editData('${p.id}')">Edit</button>
                            <button class="btn-action btn-delete" onclick="deleteData('${p.id}')">Hapus</button>
                        </div>
                    `;
                }

                const hargaFormat = p.harga ? parseInt(p.harga).toLocaleString('id-ID') : '0';

                list.innerHTML += `
                    <div class="cust-card">
                        <div class="cust-header-row">
                            <div class="cust-name">${p.nama}</div>
                            ${badge}
                        </div>
                        <div class="cust-sub">${p.wilayah}</div>
                        ${tanggalInfo}
                        <div class="cust-info"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/></svg> ${p.paket || '-'} • Rp ${hargaFormat}</div>
                        ${actionButtons}
                    </div>`;
            });
        }

        document.getElementById('psbForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            
            const payload = {
                nama: document.getElementById('nama').value,
                wilayah: document.getElementById('wilayah').value,
                paket: document.getElementById('paket').value,
                harga: document.getElementById('harga').value || '0',
                tanggal_pasang: document.getElementById('tanggal_pasang').value,
                status: 'Selesai'
            };

            payload.hp = "-"; 
            payload.alamat = "-";

            let error;
            if (id) {
                const res = await supabaseClient.from('psb').update(payload).eq('id', id); error = res.error;
            } else {
                const res = await supabaseClient.from('psb').insert([payload]); error = res.error;
            }

            if (!error) { showToast('Data disimpan!'); closeModal(); loadData(); } 
            else { showToast('Gagal: ' + error.message); }
        });

        async function deleteData(id) {
            if(!confirm('Hapus data ini permanen?')) return;
            const { error } = await supabaseClient.from('psb').delete().eq('id', id);
            if (!error) { showToast('Data dihapus!'); loadData(); }
        }

        function editData(id) {
            const data = allPsb.find(p => p.id === id);
            if(data) {
                document.getElementById('editId').value = data.id;
                document.getElementById('nama').value = data.nama;
                document.getElementById('wilayah').value = data.wilayah;
                
                if (data.tanggal_pasang) {
                    document.getElementById('tanggal_pasang').value = data.tanggal_pasang.split('T')[0];
                } else if (data.created_at) {
                    document.getElementById('tanggal_pasang').value = data.created_at.split('T')[0];
                }

                document.getElementById('paket').value = data.paket || '';
                document.getElementById('harga').value = data.harga || '';
                document.getElementById('formTitle').textContent = 'Edit Data PSB';
                document.getElementById('modalForm').classList.add('active');
            }
        }

        // FUNGSI EXPORT DATA PSB MENGGUNAKAN EXCELJS
        async function exportDataPSB() {
            if (allPsb.length === 0) {
                showToast('Tidak ada data untuk diekspor!');
                return;
            }

            if (typeof ExcelJS === 'undefined') {
                showToast('Error: Library ExcelJS belum dimuat.');
                return;
            }

            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet('Data PSB');

            // 1. Judul Utama (Merge A1:F1)
            ws.mergeCells('A1:F1');
            const titleCell = ws.getCell('A1');
            let textBulan = currentBulan === 'all' ? 'SEMUA BULAN' : namaBulan[currentBulan].toUpperCase();
            titleCell.value = `Laporan Data PSB (${textBulan})`;
            titleCell.font = { bold: true, size: 14 };
            titleCell.alignment = { horizontal: 'center', vertical: 'middle' };

            // 2. Header Tabel
            const headerRow = ws.getRow(2);
            headerRow.values = ['No', 'Nama Pelanggan', 'Wilayah', 'Tanggal Pasang', 'Paket', 'Harga (Rp)'];
            
            headerRow.eachCell((cell) => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF000000' } };
                cell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
                cell.alignment = { horizontal: 'center', vertical: 'middle' };
                cell.border = {
                    top: { style: 'thin' }, left: { style: 'thin' },
                    bottom: { style: 'thin' }, right: { style: 'thin' }
                };
            });

            // 3. Filter & Isi Data
            let filteredData = allPsb;
            if (currentBulan !== 'all') {
                filteredData = allPsb.filter(p => {
                    if (p.tanggal_pasang) return String(new Date(p.tanggal_pasang).getMonth()) === currentBulan;
                    return false;
                });
            }

            if(filteredData.length === 0) {
                showToast('Tidak ada data di bulan ini untuk diekspor!');
                return;
            }

            filteredData.forEach((p, index) => {
                let tglFormat = "-";
                if(p.tanggal_pasang) {
                    const d = new Date(p.tanggal_pasang);
                    tglFormat = `${d.getDate()} ${namaBulan[d.getMonth()]} ${d.getFullYear()}`;
                }

                const row = ws.addRow([
                    index + 1,
                    p.nama || "-",
                    p.wilayah || "-",
                    tglFormat,
                    p.paket || "-",
                    p.harga ? parseInt(p.harga).toLocaleString('id-ID') : "0"
                ]);
                
                row.eachCell((cell, colNumber) => {
                    cell.border = {
                        top: { style: 'thin' }, left: { style: 'thin' },
                        bottom: { style: 'thin' }, right: { style: 'thin' }
                    };
                    if(colNumber === 1 || colNumber === 4 || colNumber === 6) {
                        cell.alignment = { horizontal: 'center', vertical: 'middle' };
                    } else {
                        cell.alignment = { vertical: 'middle' };
                    }
                });
            });

            // 4. Lebar Kolom
            ws.getColumn(1).width = 5;  // No
            ws.getColumn(2).width = 25; // Nama
            ws.getColumn(3).width = 20; // Wilayah
            ws.getColumn(4).width = 20; // Tanggal Pasang
            ws.getColumn(5).width = 30; // Paket
            ws.getColumn(6).width = 15; // Harga

            // 5. Auto Filter Header
            ws.autoFilter = 'A2:F2';

            // 6. Download Proses
            const buffer = await wb.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            
            let namaFile = currentBulan === 'all' ? 'Semua_Bulan' : namaBulan[currentBulan];
            link.download = `Data_PSB_RNB_${namaFile}.xlsx`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('Export Excel Selesai!');
        }

        loadData();
    </script>
</body>
