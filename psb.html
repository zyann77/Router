<!DOCTYPE html>
<html lang="su" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Data PSB - RNB Premium</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505; --glass-bg: rgba(255, 255, 255, 0.04); --glass-border: rgba(255, 255, 255, 0.08);
            --aurora-1: #8B5CF6; --aurora-2: #3B82F6; --accent-gold: #C9A961; --accent-gold-light: #E5C97A;
            --success: #10B981; --warning: #F59E0B; --danger: #EF4444;
            --text-main: #FFFFFF; --text-muted: #A1A1AA;
            --font-main: 'Poppins', sans-serif;
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-main); min-height: 100vh; overflow-x: hidden; padding-bottom: 120px; }

        .bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: var(--bg-dark); }
        .aurora-blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.25; mix-blend-mode: screen; }
        .blob-1 { width: 400px; height: 400px; background: var(--aurora-1); top: -10%; left: -10%; }
        .blob-2 { width: 350px; height: 350px; background: var(--aurora-2); bottom: -10%; right: -10%; }

        .top-header { position: sticky; top: 0; z-index: 100; background: rgba(5, 5, 5, 0.7); backdrop-filter: blur(30px); border-bottom: 1px solid var(--glass-border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { width: 40px; height: 40px; border-radius: 14px; background: var(--glass-bg); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; text-decoration: none; }
        .nav-btn svg { width: 20px; height: 20px; stroke: white; stroke-width: 1.5; fill: none; }
        .header-title-box { text-align: center; flex: 1; }
        .header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        .btn-add { width: 100%; padding: 16px; border-radius: 16px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light)); color: #000; border: none; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(201,169,97,0.2); }
        .btn-add svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* TABS */
        .main-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .main-tab { padding: 14px; border-radius: 16px; background: var(--glass-bg); border: 1px solid var(--glass-border); text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .main-tab.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        /* FILTER SASIH (CHIPS) */
        .filter-label { font-size: 11px; color: var(--accent-gold); text-transform: uppercase; margin-bottom: 10px; font-weight: 600; display: none; }
        .chips-container { display: none; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .chip { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .chip.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: 600; }

        /* CARDS */
        .cust-card { background: #121215; border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 15px; position: relative; }
        .cust-name { font-size: 16px; font-weight: 600; color: white; margin-bottom: 4px; }
        .cust-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
        .cust-info { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .cust-info svg { width: 16px; height: 16px; stroke: var(--accent-gold); stroke-width: 1.5; fill: none; flex-shrink: 0; }
        
        .badge { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: 600; margin-bottom: 10px; }
        .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-done { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

        .cust-actions { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .btn-action { padding: 8px 14px; border-radius: 12px; border: none; font-size: 12px; font-weight: 500; cursor: pointer; flex: 1; }
        .btn-edit { background: rgba(59, 130, 246, 0.15); color: #93C5FD; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: #FCA5A5; }
        .btn-done { background: rgba(16, 185, 129, 0.15); color: var(--success); width: 100%; margin-top: 10px;}

        /* Form Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; padding: 20px; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: rgba(20, 20, 25, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 11px; color: var(--accent-gold); margin-bottom: 5px; text-transform: uppercase; }
        .input-field { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-family: inherit; }
        textarea.input-field { min-height: 80px; resize: none; }
        
        .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(18, 18, 24, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); padding: 14px 24px; border-radius: 16px; z-index: 9999; font-size: 13px; color: white; transition: 0.4s; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="bg-layer"><div class="aurora-blob blob-1"></div><div class="aurora-blob blob-2"></div></div>

    <div class="top-header">
        <a href="index.html" class="nav-btn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></a>
        <div class="header-title-box"><div class="header-title">Data PSB Anyar</div></div>
        <div style="width: 40px;"></div>
    </div>

    <div class="container">
        <button class="btn-add" onclick="openModal()">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nambih Antrian PSB
        </button>

        <div class="main-tabs">
            <div class="main-tab active" onclick="switchTab('Belum', this)">Antrian Pasang</div>
            <div class="main-tab" onclick="switchTab('Selesai', this)">Tos Dipasang</div>
        </div>

        <!-- FILTER SASIH -->
        <div class="filter-label" id="labelBulan">Saringan Sasih Dipasang</div>
        <div class="chips-container" id="bulanChips"></div>

        <div id="psbList"></div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalForm">
        <div class="modal-content">
            <div class="modal-title" id="formTitle">Nambih Data PSB</div>
            <form id="psbForm">
                <input type="hidden" id="editId">
                <div class="input-group">
                    <label class="input-label">Nami Pelanggan</label>
                    <input type="text" id="nama" class="input-field" required>
                </div>
                <div class="input-group">
                    <label class="input-label">No WhatsApp / HP</label>
                    <input type="text" id="hp" class="input-field" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Wewengkon</label>
                    <select id="wilayah" class="input-field" required>
                        <option value="Sukamelang">Sukamelang</option>
                        <option value="Cibarola">Cibarola</option>
                        <option value="Panglejar">Panglejar</option>
                        <option value="Perum / Flamboyan">Perum / Flamboyan</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label">Pakét / Alat</label>
                    <input type="text" id="paket" class="input-field" placeholder="Cth: Router / Pakét 3Mbps">
                </div>
                <div class="input-group">
                    <label class="input-label">Alamat Lengkep</label>
                    <textarea id="alamat" class="input-field"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-action btn-delete" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn-action" style="background: var(--accent-gold); color: black;">Simpen</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentTab = 'Belum';
        let currentBulan = 'all';
        let allPsb = [];
        const namaBulan = ['Januari', 'Pébruari', 'Maret', 'April', 'Méi', 'Juni', 'Juli', 'Agustus', 'Séptémber', 'Oktober', 'Nopémber', 'Desémber'];

        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
        function openModal() { document.getElementById('psbForm').reset(); document.getElementById('editId').value = ''; document.getElementById('formTitle').textContent = 'Nambih Data PSB'; document.getElementById('modalForm').classList.add('active'); }
        function closeModal() { document.getElementById('modalForm').classList.remove('active'); }

        // PINDAH TAB & TAMPILKEUN CHIP BULAN
        function switchTab(tab, el) { 
            currentTab = tab; 
            document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active')); 
            el.classList.add('active'); 
            
            if (tab === 'Selesai') {
                document.getElementById('labelBulan').style.display = 'block';
                document.getElementById('bulanChips').style.display = 'flex';
            } else {
                document.getElementById('labelBulan').style.display = 'none';
                document.getElementById('bulanChips').style.display = 'none';
            }
            
            renderList(); 
        }

        // RENDER CHIP BULAN
        function renderBulanChips() { 
            const container = document.getElementById('bulanChips'); 
            container.innerHTML = `<div class="chip ${currentBulan === 'all' ? 'active' : ''}" onclick="filterByBulan('all', this)">Sadaya Sasih</div>`; 
            
            const bulanSet = new Set(); 
            allPsb.forEach(p => { 
                if (p.status === 'Selesai' && p.tanggal_pasang) { 
                    const d = new Date(p.tanggal_pasang); 
                    if (!isNaN(d)) bulanSet.add(d.getMonth()); 
                }
            }); 
            
            Array.from(bulanSet).sort((a,b)=>a-b).forEach(m => { 
                const count = allPsb.filter(p => p.status === 'Selesai' && p.tanggal_pasang && !isNaN(new Date(p.tanggal_pasang)) && new Date(p.tanggal_pasang).getMonth() === m).length; 
                container.innerHTML += `<div class="chip ${currentBulan === String(m) ? 'active' : ''}" onclick="filterByBulan('${m}', this)">${namaBulan[m]} (${count})</div>`; 
            }); 
        }

        function filterByBulan(b, el) { 
            currentBulan = b; 
            el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); 
            el.classList.add('active'); 
            renderList(); 
        }

        async function loadData() {
            document.getElementById('psbList').innerHTML = '<p style="text-align:center; color:gray;">Ngamuat data...</p>';
            const { data, error } = await supabaseClient.from('psb').select('*').order('created_at', { ascending: false });
            if (error) { showToast('Gagal ngamuat data'); return; }
            allPsb = data || [];
            
            renderBulanChips(); // Render tombol bulan saatos data asup
            renderList();
        }

        function renderList() {
            const list = document.getElementById('psbList');
            let filtered = allPsb.filter(p => currentTab === 'Belum' ? p.status !== 'Selesai' : p.status === 'Selesai');
            
            // SARENGAN BULAN (Upami Tab "Tos Dipasang")
            if (currentTab === 'Selesai' && currentBulan !== 'all') {
                filtered = filtered.filter(p => p.tanggal_pasang && String(new Date(p.tanggal_pasang).getMonth()) === currentBulan);
            }
            
            if (filtered.length === 0) { list.innerHTML = '<p style="text-align:center; color:gray; font-size: 13px;">Teu aya data di saringan ieu.</p>'; return; }
            
            // Urutkeun dumasar kaping dipasang upami di tab Selesai
            if (currentTab === 'Selesai') {
                filtered.sort((a,b) => new Date(b.tanggal_pasang || b.created_at) - new Date(a.tanggal_pasang || a.created_at));
            }

            list.innerHTML = '';
            filtered.forEach(p => {
                const badge = p.status === 'Selesai' ? '<span class="badge badge-done">TOS DIPASANG</span>' : '<span class="badge badge-pending">ANTRIAN PASANG</span>';
                
                let tanggalInfo = '';
                if (p.status === 'Selesai' && p.tanggal_pasang) {
                    const d = new Date(p.tanggal_pasang);
                    tanggalInfo = `<div class="cust-info" style="color: var(--success); font-weight: 500;"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Dipasang: ${d.getDate()} ${namaBulan[d.getMonth()]} ${d.getFullYear()}</div>`;
                }

                let actionButtons = `
                    <div class="cust-actions">
                        <button class="btn-action btn-edit" onclick="editData('${p.id}')">Édit</button>
                        <button class="btn-action btn-delete" onclick="deleteData('${p.id}')">Hapus</button>
                    </div>`;

                if (p.status !== 'Selesai') {
                    actionButtons += `<button class="btn-action btn-done" onclick="markDone('${p.id}')">Tandaan Tos Dipasang</button>`;
                }

                list.innerHTML += `
                    <div class="cust-card">
                        ${badge}
                        <div class="cust-name">${p.nama}</div>
                        <div class="cust-sub">${p.wilayah} • ${p.hp}</div>
                        ${tanggalInfo}
                        <div class="cust-info"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> ${p.alamat || '-'}</div>
                        <div class="cust-info"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/></svg> ${p.paket || '-'}</div>
                        ${actionButtons}
                    </div>`;
            });
        }

        document.getElementById('psbForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const payload = {
                nama: document.getElementById('nama').value,
                hp: document.getElementById('hp').value,
                wilayah: document.getElementById('wilayah').value,
                paket: document.getElementById('paket').value,
                alamat: document.getElementById('alamat').value,
                status: id ? undefined : 'Belum' 
            };

            let error;
            if (id) {
                const res = await supabaseClient.from('psb').update(payload).eq('id', id); error = res.error;
            } else {
                const res = await supabaseClient.from('psb').insert([payload]); error = res.error;
            }

            if (!error) { showToast('Data disimpen!'); closeModal(); loadData(); } 
            else { showToast('Gagal: ' + error.message); }
        });

        // FUNGSI MARK DONE (Nambih tanggal pasang otomatis)
        async function markDone(id) {
            if(!confirm('Yakin data ieu tos bérés dipasang?')) return;
            
            const tglAyeuna = new Date().toISOString(); // Nyandak kaping otomatis ayeuna
            const { error } = await supabaseClient.from('psb').update({ status: 'Selesai', tanggal_pasang: tglAyeuna }).eq('id', id);
            
            if (!error) { showToast('Status robih janten Rengsé!'); loadData(); }
        }

        async function deleteData(id) {
            if(!confirm('Hapus data ieu permanén?')) return;
            const { error } = await supabaseClient.from('psb').delete().eq('id', id);
            if (!error) { showToast('Data dihapus!'); loadData(); }
        }

        function editData(id) {
            const data = allPsb.find(p => p.id === id);
            if(data) {
                document.getElementById('editId').value = data.id;
                document.getElementById('nama').value = data.nama;
                document.getElementById('hp').value = data.hp;
                document.getElementById('wilayah').value = data.wilayah;
                document.getElementById('paket').value = data.paket;
                document.getElementById('alamat').value = data.alamat;
                document.getElementById('formTitle').textContent = 'Édit Data PSB';
                document.getElementById('modalForm').classList.add('active');
            }
        }

        loadData();
    </script>
</body>
</html>
