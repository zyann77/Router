<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .dashboard-content {
            padding-bottom: 32px;
        }
        
        .wilayah-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            margin: var(--spacing-lg) var(--spacing-xl);
            transition: transform 0.2s ease;
        }
        
        .wilayah-card:active {
            transform: scale(0.98);
        }
        
        .wilayah-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .wilayah-name {
            font-size: 20px;
            font-weight: 600;
        }
        
        .wilayah-stats {
            display: flex;
            gap: var(--spacing-xl);
        }
        
        .wilayah-stat {
            text-align: center;
            flex: 1;
        }
        
        .wilayah-stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .wilayah-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-title">Dashboard</div>
    </div>
    
    <h1 class="nav-large-title">Ringkasan</h1>
    
    <div class="dashboard-content">
        <div class="stats-grid">
            <div class="stat-card slide-up">
                <div class="stat-icon stat-icon-blue">📦</div>
                <div class="stat-label">Total</div>
                <div class="stat-value" id="totalData">0</div>
            </div>
            
            <div class="stat-card slide-up">
                <div class="stat-icon stat-icon-green">✅</div>
                <div class="stat-label">Selesai</div>
                <div class="stat-value" id="totalDiambil">0</div>
            </div>
        </div>
        
        <div class="stats-grid" style="margin-top: -8px;">
            <div class="stat-card slide-up">
                <div class="stat-icon stat-icon-orange">⏳</div>
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="totalBelum">0</div>
            </div>
            
            <div class="stat-card slide-up">
                <div class="stat-icon" style="background: #5856D6;">📍</div>
                <div class="stat-label">Wilayah</div>
                <div class="stat-value">4</div>
            </div>
        </div>
        
        <div class="section-header">Wilayah</div>
        
        <div id="wilayahGrid"></div>
        
        <div style="padding: var(--spacing-xl);">
            <a href="admin.html" class="ios-btn ios-btn-primary ios-btn-full ios-btn-large">
                ➕ Tambah Data
            </a>
        </div>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;
            
            document.getElementById('totalData').textContent = pelanggan.length;
            document.getElementById('totalDiambil').textContent = pelanggan.filter(p => p.status === 'Sudah Diambil').length;
            document.getElementById('totalBelum').textContent = pelanggan.filter(p => p.status !== 'Sudah Diambil').length;
            
            const wilayahList = ['Sukamelang', 'Cibarola', 'Panglejar', 'Perum / Flamboyan'];
            const wilayahGrid = document.getElementById('wilayahGrid');
            
            wilayahList.forEach(w => {
                const dataW = pelanggan.filter(p => p.wilayah === w);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status !== 'Sudah Diambil').length;
                
                wilayahGrid.innerHTML += `
                    <div class="wilayah-card slide-up" onclick="window.location.href='admin.html?wilayah=${w}'">
                        <div class="wilayah-header">
                            <div class="wilayah-name">${w}</div>
                            <span class="ios-list-chevron">›</span>
                        </div>
                        <div class="wilayah-stats">
                            <div class="wilayah-stat">
                                <div class="wilayah-stat-value" style="color: var(--ios-blue);">${dataW.length}</div>
                                <div class="wilayah-stat-label">Total</div>
                            </div>
                            <div class="wilayah-stat">
                                <div class="wilayah-stat-value" style="color: var(--ios-green);">${diambil}</div>
                                <div class="wilayah-stat-label">Selesai</div>
                            </div>
                            <div class="wilayah-stat">
                                <div class="wilayah-stat-value" style="color: var(--ios-orange);">${belum}</div>
                                <div class="wilayah-stat-label">Pending</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        
        loadDashboard();
    </script>
</body>
</html>
