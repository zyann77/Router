<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="top-header">
        <div class="header-content">
            <div>
                <div class="header-subtitle">RnB</div>
                <div class="header-title">Dashboard</div>
            </div>
            <div class="header-icon">A</div>
        </div>
    </div>

    <div class="section-header">
        <div class="section-label">Pilih Wilayah</div>
        <div class="section-title">Input Data</div>
    </div>

    <div class="wilayah-grid" id="wilayahGrid"></div>

    <div class="section-header">
        <div class="section-label">Ringkasan</div>
        <div class="section-title">Statistik</div>
    </div>

    <div class="hero-section">
        <div class="hero-card">
            <div class="hero-label">Total Perangkat</div>
            <div class="hero-value" id="totalData">0</div>
            <div class="hero-stats">
                <div class="hero-stat">
                    <div class="hero-stat-value" id="totalDiambil">0</div>
                    <div class="hero-stat-label">Sudah Diambil</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value" id="totalBelum">0</div>
                    <div class="hero-stat-label">Belum Diambil</div>
                </div>
            </div>
        </div>
    </div>

    <div class="section-header">
        <div class="section-label">Aksi Cepat</div>
        <div class="section-title">Import / Export</div>
    </div>

    <div class="action-bar">
        <button onclick="exportToExcel()" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export
        </button>
        <label class="btn btn-outline" style="cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Import
            <input type="file" id="importFile" accept=".xlsx,.xls,.csv" style="display: none;" onchange="importFromExcel(event)">
        </label>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <div class="nav-label">Dashboard</div>
        </div>
        <div class="nav-item" onclick="window.location.href='admin.html'">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <div class="nav-label">Kelola Data</div>
        </div>
        <div class="nav-item" onclick="logout()">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <div class="nav-label">Keluar</div>
        </div>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') { window.location.href = 'login.html'; }
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allData = [];
        
        function logout() { localStorage.removeItem('userLoggedIn'); window.location.href = 'login.html'; }
        
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }
        
        const serverIcon = `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="6" rx="1"/><rect x="2" y="15" width="20" height="6" rx="1"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/><line x1="10" y1="6" x2="14" y2="6"/><line x1="10" y1="18" x2="14" y2="18"/></svg>`;
        
        const wilayahConfig = [
            { name: 'Sukamelang', class: 'wilayah-sukamelang' },
            { name: 'Cibarola', class: 'wilayah-cibarola' },
            { name: 'Panglejar', class: 'wilayah-panglejar' },
            { name: 'Perum / Flamboyan', class: 'wilayah-perum' }
        ];
        
        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;
            
            allData = pelanggan;
            document.getElementById('totalData').textContent = pelanggan.length;
            document.getElementById('totalDiambil').textContent = pelanggan.filter(p => p.status === 'Sudah Diambil').length;
            document.getElementById('totalBelum').textContent = pelanggan.filter(p => p.status !== 'Sudah Diambil').length;
            
            const wilayahGrid = document.getElementById('wilayahGrid');
            wilayahGrid.innerHTML = '';
            
            wilayahConfig.forEach((w) => {
                const dataW = pelanggan.filter(p => p.wilayah === w.name);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status !== 'Sudah Diambil').length;
                
                wilayahGrid.innerHTML += `
                    <div class="wilayah-card ${w.class}" onclick="window.location.href='admin.html?wilayah=${encodeURIComponent(w.name)}'">
                        <div>
                            <div class="wilayah-icon">${serverIcon}</div>
                            <div class="wilayah-name">${w.name}</div>
                            <div class="wilayah-count">${dataW.length} perangkat</div>
                        </div>
                        <div class="wilayah-stats">
                            <div class="wilayah-stat">
                                <div class="wilayah-stat-value">${diambil}</div>
                                <div class="wilayah-stat-label">Selesai</div>
                            </div>
                            <div class="wilayah-stat">
                                <div class="wilayah-stat-value">${belum}</div>
                                <div class="wilayah-stat-label">Pending</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        
        function exportToExcel() {
            if (allData.length === 0) { showToast('Tidak ada data', 'error'); return; }
            
            const exportData = allData.map(p => ({
                'Nama Pelanggan': p.nama_pelanggan,
                'Perangkat': p.perangkat || 'Router'
            }));
            
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Laporan');
            const fileName = `Laporan_Pelanggan_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(wb, fileName);
            showToast('Export berhasil!', 'success');
        }
        
        function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    
                    if (jsonData.length === 0) { showToast('File kosong', 'error'); return; }
                    
                    const records = jsonData.map(row => ({
                        nama_pelanggan: row['Nama Pelanggan'] || row['nama_pelanggan'],
                        nomor_hp: String(row['Nomor HP'] || row['nomor_hp'] || ''),
                        alamat: row['Alamat'] || row['alamat'] || '',
                        latitude: row['Latitude'] || row['latitude'] || null,
                        longitude: row['Longitude'] || row['longitude'] || null,
                        wilayah: row['Wilayah'] || row['wilayah'] || '',
                        perangkat: row['Perangkat'] || row['perangkat'] || 'Router',
                        status: row['Status'] || row['status'] || 'Belum Diambil'
                    })).filter(r => r.nama_pelanggan);
                    
                    if (records.length === 0) { showToast('Tidak ada data valid', 'error'); return; }
                    
                    const { error } = await supabaseClient.from('pelanggan').insert(records);
                    if (error) showToast('Error: ' + error.message, 'error');
                    else { showToast(`${records.length} data diimport!`, 'success'); loadDashboard(); }
                } catch (err) { showToast('Error: ' + err.message, 'error'); }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }
        
        loadDashboard();
    </script>
</body>
</html>
