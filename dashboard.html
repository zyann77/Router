<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="top-header">
        <div class="header-content">
            <div>
                <div class="header-subtitle">Selamat Datang</div>
                <div class="header-title" id="userName">Admin</div>
            </div>
            <div class="header-icon" id="userAvatar">A</div>
        </div>
    </div>

    <div class="hero-section">
        <div class="hero-card">
            <div class="hero-label">Lapangan Hari Ini</div>
            <div class="hero-value" id="totalData">0</div>
            <div class="hero-stats">
                <div class="hero-stat">
                    <div class="hero-stat-value" id="totalDiambil">0</div>
                    <div class="hero-stat-label">Selesai</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value" id="totalBelum">0</div>
                    <div class="hero-stat-label">Pending</div>
                </div>
            </div>
        </div>
    </div>

    <div class="section-header">
        <div class="section-label">Wilayah Operasi</div>
        <div class="section-title">Daftar Tugas</div>
    </div>

    <div id="wilayahGrid"></div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="window.location.href='dashboard.html'">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <div class="nav-label">Dashboard</div>
        </div>
        <div class="nav-item" onclick="window.location.href='admin.html'">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <div class="nav-label">Kelola Data</div>
        </div>
        <div class="nav-item" onclick="logout()">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <div class="nav-label">Keluar</div>
        </div>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }
        
        document.getElementById('userName').textContent = userLoggedIn.nama;
        document.getElementById('userAvatar').textContent = userLoggedIn.nama.charAt(0).toUpperCase();
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }
        
        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;
            
            document.getElementById('totalData').textContent = pelanggan.length;
            document.getElementById('totalDiambil').textContent = pelanggan.filter(p => p.status === 'Sudah Diambil').length;
            document.getElementById('totalBelum').textContent = pelanggan.filter(p => p.status !== 'Sudah Diambil').length;
            
            const wilayahList = ['Sukamelang', 'Cibarola', 'Panglejar', 'Perum / Flamboyan'];
            const wilayahGrid = document.getElementById('wilayahGrid');
            
            wilayahList.forEach(w => {
                const dataW = pelanggan.filter(p => p.wilayah === w);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status !== 'Sudah Diambil').length;
                
                wilayahGrid.innerHTML += `
                    <div class="seam-card" onclick="window.location.href='admin.html?wilayah=${w}'" style="cursor: pointer;">
                        <div class="seam-card-header">
                            <div>
                                <div class="card-title">${w}</div>
                                <div class="card-subtitle mono-text">${dataW.length} perangkat</div>
                            </div>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                        </div>
                        <div style="display: flex; gap: var(--spacing-2xl);">
                            <div>
                                <div class="hero-stat-value">${diambil}</div>
                                <div class="hero-stat-label">Selesai</div>
                            </div>
                            <div>
                                <div class="hero-stat-value">${belum}</div>
                                <div class="hero-stat-label">Pending</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        
        loadDashboard();
    </script>
</body>
</html>
