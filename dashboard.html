<!DOCTYPE html>
<html lang="su" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>Dasbor - RNB Premium Network</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030305;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --border-light: rgba(255, 255, 255, 0.08);
            --aurora-1: #7c3aed;
            --aurora-2: #2563eb;
            --aurora-3: #db2777;
            --accent-gold: #fbbf24;
            --accent-gold-glow: rgba(251, 191, 36, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --font-main: 'Poppins', sans-serif;
            --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: var(--font-main); 
            min-height: 100vh; 
            overflow-x: hidden; 
            padding-bottom: 120px; 
            position: relative;
        }

        /* Enhanced Background */
        .bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .bg-grid {
            position: absolute; inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }
        .aurora-blob { 
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.4; mix-blend-mode: screen; 
            animation: floatBlob 25s infinite alternate ease-in-out; 
        }
        .blob-1 { width: 500px; height: 500px; background: var(--aurora-1); top: -15%; left: -10%; animation-delay: 0s; }
        .blob-2 { width: 450px; height: 450px; background: var(--aurora-2); bottom: -15%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 350px; height: 350px; background: var(--aurora-3); top: 40%; left: 50%; transform: translateX(-50%); opacity: 0.2; animation-delay: -10s; }

        @keyframes floatBlob { 
            0% { transform: translate(0, 0) scale(1); } 
            50% { transform: translate(30px, -50px) scale(1.1); } 
            100% { transform: translate(-20px, 20px) scale(0.95); } 
        }

        /* Premium Header */
        .top-header { 
            position: sticky; top: 0; z-index: 100; 
            background: rgba(3, 3, 5, 0.6); 
            backdrop-filter: blur(20px) saturate(180%); 
            -webkit-backdrop-filter: blur(20px) saturate(180%); 
            border-bottom: 1px solid var(--border-light); 
            padding: 16px 24px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .nav-buttons { display: flex; gap: 12px; }
        .nav-btn { 
            width: 42px; height: 42px; border-radius: 16px; 
            background: var(--bg-card); border: 1px solid var(--border-light); 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.3s var(--ease-elastic); text-decoration: none; 
        }
        .nav-btn:hover { transform: translateY(-2px); background: var(--bg-card-hover); border-color: var(--accent-gold); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .nav-btn:active { transform: scale(0.92); }
        .nav-btn svg { width: 20px; height: 20px; stroke: var(--text-main); stroke-width: 1.5; fill: none; transition: stroke 0.3s; }
        .nav-btn:hover svg { stroke: var(--accent-gold); }

        .header-title-box { text-align: center; flex: 1; }
        .header-title { font-size: 14px; font-weight: 600; color: var(--text-main); letter-spacing: 1.5px; text-transform: uppercase; }

        .container { max-width: 640px; margin: 0 auto; padding: 24px; }

        /* Stats Main Card - Premium Glow */
        .stats-main { 
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(251, 191, 36, 0.2); 
            border-radius: 32px; padding: 36px 24px; text-align: center; 
            position: relative; overflow: hidden; margin-bottom: 32px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05); 
            animation: slideUp 0.8s var(--ease-elastic) forwards; 
        }
        .stats-main::before { 
            content: ''; position: absolute; inset: 0; border-radius: 32px; padding: 1px;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.6), transparent 40%, transparent 60%, rgba(251, 191, 36, 0.4));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none;
        }
        .stats-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 3px; font-weight: 600; margin-bottom: 12px; position: relative; z-index: 1; }
        .stats-val-big { 
            font-size: 72px; font-weight: 800; line-height: 1; 
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px var(--accent-gold-glow));
            margin-bottom: 24px; position: relative; z-index: 1;
        }

        .stats-row { display: flex; justify-content: center; gap: 40px; position: relative; z-index: 1; }
        .stat-mini { display: flex; flex-direction: column; align-items: center; }
        .stat-mini-val { font-size: 28px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .stat-mini-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }

        /* Wilayah Grid */
        .section-title { 
            font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; 
            margin-bottom: 16px; padding-left: 8px; display: flex; align-items: center; gap: 8px;
        }
        .section-title::before { content: ''; width: 4px; height: 16px; background: var(--accent-gold); border-radius: 2px; }

        .wilayah-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }

        .w-card { 
            background: var(--bg-card); backdrop-filter: blur(16px); 
            border: 1px solid var(--border-light); border-radius: 24px; padding: 24px 20px; 
            cursor: pointer; transition: all 0.4s var(--ease-elastic); 
            animation: slideUp 0.8s var(--ease-smooth) forwards; opacity: 0; 
            display: flex; flex-direction: column; text-decoration: none; position: relative; overflow: hidden;
        }
        .w-card::before {
            content: ''; position: absolute; inset: 0; 
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(251, 191, 36, 0.15), transparent 40%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 0;
        }
        .w-card > * { position: relative; z-index: 1; }
        .w-card:hover::before { opacity: 1; }

        .w-card:nth-child(1) { animation-delay: 0.1s; } 
        .w-card:nth-child(2) { animation-delay: 0.2s; } 
        .w-card:nth-child(3) { animation-delay: 0.3s; } 
        .w-card:nth-child(4) { animation-delay: 0.4s; }

        a.w-card:hover { transform: translateY(-6px) scale(1.02); border-color: var(--accent-gold); box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px var(--accent-gold-glow); }
        a.w-card:active { transform: scale(0.96); }
        div.w-card { cursor: default; }

        .w-icon { 
            width: 44px; height: 44px; border-radius: 16px; 
            background: rgba(251, 191, 36, 0.1); 
            display: flex; align-items: center; justify-content: center; margin-bottom: 16px; 
            border: 1px solid rgba(251, 191, 36, 0.2); 
            transition: all 0.3s var(--ease-elastic);
        }
        .w-card:hover .w-icon { transform: scale(1.1) rotate(-5deg); background: rgba(251, 191, 36, 0.2); }
        .w-icon svg { width: 22px; height: 22px; stroke: var(--accent-gold); stroke-width: 1.5; fill: none; }

        .w-name { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .w-total { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; font-weight: 500; }

        .w-split { display: flex; justify-content: space-between; border-top: 1px solid var(--border-light); padding-top: 16px; }
        .w-sub { text-align: center; flex: 1; }
        .w-sub-val { font-size: 20px; font-weight: 800; color: var(--text-main); transition: color 0.3s; }
        .w-sub-val.done { color: var(--success); text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .w-sub-val.pend { color: var(--warning); text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        .w-sub-lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; font-weight: 600; }

        /* Export Section */
        .export-wrapper { margin-bottom: 32px; animation: slideUp 0.8s var(--ease-smooth) 0.5s forwards; opacity: 0; }
        .export-btn { 
            width: 100%; padding: 18px; border-radius: 20px; 
            background: linear-gradient(135deg, var(--accent-gold), #f59e0b); 
            color: #000; font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; 
            transition: all 0.3s var(--ease-elastic); border: none; 
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3); position: relative; overflow: hidden;
        }
        .export-btn::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg); transition: left 0.6s;
        }
        .export-btn:hover::after { left: 150%; }
        .export-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(251, 191, 36, 0.4); }
        .export-btn:active { transform: scale(0.97); }
        .export-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* Floating Dock - Premium macOS style */
        .dock-container { 
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 8px; padding: 10px 14px; 
            background: rgba(20, 20, 25, 0.6); 
            backdrop-filter: blur(30px) saturate(180%); 
            -webkit-backdrop-filter: blur(30px) saturate(180%); 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 32px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); 
            z-index: 500; 
        }
        .dock-item { 
            width: 48px; height: 48px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative; transition: all 0.3s var(--ease-elastic); 
        }
        .dock-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-10px) scale(1.15); }
        .dock-item:active { transform: scale(0.9); }
        .dock-item svg { width: 24px; height: 24px; stroke: rgba(255,255,255,0.6); stroke-width: 1.5; fill: none; transition: all 0.3s; }
        .dock-item:hover svg { stroke: var(--text-main); filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)); }
        .dock-item.active svg { stroke: var(--accent-gold); filter: drop-shadow(0 0 8px var(--accent-gold-glow)); }
        .dock-item.active::after { 
            content: ''; position: absolute; bottom: -4px; width: 5px; height: 5px; 
            background: var(--accent-gold); border-radius: 50%; 
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .notif-badge { 
            position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; 
            background: var(--danger); border-radius: 50%; display: none; 
            box-shadow: 0 0 0 2px rgba(20, 20, 25, 1); 
        }
        .notif-badge.active { display: block; animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } 
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } 
        }

        .notif-popup { 
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%) scale(0.9) translateY(20px); 
            width: 340px; background: rgba(15, 15, 20, 0.85); 
            backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 28px; padding: 0; display: none; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8); z-index: 1000; cursor: default; overflow: hidden; 
            opacity: 0; transition: all 0.4s var(--ease-elastic); 
        }
        .notif-popup.active { display: block; opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
        .notif-popup-header { 
            padding: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 14px; font-weight: 700; color: var(--text-main); letter-spacing: 0.5px;
        }
        .clear-all { 
            color: var(--accent-gold); font-size: 12px; font-weight: 600; cursor: pointer; 
            transition: all 0.2s; padding: 4px 8px; border-radius: 8px;
        }
        .clear-all:hover { background: rgba(251, 191, 36, 0.1); }
        .clear-all:active { transform: scale(0.95); }

        .notif-list { max-height: 300px; overflow-y: auto; scrollbar-width: none; }
        .notif-list::-webkit-scrollbar { display: none; }
        .notif-item { 
            padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; gap: 16px; align-items: flex-start; text-align: left; 
            transition: background 0.2s;
        }
        .notif-item:hover { background: rgba(255,255,255,0.03); }
        .notif-item-icon { 
            width: 40px; height: 40px; border-radius: 14px; 
            background: rgba(16, 185, 129, 0.1); color: var(--success); 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; 
            border: 1px solid rgba(16, 185, 129, 0.2); 
        }
        .notif-item-content { flex: 1; }
        .notif-item-title { font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; line-height: 1.3; }
        .notif-item-time { font-size: 11px; color: var(--text-muted); font-weight: 500; }
        .notif-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; font-weight: 500; }

        /* Toast Popup */
        .toast { 
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-150px); 
            background: rgba(15, 15, 20, 0.9); backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 16px 28px; border-radius: 20px; 
            z-index: 9999; font-size: 14px; font-weight: 600; color: var(--text-main); 
            transition: all 0.5s var(--ease-elastic); box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); box-shadow: 0 20px 50px rgba(16, 185, 129, 0.2); }
        .toast.error { border-color: var(--danger); box-shadow: 0 20px 50px rgba(239, 68, 68, 0.2); }

        /* Page Transit */
        .page-transit { 
            position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; 
            opacity: 0; pointer-events: none; transition: opacity 0.4s var(--ease-smooth); 
            display: flex; align-items: center; justify-content: center;
        }
        .page-transit.active { opacity: 1; pointer-events: all; }
        .page-transit::after {
            content: ''; width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-gold); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* Hide Admin elements by default */
        .admin-only { display: none; }
    </style>
</head>
<body>

    <div class="bg-layer">
        <div class="bg-grid"></div>
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
    </div>

    <div class="page-transit" id="pageTransit"></div>

    <div class="top-header">
        <div class="nav-buttons">
            <button class="nav-btn transit-link" href="index.html">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <a href="index.html" class="nav-btn transit-link">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
        </div>
        <div class="header-title-box">
            <div class="header-title">Dasbor Utama</div>
        </div>
        <div style="width: 90px;"></div>
    </div>

    <div class="container">
        <!-- Main Stats -->
        <div class="stats-main">
            <div class="stats-label">Total Perangkat Kadaptar</div>
            <div class="stats-val-big" id="totalData">0</div>
            <div class="stats-row">
                <div class="stat-mini">
                    <div class="stat-mini-val" id="totalDiambil">0</div>
                    <div class="stat-mini-lbl text-success">Réngsé</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-mini-val" id="totalBelum">0</div>
                    <div class="stat-mini-lbl text-warning">Katunda</div>
                </div>
            </div>
        </div>

        <div class="section-title">Distribusi Wewengkon</div>
        <div class="wilayah-grid" id="wilayahGrid"></div>

        <!-- Export Data (Admin Only) -->
        <div class="export-wrapper admin-only">
            <div class="section-title" style="margin-top: 10px;">Laporan</div>
            <button class="export-btn" onclick="doExport('all')">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Unduh Data ka Excel
            </button>
        </div>
    </div>

    <!-- FLOATING DOCK -->
    <div class="dock-container">
        <!-- 1. Dashboard (Active) -->
        <div class="dock-item active transit-link" href="dashboard.html">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        
        <!-- 2. Admin Data (Admin Only) -->
        <div class="dock-item admin-only transit-link" href="admin.html">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        
        <!-- 3. Notifikasi (TENGAH - Admin Only) -->
        <div class="dock-item admin-only" id="notifBtn" onclick="toggleNotifPopup(event)">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <div class="notif-badge" id="notifBadge"></div>
            
            <div class="notif-popup" id="notifPopup" onclick="event.stopPropagation()">
                <div class="notif-popup-header">
                    <span>Béwara Anyar</span>
                    <span class="clear-all" onclick="clearAllNotifs(event)">Beresihan</span>
                </div>
                <div class="notif-list" id="notifList">
                    <div class="notif-empty">Sistem aman. Teu acan aya aktivitas anyar.</div>
                </div>
            </div>
        </div>

        <!-- 4. Teknisi -->
        <div class="dock-item transit-link" href="teknisi.html">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        
        <!-- 5. Logout -->
        <div class="dock-item" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn) { window.location.href = 'login.html'; }
        
        const isAdmin = userLoggedIn.role === 'admin';

        if (isAdmin) {
            document.querySelectorAll('.admin-only').forEach(el => {
                if(el.classList.contains('dock-item')) el.style.display = 'flex';
                else el.style.display = 'block';
            });
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allData = [];

        function logout() { localStorage.removeItem('userLoggedIn'); window.location.href = 'login.html'; }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => { t.className = 'toast'; }, 3000); }

        // --- Logika Notifikasi (Hanya dieksekusi jika Admin) ---
        let sessionNotifs = [];

        function toggleNotifPopup(event) {
            if(!isAdmin) return;
            event.stopPropagation();
            const popup = document.getElementById('notifPopup');
            popup.classList.toggle('active');
            if (popup.classList.contains('active')) document.getElementById('notifBadge').classList.remove('active');
        }

        document.addEventListener('click', function(event) {
            if(!isAdmin) return;
            const popup = document.getElementById('notifPopup');
            const btn = document.getElementById('notifBtn');
            if (popup && popup.classList.contains('active') && !btn.contains(event.target)) {
                popup.classList.remove('active');
            }
        });

        function clearAllNotifs(event) {
            event.stopPropagation(); sessionNotifs = []; updateNotifUI();
            document.getElementById('notifPopup').classList.remove('active');
            showToast('Riwayat parantos diberesihan', 'success');
        }

        function updateNotifUI() {
            if(!isAdmin) return;
            const list = document.getElementById('notifList');
            if (sessionNotifs.length === 0) {
                list.innerHTML = '<div class="notif-empty">Sistem aman. Teu acan aya aktivitas anyar.</div>';
                return;
            }
            list.innerHTML = sessionNotifs.map(n => `
                <div class="notif-item">
                    <div class="notif-item-icon">✅</div>
                    <div class="notif-item-content">
                        <div class="notif-item-title">${n.nama}</div>
                        <div class="notif-item-time">${n.wilayah} • Pkl ${n.waktu}</div>
                    </div>
                </div>
            `).join('');
        }

        // --- Supabase Realtime ---
        if (isAdmin) {
            const processedNotifs = new Set();
            supabaseClient
                .channel('dashboard-realtime')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pelanggan' }, payload => {
                    const newData = payload.new;
                    if (newData.status === 'Sudah Diambil') {
                        const notifKey = newData.id + '_selesai';
                        if (!processedNotifs.has(notifKey)) {
                            processedNotifs.add(notifKey);
                            sessionNotifs.unshift({ nama: newData.nama_pelanggan, wilayah: newData.wilayah, waktu: new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}) });
                            updateNotifUI();
                            showToast(`🔔 ${newData.nama_pelanggan} parantos dicandak!`, 'success');
                            document.getElementById('notifBadge').classList.add('active');
                            loadDashboard(); 
                        }
                    }
                }).subscribe();
        }

        // --- Load Dashboard Data ---
        const serverIcon = `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="6" rx="2"/><rect x="2" y="15" width="20" height="6" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>`;
        const wilayahConfig = [{ name: 'Sukamelang' }, { name: 'Cibarola' }, { name: 'Panglejar' }, { name: 'Perum / Flamboyan' }];

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;
            allData = pelanggan;
            
            animateValue(document.getElementById('totalData'), 0, pelanggan.length, 1000);
            animateValue(document.getElementById('totalDiambil'), 0, pelanggan.filter(p => p.status === 'Sudah Diambil').length, 1000);
            animateValue(document.getElementById('totalBelum'), 0, pelanggan.filter(p => p.status === 'Belum Diambil').length, 1000);
            
            const wilayahGrid = document.getElementById('wilayahGrid'); wilayahGrid.innerHTML = '';
            wilayahConfig.forEach((w, index) => {
                const dataW = pelanggan.filter(p => p.wilayah === w.name);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status === 'Belum Diambil').length;
                
                const tagElement = isAdmin ? 'a' : 'div';
                const classTransit = isAdmin ? 'transit-link' : '';
                const hrefAttr = isAdmin ? `href="admin.html?wilayah=${encodeURIComponent(w.name)}"` : '';
                
                wilayahGrid.innerHTML += `
                    <${tagElement} class="w-card ${classTransit}" ${hrefAttr} style="animation-delay: ${index * 0.1}s">
                        <div class="w-icon">${serverIcon}</div>
                        <div class="w-name">${w.name}</div>
                        <div class="w-total">${dataW.length} Unit Total</div>
                        <div class="w-split">
                            <div class="w-sub"><div class="w-sub-val done">${diambil}</div><div class="w-sub-lbl">Réngsé</div></div>
                            <div class="w-sub"><div class="w-sub-val pend">${belum}</div><div class="w-sub-lbl">Katunda</div></div>
                        </div>
                    </${tagElement}>`;
            });
            
            // ✨ Fitur Baru: Efek Glow Mengikuti Kursor pada Kartu Wilayah
            document.querySelectorAll('.w-card').forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    card.style.setProperty('--mouse-x', `${x}%`);
                    card.style.setProperty('--mouse-y', `${y}%`);
                });
            });

            bindTransitLinks();
        }

        // --- Export (Admin Only) ---
        function doExport(type) {
            if(!isAdmin) return;
            let dataToExport = type === 'all' ? allData : allData.filter(p => p.status === 'Sudah Diambil');
            if (dataToExport.length === 0) { showToast('Teu aya data pikeun diékspor', 'error'); return; }
            const exportData = dataToExport.map(p => ({ 'Nami': p.nama_pelanggan, 'HP': p.nomor_hp, 'Perangkat': p.perangkat || 'Router', 'Wewengkon': p.wilayah, 'Status': p.status }));
            const ws = XLSX.utils.json_to_sheet(exportData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data');
            XLSX.writeFile(wb, `Laporan_Dasbor_${new Date().toISOString().split('T')[0]}.xlsx`);
            showToast(`Ékspor suksés!`, 'success');
        }

        // --- Smooth Transition ---
        function bindTransitLinks() {
            const pageTransit = document.getElementById('pageTransit');
            document.querySelectorAll('.transit-link').forEach(link => {
                const newLink = link.cloneNode(true);
                link.parentNode.replaceChild(newLink, link);
                
                newLink.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    if(!href || this.getAttribute('target') === '_blank') return; 
                    e.preventDefault();
                    pageTransit.classList.add('active');
                    setTimeout(() => window.location.href = href, 400);
                });
            });
        }
        
        window.addEventListener('pageshow', e => { if(e.persisted) document.getElementById('pageTransit').classList.remove('active'); });

        loadDashboard();
    </script>
</body>
</html>
