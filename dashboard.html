<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .dashboard {
            padding: 32px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .header-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a0aec0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            transition: all 0.4s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .stat-icon.blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }
        
        .stat-icon.green {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
        }
        
        .stat-icon.orange {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.4);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: white;
        }
        
        .wilayah-section {
            margin-top: 48px;
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: white;
        }
        
        .wilayah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .wilayah-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        
        .wilayah-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
        }
        
        .wilayah-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: white;
        }
        
        .wilayah-stats {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }
        
        .wilayah-stat {
            text-align: center;
            flex: 1;
        }
        
        .wilayah-stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .wilayah-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .action-buttons {
            margin-top: 40px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1 class="header-title">Dashboard Admin</h1>
            <button onclick="logout()" class="btn btn-danger">Logout</button>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card fade-in">
                <div class="stat-icon blue"></div>
                <div class="stat-label">Total Perangkat</div>
                <div class="stat-value" id="totalData">0</div>
            </div>
            
            <div class="stat-card fade-in">
                <div class="stat-icon green">✅</div>
                <div class="stat-label">Sudah Diambil</div>
                <div class="stat-value" id="totalDiambil">0</div>
            </div>
            
            <div class="stat-card fade-in">
                <div class="stat-icon orange">⏳</div>
                <div class="stat-label">Belum Diambil</div>
                <div class="stat-value" id="totalBelum">0</div>
            </div>
        </div>
        
        <div class="wilayah-section">
            <h2 class="section-title">📍 Wilayah</h2>
            <div class="wilayah-grid" id="wilayahGrid"></div>
        </div>
        
        <div class="action-buttons">
            <a href="admin.html" class="btn btn-primary">➕ Tambah Data Pelanggan</a>
        </div>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }
        
        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;
            
            document.getElementById('totalData').textContent = pelanggan.length;
            document.getElementById('totalDiambil').textContent = pelanggan.filter(p => p.status === 'Sudah Diambil').length;
            document.getElementById('totalBelum').textContent = pelanggan.filter(p => p.status !== 'Sudah Diambil').length;
            
            const wilayahList = ['Sukamelang', 'Cibarola', 'Panglejar', 'Perum / Flamboyan'];
            const wilayahGrid = document.getElementById('wilayahGrid');
            
            wilayahList.forEach(w => {
                const dataW = pelanggan.filter(p => p.wilayah === w);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status !== 'Sudah Diambil').length;
                
                wilayahGrid.innerHTML += `
                    <div class="wilayah-card" onclick="window.location.href='admin.html?wilayah=${w}'">
                        <div class="wilayah-name">${w}</div>
                        <div class="wilayah-stats">
                            <div class="wilayah-stat">
                                <div class="wilayah-stat-value" style="color: #3b82f6;">${dataW.length}</div>
                                <div class="wilayah-stat-label">Total</div>
                            </div>
                            <div class="wilayah-stat">
                                <div class="wilayah-stat-value" style="color: #10b981;">${diambil}</div>
                                <div class="wilayah-stat-label">Diambil</div>
                            </div>
                            <div class="wilayah-stat">
                                <div class="wilayah-stat-value" style="color: #f59e0b;">${belum}</div>
                                <div class="wilayah-stat-label">Belum</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        
        loadDashboard();
    </script>
</body>
</html>
