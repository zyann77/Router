<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard — Penarikan Perangkat</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="nav-bar">
        <div>
            <div class="nav-eyebrow" id="greetTime">Selamat Datang</div>
            <div class="nav-title" id="greetName">Admin</div>
        </div>
        <button onclick="logout()" class="btn btn-icon btn-ghost" aria-label="Keluar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
    </div>

    <h1 class="nav-large-title">Ikhtisar Operasi</h1>
    <p class="nav-sub">Ringkasan penarikan perangkat di seluruh wilayah</p>

    <div class="stat-grid">
        <div class="stat-card wide">
            <div class="signet">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </div>
            <div class="stat-label">Total Perangkat Terdaftar</div>
            <div class="stat-value" id="totalData">0</div>
        </div>

        <div class="stat-card">
            <div class="signet emerald sm">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="stat-label">Sudah Diambil</div>
            <div class="stat-value" id="totalDiambil" style="font-size: 26px;">0</div>
        </div>

        <div class="stat-card">
            <div class="signet rust sm">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
            </div>
            <div class="stat-label">Belum Diambil</div>
            <div class="stat-value" id="totalBelum" style="font-size: 26px;">0</div>
        </div>
    </div>

    <div class="section-title">Wilayah</div>
    <div class="region-list" id="wilayahGrid"></div>

    <div class="sticky-bar">
        <a href="admin.html" class="btn btn-brass btn-full btn-lg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Tambah Data Pelanggan
        </a>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('greetName').textContent = userLoggedIn ? userLoggedIn.nama : 'Admin';
        const hour = new Date().getHours();
        document.getElementById('greetTime').textContent = hour < 11 ? 'Selamat Pagi' : hour < 15 ? 'Selamat Siang' : hour < 18 ? 'Selamat Sore' : 'Selamat Malam';

        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }

        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;

            document.getElementById('totalData').textContent = pelanggan.length;
            document.getElementById('totalDiambil').textContent = pelanggan.filter(p => p.status === 'Sudah Diambil').length;
            document.getElementById('totalBelum').textContent = pelanggan.filter(p => p.status !== 'Sudah Diambil').length;

            const wilayahList = ['Sukamelang', 'Cibarola', 'Panglejar', 'Perum / Flamboyan'];
            const wilayahGrid = document.getElementById('wilayahGrid');
            wilayahGrid.innerHTML = '';

            wilayahList.forEach(w => {
                const dataW = pelanggan.filter(p => p.wilayah === w);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status !== 'Sudah Diambil').length;

                const row = document.createElement('div');
                row.className = 'region-row';
                row.onclick = () => window.location.href = 'admin.html?wilayah=' + encodeURIComponent(w);
                row.innerHTML = `
                    <div>
                        <div class="region-name">${w}</div>
                        <div class="region-tally">
                            <span><b>${dataW.length}</b> total</span>
                            <span><b>${diambil}</b> diambil</span>
                            <span><b>${belum}</b> belum</span>
                        </div>
                    </div>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--ink-faint);flex-shrink:0;"><polyline points="9 18 15 12 9 6"/></svg>
                `;
                wilayahGrid.appendChild(row);
            });
        }

        loadDashboard();
    </script>
</body>
</html>
