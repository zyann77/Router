<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0F172A; color: white; font-family: system-ui, sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .stat-card { text-align: center; }
        .stat-card h3 { color: #94A3B8; font-size: 14px; margin-bottom: 10px; }
        .stat-card h1 { font-size: 36px; margin: 10px 0; }
        .btn { padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .btn-danger { background: #DC2626; color: white; }
        .btn-primary { background: #2563EB; color: white; text-decoration: none; display: inline-block; }
        .wilayah-card { cursor: pointer; transition: transform 0.2s; }
        .wilayah-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="header">
        <h2>📊 Dashboard Admin</h2>
        <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>
    <div class="grid" id="statsGrid">
        <div class="card stat-card">
            <h3>Total Perangkat</h3>
            <h1 id="totalData" style="color: #2563EB;">0</h1>
        </div>
        <div class="card stat-card">
            <h3>Sudah Diambil</h3>
            <h1 id="totalDiambil" style="color: #16A34A;">0</h1>
        </div>
    </div>
    <h3 style="margin: 30px 0 20px;">📍 Wilayah</h3>
    <div class="grid" id="wilayahGrid"></div>
    <div style="margin-top: 30px;">
        <a href="admin.html" class="btn btn-primary">➕ Tambah Data Pelanggan</a>
    </div>
    <script>
        // Cek login
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }
        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;
            document.getElementById('totalData').textContent = pelanggan.length;
            document.getElementById('totalDiambil').textContent = pelanggan.filter(p => p.status === 'Sudah Diambil').length;
            const wilayahList = ['Sukamelang', 'Cibarola', 'Panglejar', 'Perum / Flamboyan'];
            const wilayahGrid = document.getElementById('wilayahGrid');
            wilayahList.forEach(w => {
                const dataW = pelanggan.filter(p => p.wilayah === w);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status !== 'Sudah Diambil').length;
                wilayahGrid.innerHTML += `
                    <div class="card wilayah-card" onclick="window.location.href='admin.html?wilayah=${w}'">
                        <h4>${w}</h4>
                        <p style="margin: 10px 0; font-size: 14px;">
                            Total: <b>${dataW.length}</b> | 
                            Belum: <b style="color: #FCA5A5;">${belum}</b> | 
                            Diambil: <b style="color: #86EFAC;">${diambil}</b>
                        </p>
                    </div>
                `;
            });
        }
        loadDashboard();
    </script>
</body>
</html>
