<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dashboard - Iyann RnB</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    <style>
        :root { --gold: #C9A961; --gold-light: #E5C97A; --gold-dark: #A08340; --bg-dark: #050508; --bg-card: rgba(255, 255, 255, 0.03); --text-main: #F5F1E8; --text-muted: #A0A0B0; --success: #10B981; --warning: #F59E0B; --danger: #EF4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Manrope', system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; position: relative; padding-bottom: 80px; }
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.3; animation: floatOrb 10s infinite alternate ease-in-out; }
        .orb-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(201, 169, 97, 0.2) 0%, transparent 70%); }
        .orb-2 { bottom: 10%; right: -10%; width: 250px; height: 250px; background: radial-gradient(circle, rgba(102, 126, 234, 0.15) 0%, transparent 70%); animation-delay: -5s; }
        @keyframes floatOrb { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 50px); } }

        .top-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-buttons { display: flex; gap: 10px; }
        .nav-btn { width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; transition: all 0.3s; }
        .nav-btn:active { transform: scale(0.9); background: rgba(201, 169, 97, 0.2); }
        .nav-btn svg { width: 18px; height: 18px; stroke: var(--gold); stroke-width: 2; fill: none; }
        .header-info { text-align: center; flex: 1; }
        .header-subtitle { font-size: 10px; color: var(--gold); letter-spacing: 1.5px; text-transform: uppercase; }
        .header-title { font-size: 16px; font-weight: 700; color: white; margin-top: 2px; }
        
        /* NOTIFICATION ICON STYLES */
        .header-icon {
            width: 38px; height: 38px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: all 0.3s;
        }
        .header-icon:active { transform: scale(0.9); background: rgba(201, 169, 97, 0.2); }
        .header-icon svg { width: 18px; height: 18px; stroke: var(--gold); stroke-width: 2; fill: none; }
        .notif-badge {
            position: absolute; top: 8px; right: 8px; width: 8px; height: 8px;
            background: var(--danger); border-radius: 50%; display: none;
            box-shadow: 0 0 0 2px var(--bg-dark);
        }
        .notif-badge.active { display: block; animation: pulseRed 2s infinite; }
        @keyframes pulseRed {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .filter-label { font-size: 11px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; font-weight: 600; }
        .wilayah-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px; }
        .wilayah-card { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 16px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        .wilayah-card:nth-child(1) { animation-delay: 0.1s; } .wilayah-card:nth-child(2) { animation-delay: 0.2s; } .wilayah-card:nth-child(3) { animation-delay: 0.3s; } .wilayah-card:nth-child(4) { animation-delay: 0.4s; }
        .wilayah-card:active { transform: scale(0.96); }
        .w-icon { width: 32px; height: 32px; background: rgba(201, 169, 97, 0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .w-icon svg { width: 18px; height: 18px; stroke: var(--gold); stroke-width: 2; fill: none; }
        .w-name { font-size: 14px; font-weight: 700; color: white; margin-bottom: 2px; }
        .w-count { font-size: 11px; color: var(--text-muted); }
        .w-stats { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .w-stat { text-align: center; flex: 1; }
        .w-stat-value { font-size: 16px; font-weight: 700; color: var(--gold); }
        .w-stat-label { font-size: 9px; color: var(--text-muted); margin-top: 2px; }

        .stats-card { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); border-radius: 20px; padding: 24px; margin-bottom: 32px; position: relative; overflow: hidden; animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        .stats-label { font-size: 11px; color: rgba(0, 0, 0, 0.6); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
        .stats-value { font-size: 48px; font-weight: 900; color: #000; margin-bottom: 20px; }
        .stats-breakdown { display: flex; gap: 24px; }
        .stat-item { flex: 1; }
        .stat-item-value { font-size: 24px; font-weight: 800; color: #000; margin-bottom: 4px; }
        .stat-item-label { font-size: 11px; color: rgba(0, 0, 0, 0.7); font-weight: 600; }

        .export-section { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
        .export-btn { padding: 16px; border-radius: 14px; border: 1px solid rgba(201, 169, 97, 0.3); background: rgba(201, 169, 97, 0.05); color: var(--gold); font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; font-family: inherit; }
        .export-btn:active { transform: scale(0.97); background: rgba(201, 169, 97, 0.15); }
        .export-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .export-btn.primary { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border: none; }

        .export-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .export-modal-overlay.active { display: flex; animation: fadeIn 0.3s; }
        .export-modal { background: #121218; border: 1px solid rgba(201, 169, 97, 0.2); border-radius: 24px; padding: 24px; width: 100%; max-width: 360px; animation: scaleUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .export-modal-title { font-size: 20px; font-weight: 700; color: white; text-align: center; margin-bottom: 8px; }
        .export-modal-sub { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
        .export-option { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 10px; cursor: pointer; transition: all 0.2s; width: 100%; text-align: left; color: white; font-family: inherit; }
        .export-option:active { transform: scale(0.97); background: rgba(201, 169, 97, 0.1); border-color: var(--gold); }
        .export-option-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .export-option-icon svg { width: 22px; height: 22px; stroke-width: 2; fill: none; }
        .export-option-icon.all { background: rgba(201, 169, 97, 0.15); }
        .export-option-icon.all svg { stroke: var(--gold); }
        .export-option-icon.taken { background: rgba(16, 185, 129, 0.15); }
        .export-option-icon.taken svg { stroke: var(--success); }
        .export-option-text { flex: 1; }
        .export-option-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
        .export-option-desc { font-size: 11px; color: var(--text-muted); }
        .export-option-count { font-size: 18px; font-weight: 800; color: var(--gold); }
        .export-close { width: 100%; padding: 14px; border-radius: 12px; border: none; background: rgba(255, 255, 255, 0.05); color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #121218; border: 1px solid rgba(255, 255, 255, 0.1); padding: 14px 20px; border-radius: 12px; z-index: 2000; font-size: 14px; font-weight: 600; transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.05); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; flex: 1; padding: 4px 2px; }
        .nav-item svg { width: 20px; height: 20px; stroke: var(--text-muted); stroke-width: 2; fill: none; transition: all 0.3s; }
        .nav-item span { font-size: 9px; color: var(--text-muted); font-weight: 600; transition: all 0.3s; text-align: center; }
        .nav-item.active svg { stroke: var(--gold); }
        .nav-item.active span { color: var(--gold); }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="top-header">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <a href="index.html" class="nav-btn">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
        </div>
        <div class="header-info">
            <div class="header-subtitle">Panel Administrasi</div>
            <div class="header-title">Dashboard</div>
        </div>
        <!-- IKON NOTIFIKASI BARU -->
        <div class="header-icon" onclick="clearNotifBadge()">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <div class="notif-badge" id="notifBadge"></div>
        </div>
    </div>

    <div class="container">
        <div class="filter-label">Pilih Wilayah</div>
        <div class="wilayah-grid" id="wilayahGrid"></div>

        <div class="stats-card">
            <div class="stats-label">Total Perangkat</div>
            <div class="stats-value" id="totalData">0</div>
            <div class="stats-breakdown">
                <div class="stat-item"><div class="stat-item-value" id="totalDiambil">0</div><div class="stat-item-label">Sudah Diambil</div></div>
                <div class="stat-item"><div class="stat-item-value" id="totalBelum">0</div><div class="stat-item-label">Belum Diambil</div></div>
            </div>
        </div>

        <div class="filter-label">Export Data</div>
        <div class="export-section">
            <button class="export-btn primary" onclick="openExportModal()">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export ke Excel
            </button>
        </div>
    </div>

    <div id="exportModal" class="export-modal-overlay">
        <div class="export-modal">
            <div class="export-modal-title">Pilih Export</div>
            <div class="export-modal-sub">Data akan diexport ke format Excel</div>
            <button class="export-option" onclick="doExport('all')">
                <div class="export-option-icon all"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
                <div class="export-option-text"><div class="export-option-title">Export Semua Data</div><div class="export-option-desc">Semua pelanggan (aktif & selesai)</div></div>
                <div class="export-option-count" id="countAll">0</div>
            </button>
            <button class="export-option" onclick="doExport('taken')">
                <div class="export-option-icon taken"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
                <div class="export-option-text"><div class="export-option-title">Alat Sudah Diambil</div><div class="export-option-desc">Hanya yang status Selesai</div></div>
                <div class="export-option-count" id="countTaken">0</div>
            </button>
            <button class="export-close" onclick="closeExportModal()">Batal</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="window.location.href='dashboard.html'"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Dashboard</span></div>
        <div class="nav-item" onclick="window.location.href='admin.html'"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><span>Input Data</span></div>
        <div class="nav-item" onclick="window.location.href='teknisi.html'"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Teknisi</span></div>
        <div class="nav-item" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Keluar</span></div>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') { window.location.href = 'login.html'; }
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allData = [];

        function logout() { localStorage.removeItem('userLoggedIn'); window.location.href = 'login.html'; }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => { t.className = 'toast'; }, 3000); }

        function clearNotifBadge() {
            document.getElementById('notifBadge').classList.remove('active');
            showToast('Riwayat notifikasi bersih.', 'success');
        }

        // ==========================================
        // NOTIFIKASI REALTIME 
        // ==========================================
        const processedNotifs = new Set();
        supabaseClient
            .channel('dashboard-notif-channel')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pelanggan' }, payload => {
                const newData = payload.new;
                
                if (newData.status === 'Sudah Diambil') {
                    const notifKey = newData.id + '_selesai';
                    if (!processedNotifs.has(notifKey)) {
                        processedNotifs.add(notifKey);
                        showToast(`🔔 Perangkat ${newData.nama_pelanggan} sudah diambil!`, 'success');
                        document.getElementById('notifBadge').classList.add('active');
                        
                        // Update angka di dashboard
                        loadDashboard();
                    }
                }
            })
            .subscribe();

        const serverIcon = `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="6" rx="1"/><rect x="2" y="15" width="20" height="6" rx="1"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>`;
        const wilayahConfig = [{ name: 'Sukamelang' }, { name: 'Cibarola' }, { name: 'Panglejar' }, { name: 'Perum / Flamboyan' }];

        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;
            allData = pelanggan;
            document.getElementById('totalData').textContent = pelanggan.length;
            document.getElementById('totalDiambil').textContent = pelanggan.filter(p => p.status === 'Sudah Diambil').length;
            document.getElementById('totalBelum').textContent = pelanggan.filter(p => p.status === 'Belum Diambil').length;
            
            const wilayahGrid = document.getElementById('wilayahGrid'); wilayahGrid.innerHTML = '';
            wilayahConfig.forEach((w, index) => {
                const dataW = pelanggan.filter(p => p.wilayah === w.name);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status === 'Belum Diambil').length;
                wilayahGrid.innerHTML += `
                    <div class="wilayah-card" style="animation-delay: ${index * 0.1}s" onclick="window.location.href='admin.html?wilayah=${encodeURIComponent(w.name)}'">
                        <div><div class="w-icon">${serverIcon}</div><div class="w-name">${w.name}</div><div class="w-count">${dataW.length} perangkat</div></div>
                        <div class="w-stats"><div class="w-stat"><div class="w-stat-value">${diambil}</div><div class="w-stat-label">Selesai</div></div><div class="w-stat"><div class="w-stat-value">${belum}</div><div class="w-stat-label">Pending</div></div></div>
                    </div>`;
            });
        }

        function openExportModal() { document.getElementById('countAll').textContent = allData.length; document.getElementById('countTaken').textContent = allData.filter(p => p.status === 'Sudah Diambil').length; document.getElementById('exportModal').classList.add('active'); }
        function closeExportModal() { document.getElementById('exportModal').classList.remove('active'); }
        function doExport(type) {
            let dataToExport = type === 'taken' ? allData.filter(p => p.status === 'Sudah Diambil') : allData;
            if (dataToExport.length === 0) { showToast('Tidak ada data untuk diexport', 'error'); closeExportModal(); return; }
            const exportData = dataToExport.map(p => ({ 'Nama': p.nama_pelanggan, 'HP': p.nomor_hp, 'Perangkat': p.perangkat || 'Router', 'Wilayah': p.wilayah, 'Status': p.status }));
            const ws = XLSX.utils.json_to_sheet(exportData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data');
            XLSX.writeFile(wb, `Data_Dashboard_${new Date().toISOString().split('T')[0]}.xlsx`);
            showToast(`Export berhasil!`, 'success'); closeExportModal();
        }

        loadDashboard();
    </script>
</body>
</html>
