<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dashboard</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <!-- Top Header -->
    <div class="top-header">
        <div class="header-content">
            <div>
                <div class="greeting">Selamat Datang 👋</div>
                <div class="user-name" id="userName">Admin</div>
            </div>
            <div class="avatar" id="userAvatar">A</div>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="hero-card animate-slide-up">
            <div class="hero-title">Total Perangkat</div>
            <div class="hero-value" id="totalData">0</div>
            <div class="hero-stats">
                <div class="hero-stat">
                    <div class="hero-stat-value" id="totalDiambil">0</div>
                    <div class="hero-stat-label">✅ Selesai</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value" id="totalBelum">0</div>
                    <div class="hero-stat-label"> Pending</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
        <div class="quick-action" onclick="window.location.href='admin.html'">
            <div class="quick-action-icon gradient-bg">➕</div>
            <div class="quick-action-label">Tambah</div>
        </div>
        <div class="quick-action" onclick="filterByStatus('Sudah Diambil')">
            <div class="quick-action-icon" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">✅</div>
            <div class="quick-action-label">Selesai</div>
        </div>
        <div class="quick-action" onclick="filterByStatus('Belum Diambil')">
            <div class="quick-action-icon" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">⏳</div>
            <div class="quick-action-label">Pending</div>
        </div>
        <div class="quick-action" onclick="logout()">
            <div class="quick-action-icon" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">🚪</div>
            <div class="quick-action-label">Logout</div>
        </div>
    </div>

    <!-- Wilayah Section -->
    <div class="section-header">
        <div class="section-title">📍 Wilayah</div>
    </div>

    <div id="wilayahGrid"></div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="window.location.href='dashboard.html'">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Home</div>
        </div>
        <div class="nav-item" onclick="window.location.href='admin.html'">
            <div class="nav-icon">📝</div>
            <div class="nav-label">Data</div>
        </div>
        <div class="nav-item" onclick="window.location.href='teknisi.html'">
            <div class="nav-icon">👷</div>
            <div class="nav-label">Teknisi</div>
        </div>
        <div class="nav-item" onclick="logout()">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label">Logout</div>
        </div>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }
        
        document.getElementById('userName').textContent = userLoggedIn.nama;
        document.getElementById('userAvatar').textContent = userLoggedIn.nama.charAt(0).toUpperCase();
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }
        
        function filterByStatus(status) {
            window.location.href = 'admin.html?status=' + encodeURIComponent(status);
        }
        
        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;
            
            document.getElementById('totalData').textContent = pelanggan.length;
            document.getElementById('totalDiambil').textContent = pelanggan.filter(p => p.status === 'Sudah Diambil').length;
            document.getElementById('totalBelum').textContent = pelanggan.filter(p => p.status !== 'Sudah Diambil').length;
            
            const wilayahList = ['Sukamelang', 'Cibarola', 'Panglejar', 'Perum / Flamboyan'];
            const wilayahGrid = document.getElementById('wilayahGrid');
            const gradients = [
                'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)'
            ];
            
            wilayahList.forEach((w, index) => {
                const dataW = pelanggan.filter(p => p.wilayah === w);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status !== 'Sudah Diambil').length;
                
                wilayahGrid.innerHTML += `
                    <div class="modern-card animate-slide-up" onclick="window.location.href='admin.html?wilayah=${w}'" style="background: ${gradients[index]}; border: none; cursor: pointer;">
                        <div class="card-header">
                            <div>
                                <div class="card-title" style="color: white;">${w}</div>
                                <div class="card-subtitle" style="color: rgba(255,255,255,0.8);">${dataW.length} perangkat</div>
                            </div>
                            <div style="font-size: 24px;">›</div>
                        </div>
                        <div style="display: flex; gap: 20px; margin-top: 16px;">
                            <div>
                                <div style="font-size: 20px; font-weight: 700; color: white;">${diambil}</div>
                                <div style="font-size: 12px; color: rgba(255,255,255,0.8);">Selesai</div>
                            </div>
                            <div>
                                <div style="font-size: 20px; font-weight: 700; color: white;">${belum}</div>
                                <div style="font-size: 12px; color: rgba(255,255,255,0.8);">Pending</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        
        loadDashboard();
    </script>
</body>
</html>
