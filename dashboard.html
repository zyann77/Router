<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beranda — Penarikan Perangkat</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="nav-bar">
        <div>
            <div class="nav-eyebrow" id="greetTime">Selamat Datang</div>
            <div class="nav-title">Admin</div>
        </div>
        <button onclick="logout()" class="btn btn-icon btn-ghost" aria-label="Keluar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
    </div>

    <h1 class="nav-large-title">Pilih Wilayah</h1>
    <p class="nav-sub">Ketuk wilayah untuk melihat dan menambah data pelanggan di area tersebut.</p>

    <div class="region-tile-grid" id="wilayahGrid">
        <!-- filled by loadRegions() -->
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const hour = new Date().getHours();
        document.getElementById('greetTime').textContent = hour < 11 ? 'Selamat Pagi' : hour < 15 ? 'Selamat Siang' : hour < 18 ? 'Selamat Sore' : 'Selamat Malam';

        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }

        const wilayahList = ['Sukamelang', 'Cibarola', 'Panglejar', 'Perum / Flamboyan'];

        async function loadRegions() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('wilayah, status');
            const grid = document.getElementById('wilayahGrid');
            grid.innerHTML = '';

            wilayahList.forEach(w => {
                const dataW = (pelanggan || []).filter(p => p.wilayah === w);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status !== 'Sudah Diambil').length;

                const tile = document.createElement('div');
                tile.className = 'region-tile';
                tile.onclick = () => window.location.href = 'admin.html?wilayah=' + encodeURIComponent(w);
                tile.innerHTML = `
                    <div class="signet sm">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    </div>
                    <div class="region-tile-body">
                        <div class="region-tile-name">${w}</div>
                        <div class="region-tile-tally">
                            <span><b>${dataW.length}</b> total</span>
                            <span><b>${diambil}</b> diambil</span>
                            <span><b>${belum}</b> belum</span>
                        </div>
                    </div>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--ink-faint);flex-shrink:0;"><polyline points="9 18 15 12 9 6"/></svg>
                `;
                grid.appendChild(tile);
            });
        }

        loadRegions();
    </script>
</body>
</html>
