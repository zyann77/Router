<!DOCTYPE html>
<html lang="su">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dasbor - RNB Premium Network</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(30px);
            --aurora-1: #8B5CF6; --aurora-2: #3B82F6;
            --accent-gold: #C9A961; --accent-gold-light: #E5C97A;
            --success: #10B981; --warning: #F59E0B; --danger: #EF4444;
            --text-main: #FFFFFF; --text-muted: #A1A1AA;
            --font-main: 'Poppins', sans-serif;
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --smooth: cubic-bezier(0.25, 1, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-main); min-height: 100vh; overflow-x: hidden; padding-bottom: 120px; }

        .bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .aurora-blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.35; mix-blend-mode: screen; animation: floatBlob 20s infinite alternate ease-in-out; }
        .blob-1 { width: 450px; height: 450px; background: var(--aurora-1); top: -10%; left: -10%; }
        .blob-2 { width: 400px; height: 400px; background: var(--aurora-2); bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 300px; height: 300px; background: var(--accent-gold); top: 30%; left: 30%; opacity: 0.15; animation-duration: 25s; }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, 80px) scale(1.2); } 100% { transform: translate(-30px, -50px) scale(0.9); } }

        /* Premium Top Header */
        .top-header { position: sticky; top: 0; z-index: 100; background: rgba(5, 5, 5, 0.7); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--glass-border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-buttons { display: flex; gap: 10px; }
        .nav-btn { width: 40px; height: 40px; border-radius: 14px; background: var(--glass-bg); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s var(--spring); text-decoration: none; }
        .nav-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.1); }
        .nav-btn:active { transform: scale(0.9); }
        .nav-btn svg { width: 20px; height: 20px; stroke: var(--text-main); stroke-width: 1.5; fill: none; }
        
        .header-title-box { text-align: center; flex: 1; }
        .header-title { font-size: 16px; font-weight: 700; color: white; letter-spacing: 0.5px; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* Stats Main Card */
        .stats-main { background: linear-gradient(135deg, rgba(201,169,97,0.2), rgba(201,169,97,0.05)); border: 1px solid rgba(201,169,97,0.3); border-radius: 28px; padding: 30px; text-align: center; position: relative; overflow: hidden; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); animation: slideUp 0.6s var(--spring) forwards; }
        .stats-main::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent); transform: rotate(45deg); animation: shineGlow 6s infinite linear; pointer-events: none; }
        .stats-label { font-size: 12px; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-bottom: 10px; }
        .stats-val-big { font-size: 64px; font-weight: 800; line-height: 1; color: var(--accent-gold); text-shadow: 0 10px 20px rgba(201,169,97,0.3); margin-bottom: 25px; }
        
        .stats-row { display: flex; justify-content: center; gap: 30px; }
        .stat-mini { display: flex; flex-direction: column; align-items: center; }
        .stat-mini-val { font-size: 24px; font-weight: 700; color: white; }
        .stat-mini-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        /* Wilayah Grid */
        .section-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-bottom: 15px; padding-left: 5px; }
        .wilayah-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        
        .w-card { background: var(--glass-bg); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 24px; padding: 20px; cursor: pointer; transition: all 0.4s var(--spring); animation: slideUp 0.8s var(--spring) forwards; opacity: 0; display: flex; flex-direction: column; text-decoration: none; }
        .w-card:nth-child(1) { animation-delay: 0.1s; } .w-card:nth-child(2) { animation-delay: 0.2s; } .w-card:nth-child(3) { animation-delay: 0.3s; } .w-card:nth-child(4) { animation-delay: 0.4s; }
        
        /* Interactive styles only apply if it's an <a> tag (Admin) */
        a.w-card:hover { transform: translateY(-5px) scale(1.02); border-color: rgba(201,169,97,0.4); background: rgba(201,169,97,0.05); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        a.w-card:active { transform: scale(0.95); }

        /* Read-only styles (Teknisi) */
        div.w-card { cursor: default; }
        
        .w-icon { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .w-icon svg { width: 18px; height: 18px; stroke: var(--accent-gold); stroke-width: 1.5; fill: none; }
        .w-name { font-size: 15px; font-weight: 600; color: white; margin-bottom: 4px; }
        .w-total { font-size: 11px; color: var(--text-muted); margin-bottom: 15px; }
        
        .w-split { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .w-sub { text-align: center; flex: 1; }
        .w-sub-val { font-size: 16px; font-weight: 700; color: white; }
        .w-sub-val.done { color: var(--success); }
        .w-sub-val.pend { color: var(--warning); }
        .w-sub-lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

        /* Export Section (Admin Only) */
        .export-wrapper { margin-bottom: 24px; }
        .export-btn { width: 100%; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light)); color: #000; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; border: none; box-shadow: 0 10px 20px rgba(201,169,97,0.2); }
        .export-btn:active { transform: scale(0.97); }
        .export-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* Floating Dock & Notification */
        .dock-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; padding: 12px 20px; background: rgba(25, 25, 30, 0.7); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.15); z-index: 500; }
        .dock-item { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: all 0.3s var(--spring); }
        .dock-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-8px) scale(1.1); }
        .dock-item:active { transform: scale(0.9); }
        .dock-item svg { width: 22px; height: 22px; stroke: rgba(255,255,255,0.7); stroke-width: 1.5; fill: none; transition: stroke 0.3s; }
        .dock-item:hover svg { stroke: var(--text-main); }
        .dock-item.active svg { stroke: var(--accent-gold); }
        .dock-item.active::after { content: ''; position: absolute; bottom: -6px; width: 4px; height: 4px; background: var(--accent-gold); border-radius: 50%; }

        .notif-badge { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; background: var(--danger); border-radius: 50%; display: none; box-shadow: 0 0 0 2px rgba(25,25,30,1); }
        .notif-badge.active { display: block; animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .notif-popup { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%) scale(0.9); width: 320px; background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; padding: 0; display: none; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); z-index: 1000; cursor: default; overflow: hidden; opacity: 0; transition: all 0.3s var(--spring); }
        .notif-popup.active { display: block; opacity: 1; transform: translateX(-50%) scale(1); }
        .notif-popup-header { padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: white; }
        .clear-all { color: var(--accent-gold); font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .clear-all:active { opacity: 0.5; }
        .notif-list { max-height: 280px; overflow-y: auto; scrollbar-width: none; }
        .notif-item { padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; gap: 14px; align-items: flex-start; text-align: left; }
        .notif-item-icon { width: 36px; height: 36px; border-radius: 50%; background: rgba(16, 185, 129, 0.15); color: var(--success); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; border: 1px solid rgba(16, 185, 129, 0.3); }
        .notif-item-content { flex: 1; }
        .notif-item-title { font-size: 14px; font-weight: 600; color: white; margin-bottom: 4px; line-height: 1.2; }
        .notif-item-time { font-size: 11px; color: var(--text-muted); font-weight: 400; }
        .notif-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

        /* Toast Popup */
        .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(18, 18, 24, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 16px 24px; border-radius: 16px; z-index: 9999; font-size: 14px; font-weight: 500; color: white; transition: all 0.4s var(--spring); box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); }

        /* Page Trans */
        .page-transit { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.4s var(--smooth); }
        .page-transit.active { opacity: 1; pointer-events: all; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shineGlow { 0% { left: -50%; } 100% { left: 150%; } }

        /* Hide Admin elements by default */
        .admin-only { display: none; }
    </style>
</head>
<body>

    <div class="bg-layer">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
    </div>

    <div class="page-transit" id="pageTransit"></div>

    <div class="top-header">
        <div class="nav-buttons">
            <button class="nav-btn transit-link" href="index.html">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <a href="index.html" class="nav-btn transit-link">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
        </div>
        <div class="header-title-box">
            <div class="header-title">Dasbor Utama</div>
        </div>
        <div style="width: 90px;"></div>
    </div>

    <div class="container">
        <!-- Main Stats -->
        <div class="stats-main">
            <div class="stats-label">Total Perangkat Kadaptar</div>
            <div class="stats-val-big" id="totalData">0</div>
            <div class="stats-row">
                <div class="stat-mini">
                    <div class="stat-mini-val" id="totalDiambil">0</div>
                    <div class="stat-mini-lbl" style="color: var(--success);">Réngsé</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-mini-val" id="totalBelum">0</div>
                    <div class="stat-mini-lbl" style="color: var(--warning);">Katunda</div>
                </div>
            </div>
        </div>

        <div class="section-title">Distribusi Wewengkon</div>
        <div class="wilayah-grid" id="wilayahGrid"></div>

        <!-- Export Data (Admin Only) -->
        <div class="export-wrapper admin-only">
            <div class="section-title" style="margin-top: 10px;">Laporan</div>
            <button class="export-btn" onclick="doExport('all')">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Unduh Data ka Excel
            </button>
        </div>
    </div>

    <!-- FLOATING DOCK -->
    <div class="dock-container">
        <!-- 1. Dashboard (Active) -->
        <div class="dock-item active transit-link" href="dashboard.html">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        
        <!-- 2. Admin Data (Admin Only) -->
        <div class="dock-item admin-only transit-link" href="admin.html">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        
        <!-- 3. Notifikasi (TENGAH - Admin Only) -->
        <div class="dock-item admin-only" id="notifBtn" onclick="toggleNotifPopup(event)">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <div class="notif-badge" id="notifBadge"></div>
            
            <div class="notif-popup" id="notifPopup" onclick="event.stopPropagation()">
                <div class="notif-popup-header">
                    <span>Béwara Anyar</span>
                    <span class="clear-all" onclick="clearAllNotifs(event)">Beresihan</span>
                </div>
                <div class="notif-list" id="notifList">
                    <div class="notif-empty">Sistem aman. Teu acan aya aktivitas anyar.</div>
                </div>
            </div>
        </div>

        <!-- 4. Teknisi -->
        <div class="dock-item transit-link" href="teknisi.html">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        
        <!-- 5. Logout -->
        <div class="dock-item" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn) { window.location.href = 'login.html'; }
        
        const isAdmin = userLoggedIn.role === 'admin';

        if (isAdmin) {
            document.querySelectorAll('.admin-only').forEach(el => {
                if(el.classList.contains('dock-item')) el.style.display = 'flex';
                else el.style.display = 'block';
            });
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allData = [];

        function logout() { localStorage.removeItem('userLoggedIn'); window.location.href = 'login.html'; }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => { t.className = 'toast'; }, 3000); }

        // --- Logika Notifikasi (Hanya dieksekusi jika Admin) ---
        let sessionNotifs = [];

        function toggleNotifPopup(event) {
            if(!isAdmin) return;
            event.stopPropagation();
            const popup = document.getElementById('notifPopup');
            popup.classList.toggle('active');
            if (popup.classList.contains('active')) document.getElementById('notifBadge').classList.remove('active');
        }

        document.addEventListener('click', function(event) {
            if(!isAdmin) return;
            const popup = document.getElementById('notifPopup');
            const btn = document.getElementById('notifBtn');
            if (popup && popup.classList.contains('active') && !btn.contains(event.target)) {
                popup.classList.remove('active');
            }
        });

        function clearAllNotifs(event) {
            event.stopPropagation(); sessionNotifs = []; updateNotifUI();
            document.getElementById('notifPopup').classList.remove('active');
            showToast('Riwayat parantos diberesihan', 'success');
        }

        function updateNotifUI() {
            if(!isAdmin) return;
            const list = document.getElementById('notifList');
            if (sessionNotifs.length === 0) {
                list.innerHTML = '<div class="notif-empty">Sistem aman. Teu acan aya aktivitas anyar.</div>';
                return;
            }
            list.innerHTML = sessionNotifs.map(n => `
                <div class="notif-item">
                    <div class="notif-item-icon">✅</div>
                    <div class="notif-item-content">
                        <div class="notif-item-title">${n.nama}</div>
                        <div class="notif-item-time">${n.wilayah} • Pkl ${n.waktu}</div>
                    </div>
                </div>
            `).join('');
        }

        // --- Supabase Realtime ---
        if (isAdmin) {
            const processedNotifs = new Set();
            supabaseClient
                .channel('dashboard-realtime')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pelanggan' }, payload => {
                    const newData = payload.new;
                    if (newData.status === 'Sudah Diambil') {
                        const notifKey = newData.id + '_selesai';
                        if (!processedNotifs.has(notifKey)) {
                            processedNotifs.add(notifKey);
                            sessionNotifs.unshift({ nama: newData.nama_pelanggan, wilayah: newData.wilayah, waktu: new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}) });
                            updateNotifUI();
                            showToast(`🔔 ${newData.nama_pelanggan} parantos dicandak!`, 'success');
                            document.getElementById('notifBadge').classList.add('active');
                            loadDashboard(); 
                        }
                    }
                }).subscribe();
        }

        // --- Load Dashboard Data ---
        const serverIcon = `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="6" rx="2"/><rect x="2" y="15" width="20" height="6" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>`;
        const wilayahConfig = [{ name: 'Sukamelang' }, { name: 'Cibarola' }, { name: 'Panglejar' }, { name: 'Perum / Flamboyan' }];

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        async function loadDashboard() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*');
            if (!pelanggan) return;
            allData = pelanggan;
            
            animateValue(document.getElementById('totalData'), 0, pelanggan.length, 1000);
            animateValue(document.getElementById('totalDiambil'), 0, pelanggan.filter(p => p.status === 'Sudah Diambil').length, 1000);
            animateValue(document.getElementById('totalBelum'), 0, pelanggan.filter(p => p.status === 'Belum Diambil').length, 1000);
            
            const wilayahGrid = document.getElementById('wilayahGrid'); wilayahGrid.innerHTML = '';
            wilayahConfig.forEach((w, index) => {
                const dataW = pelanggan.filter(p => p.wilayah === w.name);
                const diambil = dataW.filter(p => p.status === 'Sudah Diambil').length;
                const belum = dataW.filter(p => p.status === 'Belum Diambil').length;
                
                const tagElement = isAdmin ? 'a' : 'div';
                const classTransit = isAdmin ? 'transit-link' : '';
                const hrefAttr = isAdmin ? `href="admin.html?wilayah=${encodeURIComponent(w.name)}"` : '';
                
                wilayahGrid.innerHTML += `
                    <${tagElement} class="w-card ${classTransit}" ${hrefAttr} style="animation-delay: ${index * 0.1}s">
                        <div class="w-icon">${serverIcon}</div>
                        <div class="w-name">${w.name}</div>
                        <div class="w-total">${dataW.length} Unit Total</div>
                        <div class="w-split">
                            <div class="w-sub"><div class="w-sub-val done">${diambil}</div><div class="w-sub-lbl">Réngsé</div></div>
                            <div class="w-sub"><div class="w-sub-val pend">${belum}</div><div class="w-sub-lbl">Katunda</div></div>
                        </div>
                    </${tagElement}>`;
            });
            
            bindTransitLinks();
        }

        // --- Export (Admin Only) ---
        function doExport(type) {
            if(!isAdmin) return;
            let dataToExport = type === 'all' ? allData : allData.filter(p => p.status === 'Sudah Diambil');
            if (dataToExport.length === 0) { showToast('Teu aya data pikeun diékspor', 'error'); return; }
            const exportData = dataToExport.map(p => ({ 'Nami': p.nama_pelanggan, 'HP': p.nomor_hp, 'Perangkat': p.perangkat || 'Router', 'Wewengkon': p.wilayah, 'Status': p.status }));
            const ws = XLSX.utils.json_to_sheet(exportData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data');
            XLSX.writeFile(wb, `Laporan_Dasbor_${new Date().toISOString().split('T')[0]}.xlsx`);
            showToast(`Ékspor suksés!`, 'success');
        }

        // --- Smooth Transition ---
        function bindTransitLinks() {
            const pageTransit = document.getElementById('pageTransit');
            document.querySelectorAll('.transit-link').forEach(link => {
                const newLink = link.cloneNode(true);
                link.parentNode.replaceChild(newLink, link);
                
                newLink.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    if(!href || this.getAttribute('target') === '_blank') return; 
                    e.preventDefault();
                    pageTransit.classList.add('active');
                    setTimeout(() => window.location.href = href, 400);
                });
            });
        }
        
        window.addEventListener('pageshow', e => { if(e.persisted) document.getElementById('pageTransit').classList.remove('active'); });

        loadDashboard();
    </script>
</body>
</html>
