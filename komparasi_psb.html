<!DOCTYPE html>
<html lang="su" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090B11" id="metaTheme">
<meta name="google" content="notranslate">
<title>Iyann RnB Network Tools - Komparasi PSB</title>

<script>
(function(){var t;try{t=localStorage.getItem('rnb-theme')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t;
document.getElementById('metaTheme').content=t==='light'?'#EEF1F7':'#090B11';})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root{--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--smooth:cubic-bezier(.25,1,.25,1)}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#090B11; --surface:#10131B; --surface-2:#161A24; --line:rgba(255,255,255,.08);
  --ink:#EEF1F8; --muted:#8C94A8; --accent:#7AA7FF; --accent-soft:rgba(122,167,255,.14);
  --violet:#B7A3FF; --violet-soft:rgba(183,163,255,.14); --glow:rgba(79,110,255,.20);
  --shadow:none; --logo-n:#fff; --logo-y:#FFD700;
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:rgba(15,23,42,.08);
  --ink:#0E1424; --muted:#5B657B; --accent:#2457F5; --accent-soft:rgba(36,87,245,.09);
  --violet:#6D3FE0; --violet-soft:rgba(109,63,224,.09); --glow:rgba(36,87,245,.13);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px -14px rgba(15,23,42,.14);
  --logo-n:#0E1424; --logo-y:#E0A400;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(900px 420px at 88% -8%,var(--glow),transparent 70%);background-repeat:no-repeat;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
          max(48px,calc(env(safe-area-inset-bottom) + 28px)) max(16px,env(safe-area-inset-left));
  transition:background-color .3s,color .3s;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
svg.s{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shell{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* Top bar */
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.btn-wangsul,.btn-theme{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  font-size:13px;font-weight:600;transition:transform .2s,background .2s;
}
.btn-wangsul{padding:0 16px 0 10px}
.btn-theme{width:42px}
.btn-wangsul:active,.btn-theme:active{transform:scale(.94)}
.btn-wangsul svg,.btn-theme svg{width:18px;height:18px}
.logo-rnb-box{margin-left:auto;display:flex;align-items:center}
.logo-rnb-box svg{height:40px;width:auto;overflow:visible}
.ln{fill:var(--logo-n)} .ly{fill:var(--logo-y)} .ly-s{stroke:var(--logo-y)}
.ico-sun{display:none} html[data-theme=light] .ico-sun{display:block} html[data-theme=light] .ico-moon{display:none}

/* Hero selisih */
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:22px;color:#fff;
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:22px 32px;
  background:linear-gradient(140deg,#2563EB 0%,#3F3FD8 100%);box-shadow:0 18px 40px -18px rgba(37,99,235,.55);
}
.hero::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 38px rgba(255,255,255,.04),0 0 0 76px rgba(255,255,255,.03);pointer-events:none}
.hero>*{position:relative}
.hero h1{font-size:16px;font-weight:700;line-height:1.35}
.hero p{font-size:12px;color:rgba(255,255,255,.72);margin-top:4px;line-height:1.5}
.stats{display:flex;flex-wrap:wrap;gap:18px 32px}
.sv{font-size:clamp(34px,10vw,44px);font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sv.money{font-size:clamp(22px,6.4vw,28px);padding-top:calc(clamp(34px,10vw,44px) - clamp(22px,6.4vw,28px))}
.sl{font-size:12px;color:rgba(255,255,255,.72);margin-top:8px;font-weight:500}

/* Tab (HP) */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.seg button{height:40px;border-radius:12px;font-size:13px;font-weight:600;color:var(--muted);transition:background .25s,color .25s}
.seg button[aria-selected=true]{background:var(--ink);color:var(--bg);font-weight:700}

/* Panel kolom */
.cmp{display:block}
.col{display:none;--c:var(--accent);--c-soft:var(--accent-soft)}
.col.prev{--c:var(--violet);--c-soft:var(--violet-soft)}
.col.on{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.panel-head{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.panel-title{font-size:16px;font-weight:700}
.panel-sub{font-size:12px;color:var(--muted);margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 20px}
.tile{background:var(--c-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.tl{font-size:12px;font-weight:600;color:var(--muted)}
.tv{font-size:clamp(26px,8vw,32px);font-weight:800;line-height:1.05;color:var(--c);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tv.m{font-size:clamp(14px,4.2vw,18px);letter-spacing:-.01em}
.list-title{font-size:13px;font-weight:700;margin-bottom:10px}

/* Paket */
.pkg-list{display:flex;flex-direction:column;gap:8px}
.package-card{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .3s}
.package-card.active{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.package-header{width:100%;text-align:left;display:grid;grid-template-columns:1fr 18px;align-items:center;column-gap:12px;row-gap:12px;padding:14px 16px}
.pkg-name{font-size:14px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.pkg-count{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 10px 3px 8px;border-radius:999px;
  background:var(--c-soft);color:var(--c);font-size:11.5px;font-weight:600}
.pkg-count::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pkg-arrow{width:18px;height:18px;color:var(--muted);transition:transform .3s var(--smooth)}
.package-card.active .pkg-arrow{transform:rotate(180deg)}
.pkg-share{grid-column:1/-1;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.pkg-share i{display:block;height:100%;border-radius:99px;background:var(--c)}
.package-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--smooth)}
.package-card.active .package-body{grid-template-rows:1fr}
.pb-clip{overflow:hidden;min-height:0}
.pb-list{padding:0 16px 6px;border-top:1px solid var(--line)}
.customer-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.customer-item:last-child{border-bottom:0}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--c-soft);color:var(--c);font-size:12.5px;font-weight:700}
.cust-info{flex:1;min-width:0}
.cust-name{font-size:13px;font-weight:600}
.cust-alamat{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.cust-date{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.state{text-align:center;padding:26px 16px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:16px}

.footer-text{text-align:center;font-size:11.5px;color:var(--muted);margin-top:22px}
.page-transit{position:fixed;inset:0;background:var(--bg);z-index:9999;opacity:0;pointer-events:none;transition:opacity .4s}
.page-transit.active{opacity:1;pointer-events:all}

/* PC */
@media (min-width:860px){
  body{padding-top:32px}
  .shell{max-width:1080px;gap:20px}
  .seg{display:none}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .col{display:block}
  .hero{padding:28px 32px}
  .hero h1{font-size:18px}
  .panel{padding:24px}
  .btn-wangsul:hover,.btn-theme:hover{background:var(--surface-2)}
  .package-card:hover{border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
}
@media (max-width:360px){.btn-wangsul{padding:0 12px 0 8px}.panel{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="page-transit" id="pageTransit"></div>

<div class="shell">
  <div class="top-bar">
    <a href="detail_psb.html" class="btn-wangsul transit-link">
      <svg class="s" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Kembali ke Detail
    </a>
    <div class="logo-rnb-box">
      <svg viewBox="0 0 130 70" xmlns="http://www.w3.org/2000/svg" aria-label="RnB by PMY NET">
        <text x="6" y="34" font-family="Arial Black, Impact, sans-serif" font-size="34" font-weight="900" fill="#E31E24">R</text>
        <text x="32" y="32" class="ln" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" transform="rotate(15 41 20)">n</text>
        <text x="44" y="34" font-family="Arial Black, Impact, sans-serif" font-size="34" font-weight="900" fill="#E31E24">B</text>
        <text x="6" y="42" class="ly" font-family="Arial, sans-serif" font-size="10" font-weight="600" font-style="italic">by</text>
        <ellipse class="ly-s" cx="48" cy="48" rx="30" ry="9" fill="none" stroke-width="1.8" transform="rotate(-12 48 48)"/>
        <text x="18" y="52" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#1E90FF" letter-spacing="-1">PMY</text>
        <text x="52" y="52" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#00C853" letter-spacing="-1">NET</text>
      </svg>
    </div>
    <button class="btn-theme" onclick="toggleTheme()" aria-label="Ganti tema terang atau gelap">
      <svg class="s ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="s ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <section class="hero">
    <div>
      <h1 id="bannerTitle">Komparasi performa PSB</h1>
      <p id="bannerSub">Perbandingan tanggal 1 s.d hari ini</p>
    </div>
    <div class="stats">
      <div>
        <div class="sv" id="deltaPsb">0</div>
        <div class="sl">Selisih PSB</div>
      </div>
      <div>
        <div class="sv money" id="deltaUang">Rp 0</div>
        <div class="sl">Selisih uang</div>
      </div>
    </div>
  </section>

  <div class="seg" role="tablist">
    <button role="tab" id="tabNow" aria-selected="true" onclick="setTab('now')"></button>
    <button role="tab" id="tabPrev" aria-selected="false" onclick="setTab('prev')"></button>
  </div>

  <div class="cmp">
    <section class="col now on" id="colNow">
      <div class="panel">
        <div class="panel-head"><span class="dot"></span>
          <div><div class="panel-title" id="titleColInilah">Bulan ini</div><div class="panel-sub" id="subColInilah"></div></div>
        </div>
        <div class="tiles">
          <div class="tile"><div class="tl">Total PSB</div><div class="tv" id="valPsbInilah">0</div></div>
          <div class="tile"><div class="tl">Total uang</div><div class="tv m" id="valUangInilah">Rp 0</div></div>
        </div>
        <div class="list-title">Rincian per paket</div>
        <div class="pkg-list" id="listPkgInilah"><div class="state">Memuat data…</div></div>
      </div>
    </section>

    <section class="col prev" id="colPrev">
      <div class="panel">
        <div class="panel-head"><span class="dot"></span>
          <div><div class="panel-title" id="titleColLalulah">Bulan lalu</div><div class="panel-sub" id="subColLalulah"></div></div>
        </div>
        <div class="tiles">
          <div class="tile"><div class="tl">Total PSB</div><div class="tv" id="valPsbLalulah">0</div></div>
          <div class="tile"><div class="tl">Total uang</div><div class="tv m" id="valUangLalulah">Rp 0</div></div>
        </div>
        <div class="list-title">Rincian per paket</div>
        <div class="pkg-list" id="listPkgLalulah"><div class="state">Memuat data…</div></div>
      </div>
    </section>
  </div>

  <div class="footer-text">RnB Network Subang, komparasi realtime</div>
</div>

<script>
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const namaBulanReal = ['Januari','Pébruari','Maret','April','Méi','Juni','Juli','Agustus','Séptémber','Oktober','Nopémber','Desémber'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + n.toLocaleString('id-ID');
const sgn = n => n > 0 ? '+' : n < 0 ? '−' : '';

function fmtTgl(s) {
    const clean = String(s || '').split('T')[0];
    const m = clean.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? `${+m[3]} ${namaBulanReal[+m[2] - 1].slice(0, 3)}` : clean;
}

function setTab(which) {
    const isNow = which === 'now';
    document.getElementById('colNow').classList.toggle('on', isNow);
    document.getElementById('colPrev').classList.toggle('on', !isNow);
    document.getElementById('tabNow').setAttribute('aria-selected', isNow);
    document.getElementById('tabPrev').setAttribute('aria-selected', !isNow);
}

async function muatDataKomparasi() {
    const now = new Date();
    const tglHariIni = now.getDate();
    let lastMonth = now.getMonth() - 1;
    let lastMonthYear = now.getFullYear();
    if (lastMonth < 0) { lastMonth = 11; lastMonthYear--; }

    const bulanIni = namaBulanReal[now.getMonth()];
    const bulanLalu = namaBulanReal[lastMonth];
    document.getElementById('bannerSub').textContent = `Perbandingan tanggal 1 s.d ${tglHariIni} ${bulanIni} ${now.getFullYear()}`;
    document.getElementById('titleColInilah').textContent = bulanIni;
    document.getElementById('titleColLalulah').textContent = bulanLalu;
    document.getElementById('subColInilah').textContent = `Tanggal 1 - ${tglHariIni}`;
    document.getElementById('subColLalulah').textContent = `Tanggal 1 - ${tglHariIni}`;
    document.getElementById('tabNow').textContent = bulanIni;
    document.getElementById('tabPrev').textContent = bulanLalu;

    try {
        const { data: psbSemua, error } = await supabaseClient
            .from('psb')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;

        let totalPsbInilah = 0, totalUangInilah = 0;
        let totalPsbLalulah = 0, totalUangLalulah = 0;
        const pkgInilah = {};
        const pkgLalulah = {};

        (psbSemua || []).forEach(item => {
            const tglInput = item.tanggal_pasang || item.created_at || item.tanggal;
            if (!tglInput) return;
            const d = new Date(String(tglInput).split('T')[0]);
            if (isNaN(d.getTime())) return;

            const itemDate = d.getDate();
            const itemMonth = d.getMonth();
            const itemYear = d.getFullYear();
            const harga = parseInt(item.harga) || 0;
            const namaPaket = item.paket || item.layanan || 'Paket Lainnya';

            if (itemDate <= tglHariIni) {
                if (itemMonth === now.getMonth() && itemYear === now.getFullYear()) {
                    totalPsbInilah++;
                    totalUangInilah += harga;
                    (pkgInilah[namaPaket] = pkgInilah[namaPaket] || []).push(item);
                } else if (itemMonth === lastMonth && itemYear === lastMonthYear) {
                    totalPsbLalulah++;
                    totalUangLalulah += harga;
                    (pkgLalulah[namaPaket] = pkgLalulah[namaPaket] || []).push(item);
                }
            }
        });

        document.getElementById('valPsbInilah').textContent = totalPsbInilah;
        document.getElementById('valUangInilah').textContent = rp(totalUangInilah);
        document.getElementById('valPsbLalulah').textContent = totalPsbLalulah;
        document.getElementById('valUangLalulah').textContent = rp(totalUangLalulah);

        const dPsb = totalPsbInilah - totalPsbLalulah;
        const dUang = totalUangInilah - totalUangLalulah;
        document.getElementById('deltaPsb').textContent = sgn(dPsb) + Math.abs(dPsb);
        document.getElementById('deltaUang').textContent = sgn(dUang) + rp(Math.abs(dUang));

        const renderSideList = (dataPkg, elementId, total) => {
            const el = document.getElementById(elementId);
            const sorted = Object.entries(dataPkg).sort((a, b) => b[1].length - a[1].length);

            if (sorted.length === 0) {
                el.innerHTML = '<div class="state">Tidak ada data</div>';
                return;
            }

            el.innerHTML = sorted.map(([name, list]) => {
                const share = Math.max(3, Math.round(list.length / total * 100));
                const pelangganHtml = list.map(p => {
                    const nama = p.nama || p.nama_pelanggan || 'Tanpa Nama';
                    return `
                    <div class="customer-item">
                        <div class="avatar">${esc(nama.trim().charAt(0).toUpperCase() || '?')}</div>
                        <div class="cust-info">
                            <div class="cust-name">${esc(nama)}</div>
                            <div class="cust-alamat">${esc(p.alamat || p.lokasi || '-')}</div>
                        </div>
                        <div class="cust-date">${esc(fmtTgl(p.tanggal_pasang || p.created_at || p.tanggal))}</div>
                    </div>`;
                }).join('');

                return `
                <div class="package-card">
                    <button class="package-header" onclick="toggleCompareCard(this)" aria-expanded="false">
                        <div>
                            <div class="pkg-name">${esc(name)}</div>
                            <div class="pkg-count">${list.length} terpasang</div>
                        </div>
                        <svg class="s pkg-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                        <div class="pkg-share" title="${share}% dari total PSB"><i style="width:${share}%"></i></div>
                    </button>
                    <div class="package-body"><div class="pb-clip"><div class="pb-list">${pelangganHtml}</div></div></div>
                </div>`;
            }).join('');
        };

        renderSideList(pkgInilah, 'listPkgInilah', totalPsbInilah);
        renderSideList(pkgLalulah, 'listPkgLalulah', totalPsbLalulah);

    } catch (err) {
        console.error('Gagal memuat data komparasi:', err);
        const msg = '<div class="state">Data gagal dimuat. Periksa koneksi, lalu muat ulang halaman.</div>';
        document.getElementById('listPkgInilah').innerHTML = msg;
        document.getElementById('listPkgLalulah').innerHTML = msg;
    }
}

function toggleCompareCard(headerEl) {
    const open = headerEl.parentElement.classList.toggle('active');
    headerEl.setAttribute('aria-expanded', open);
}

function toggleTheme() {
    const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.getElementById('metaTheme').content = t === 'light' ? '#EEF1F7' : '#090B11';
    try { localStorage.setItem('rnb-theme', t); } catch (e) {}
}

const pageTransit = document.getElementById('pageTransit');
document.querySelectorAll('.transit-link').forEach(link => {
    link.addEventListener('click', function (e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        pageTransit.classList.add('active');
        setTimeout(() => window.location.href = href, 400);
    });
});
window.addEventListener('pageshow', () => pageTransit.classList.remove('active'));

window.addEventListener('DOMContentLoaded', muatDataKomparasi);
</script>
</body>
</html>
