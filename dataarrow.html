<!DOCTYPE html>
<html lang="su" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10283B">
<meta name="google" content="notranslate">
<title>Data Arrow - RnB Network</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>

<style>
:root{--bg:#EDF2F4;--card:#fff;--ink:#10283B;--mut:#5F7585;--line:#DAE3E8;--teal:#0E8C86;--amber:#FFB81F;--danger:#C93434;--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Figtree',system-ui,-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--fb);min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
.top{background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:50}
.bar{max-width:1080px;margin:auto;height:64px;padding:0 16px;display:flex;align-items:center;gap:12px}
.back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;text-decoration:none}
.back:hover{background:rgba(255,255,255,.18)}
.ttl{flex:1;line-height:1.15}
.ttl b{display:block;font:700 20px var(--fd);letter-spacing:-.01em}
.ttl small{font-size:12.5px;color:#9FB6C6}
.role-badge{font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid}
.role-badge.admin{color:#FFD36B;background:rgba(255,184,31,.16);border-color:rgba(255,184,31,.4)}
.role-badge.teknisi{color:#6EE7B7;background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.4)}

.wrap{max-width:1080px;margin:auto;padding:16px 16px 110px}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 100%;position:relative}
.search .i{position:absolute;left:14px;top:50%;margin-top:-9px;color:var(--mut)}
.search input{width:100%;height:48px;padding:0 14px 0 42px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:16px;outline:0}
.search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,140,134,.15)}
.tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:7px 8px 7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--mut);display:flex;gap:8px;align-items:center}
.tab b{font:700 12.5px var(--fd);background:var(--bg);color:var(--ink);padding:2px 8px;border-radius:99px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on b{background:rgba(255,255,255,.18);color:#fff}
.btn{height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.ghost{background:var(--card);border:1px solid var(--line)}
.ghost:hover{border-color:var(--teal);color:var(--teal)}
.solid{background:var(--ink);color:#fff}
.solid:hover{background:#1B3D56}
.fab{display:none;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:52px;padding:0 22px;border-radius:26px;box-shadow:0 8px 24px rgba(16,40,59,.35);z-index:40}

/* Data: list on phone */
.table{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.thead{display:none}
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"tag dev" "name act" "addr addr";gap:7px 12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
#dataList .row:first-child{border-top:0}
.num{display:none}
.tag{grid-area:tag;justify-self:start;font:700 13px/1 var(--fd);letter-spacing:.02em;background:var(--amber);color:#3B2700;padding:7px 20px 7px 11px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.name{grid-area:name;font-weight:700;font-size:16.5px}
.addr{grid-area:addr;display:flex;gap:6px;align-items:flex-start;color:var(--mut);font-size:14px}
.addr .i{width:15px;height:15px;margin-top:3px}
.dev{grid-area:dev;justify-self:end;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;padding:5px 11px 5px 9px;border-radius:99px;background:#EEF1F3;color:var(--mut)}
.dev .i{width:15px;height:15px}
.dev.stb{background:#EEE9FF;color:#5B3FD0}
.dev.tv{background:#E2F1FB;color:#0B6FA8}
.act{grid-area:act;display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.ib.e:hover{color:var(--teal);border-color:var(--teal)}
.ib.d:hover{color:var(--danger);border-color:var(--danger)}
.empty{padding:44px 20px;text-align:center;color:var(--mut);font-size:14px}

/* Modal: bottom sheet on phone, dialog on PC */
.overlay{display:none;position:fixed;inset:0;background:rgba(16,40,59,.5);z-index:100;align-items:flex-end;justify-content:center}
.overlay.active{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h2{font:700 21px var(--fd);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px;outline:0;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px rgba(14,140,134,.15)}
.foot{display:flex;gap:10px;margin-top:20px}
.foot .btn{flex:1;height:48px;justify-content:center;font-size:15px}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:999;font-size:14px;font-weight:500;max-width:90vw;box-shadow:0 8px 24px rgba(16,40,59,.3);transition:transform .35s}
.toast.show{transform:translate(-50%,0)}

/* PC / tablet */
@media(min-width:760px){
 .wrap{padding:24px 24px 48px}
 .search{flex:0 1 340px}
 .tabs{flex:0 1 auto}
 .ghost.x{margin-left:auto}
 .fab{position:static;height:40px;padding:0 16px;border-radius:12px;box-shadow:none}
 .thead,.row{grid-template-columns:48px 150px 1.1fr 1.4fr 150px 88px;gap:0 14px;align-items:center}
 .thead{display:grid;padding:12px 20px;font-size:13px;font-weight:600;color:var(--mut);background:#F6F9FA;border-bottom:1px solid var(--line)}
 .row{grid-template-areas:"num tag name addr dev act";padding:12px 20px}
 .row:hover{background:#F8FBFB}
 .num{display:block;grid-area:num;color:var(--mut);font-weight:600}
 .name{font-size:15.5px}
 .dev{justify-self:start}
 .act{justify-self:end}
 .ib{width:34px;height:34px}
}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:90vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="bar">
    <a href="index.html" class="back" aria-label="Balik"><svg class="i" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></a>
    <div class="ttl"><b>Data Arrow</b><small>RnB Network</small></div>
    <div id="roleBadge" class="role-badge teknisi">Téknisi</div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <label class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="Cari nami, regist, alamat, perangkat" oninput="filterData()" autocomplete="off">
    </label>

    <div class="tabs">
      <button class="tab on" aria-pressed="true" onclick="setFilter('all',this)">Kabéh <b id="totalPelanggan">0</b></button>
      <button class="tab" aria-pressed="false" onclick="setFilter('stb',this)">STB <b id="totalStb">0</b></button>
      <button class="tab" aria-pressed="false" onclick="setFilter('tv',this)">Tv Android <b id="totalTv">0</b></button>
    </div>

    <button class="btn ghost x" onclick="exportToExcel()">
      <svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Excel
    </button>
    <button id="btnAddData" class="btn solid fab" onclick="openModal('add')">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tambah
    </button>
  </div>

  <div class="table">
    <div class="thead"><span>No</span><span>Regist</span><span>Nami pelanggan</span><span>Alamat</span><span>Perangkat</span><span></span></div>
    <div id="dataList"></div>
  </div>
</main>

<div class="overlay" id="formModal" onclick="if(event.target===this)closeModal()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Tambah Data Arrow</h2>
    <form id="arrowForm" onsubmit="handleFormSubmit(event)">
      <input type="hidden" id="editId">
      <div class="field"><label for="inputNama">Nami pelanggan</label><input type="text" id="inputNama" placeholder="Contoh: Alfaro" required></div>
      <div class="field"><label for="inputRegist">Regist</label><input type="text" id="inputRegist" placeholder="Contoh: WALIRAJA1" required></div>
      <div class="field"><label for="inputAlamat">Alamat</label><textarea id="inputAlamat" rows="3" placeholder="Contoh: Palabuan" required></textarea></div>
      <div class="field"><label for="inputPerangkat">Perangkat</label><input type="text" id="inputPerangkat" list="devs" placeholder="STB / Tv Android" required>
        <datalist id="devs"><option value="STB"><option value="Tv Android"></datalist></div>
      <div class="foot">
        <button type="button" class="btn ghost" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn solid" id="btnSubmit">Simpen</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUserRole = 'teknisi';
let localData = [];
let activeFilter = 'all';

const svg = p => '<svg class="i" viewBox="0 0 24 24">' + p + '</svg>';
const IC = {
  pin: svg('<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>'),
  stb: svg('<rect x="2" y="8" width="20" height="9" rx="2"/><path d="M6 12.5h.01M10 12.5h7"/>'),
  tv:  svg('<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  edit: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  del: svg('<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>')
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function checkUserRole() {
  const userStr = localStorage.getItem('userLoggedIn');
  const badge = document.getElementById('roleBadge');
  const btnAdd = document.getElementById('btnAddData');
  if (userStr) {
    const user = JSON.parse(userStr);
    currentUserRole = user.role || 'teknisi';
  }
  if (currentUserRole === 'admin') {
    badge.textContent = 'Admin';
    badge.className = 'role-badge admin';
    btnAdd.style.display = 'inline-flex';
  } else {
    badge.textContent = 'Téknisi';
    badge.className = 'role-badge teknisi';
    btnAdd.style.display = 'none';
  }
}

// Urut alfanumerik (WALIRAJA1, WALIRAJA2, WALIRAJA3, dst)
function sortDataByRegist(data) {
  return data.sort((a, b) => (a.regist || '').localeCompare(b.regist || '', undefined, { numeric: true, sensitivity: 'base' }));
}

function typeOf(p) {
  p = (p || '').toLowerCase();
  if (p.includes('stb')) return 'stb';
  if (p.includes('tv') || p.includes('android')) return 'tv';
  return 'other';
}

function updateWidgetStats(data) {
  document.getElementById('totalPelanggan').textContent = data.length;
  document.getElementById('totalStb').textContent = data.filter(i => typeOf(i.perangkat) === 'stb').length;
  document.getElementById('totalTv').textContent = data.filter(i => typeOf(i.perangkat) === 'tv').length;
}

async function loadData() {
  document.getElementById('dataList').innerHTML = '<div class="empty">Nuju ngamuat data...</div>';
  try {
    const { data, error } = await supabaseClient.from('data_arrow').select('*');
    if (error) throw error;
    localData = sortDataByRegist(data || []);
  } catch (err) {
    console.warn('Menggunakan data lokal:', err);
    if (localData.length === 0) {
      localData = [
        { id: '1', nama: 'Alfaro', regist: 'WALIRAJA1', alamat: 'Palabuan', perangkat: 'Tv Android' },
        { id: '2', nama: 'Vera Yulianti 1', regist: 'WALIRAJA2', alamat: 'Palabuan', perangkat: 'STB' },
        { id: '3', nama: 'Vera Yulianti 2', regist: 'WALIRAJA3', alamat: 'Palabuan', perangkat: 'STB' }
      ];
    }
    localData = sortDataByRegist(localData);
  }
  updateWidgetStats(localData);
  filterData();
}

function renderData(items) {
  const container = document.getElementById('dataList');
  if (!items || items.length === 0) {
    container.innerHTML = '<div class="empty">Taya data anu kapendak.</div>';
    return;
  }
  const admin = currentUserRole === 'admin';
  container.innerHTML = items.map((item, index) => {
    const t = typeOf(item.perangkat);
    const id = escapeHtml(item.id);
    return `
    <div class="row">
      <span class="num">${index + 1}</span>
      <span class="tag">${escapeHtml(item.regist)}</span>
      <span class="name">${escapeHtml(item.nama)}</span>
      <span class="addr">${IC.pin}<span>${escapeHtml(item.alamat)}</span></span>
      <span class="dev ${t}">${t === 'tv' ? IC.tv : IC.stb}${escapeHtml(item.perangkat)}</span>
      ${admin ? `<span class="act">
        <button class="ib e" aria-label="Edit" onclick="openModal('edit','${id}')">${IC.edit}</button>
        <button class="ib d" aria-label="Hapus" onclick="hapusData('${id}')">${IC.del}</button>
      </span>` : ''}
    </div>`;
  }).join('');
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.tab').forEach(t => {
    const on = t === btn;
    t.classList.toggle('on', on);
    t.setAttribute('aria-pressed', on);
  });
  filterData();
}

function filterData() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = localData.filter(item =>
    (activeFilter === 'all' || typeOf(item.perangkat) === activeFilter) &&
    [item.nama, item.regist, item.perangkat, item.alamat].some(v => (v || '').toLowerCase().includes(q))
  );
  renderData(sortDataByRegist(filtered));
}

function exportToExcel() {
  if (!localData || localData.length === 0) {
    showToast('Taya data anu tiasa di-export!');
    return;
  }
  const exportArr = localData.map((item, idx) => ({
    'No': idx + 1,
    'Regist': item.regist || '',
    'Nama Pelanggan': item.nama || '',
    'Alamat': item.alamat || '',
    'Perangkat': item.perangkat || ''
  }));
  const worksheet = XLSX.utils.json_to_sheet(exportArr);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, 'Data Arrow');
  worksheet['!cols'] = [{ wch: 5 }, { wch: 15 }, { wch: 25 }, { wch: 30 }, { wch: 20 }];
  XLSX.writeFile(workbook, `Data_Arrow_RnB_Network_${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('Suksés mengunduh file Excel!');
}

function openModal(mode, id = null) {
  const form = document.getElementById('arrowForm');
  form.reset();
  document.getElementById('editId').value = '';
  if (mode === 'edit' && id) {
    const item = localData.find(d => String(d.id) === String(id));
    if (item) {
      document.getElementById('modalTitle').textContent = 'Edit Data Arrow';
      document.getElementById('editId').value = item.id;
      document.getElementById('inputNama').value = item.nama;
      document.getElementById('inputRegist').value = item.regist;
      document.getElementById('inputAlamat').value = item.alamat;
      document.getElementById('inputPerangkat').value = item.perangkat;
    }
  } else {
    document.getElementById('modalTitle').textContent = 'Tambah Data Arrow';
  }
  document.getElementById('formModal').classList.add('active');
  setTimeout(() => document.getElementById('inputNama').focus(), 50);
}

function closeModal() {
  document.getElementById('formModal').classList.remove('active');
}

async function handleFormSubmit(e) {
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const payload = {
    nama: document.getElementById('inputNama').value.trim(),
    regist: document.getElementById('inputRegist').value.trim(),
    alamat: document.getElementById('inputAlamat').value.trim(),
    perangkat: document.getElementById('inputPerangkat').value.trim()
  };
  try {
    if (id) {
      const { error } = await supabaseClient.from('data_arrow').update(payload).eq('id', id);
      if (error) throw error;
      showToast('Data suksés diébit!');
    } else {
      const { error } = await supabaseClient.from('data_arrow').insert([payload]);
      if (error) throw error;
      showToast('Data suksés ditambihkeun!');
    }
    closeModal();
    loadData();
  } catch (err) {
    console.error(err);
    if (id) {
      const index = localData.findIndex(d => String(d.id) === String(id));
      if (index !== -1) localData[index] = { id, ...payload };
    } else {
      localData.unshift({ id: Date.now().toString(), ...payload });
    }
    localData = sortDataByRegist(localData);
    updateWidgetStats(localData);
    closeModal();
    filterData();
    showToast('Data disimpen secara lokal.');
  }
}

async function hapusData(id) {
  if (!confirm('Apakah Anda yakin ingin menghapus data ini?')) return;
  try {
    const { error } = await supabaseClient.from('data_arrow').delete().eq('id', id);
    if (error) throw error;
    showToast('Data suksés dihapus!');
    loadData();
  } catch (err) {
    localData = localData.filter(d => String(d.id) !== String(id));
    updateWidgetStats(localData);
    filterData();
    showToast('Data dihapus dari memori lokal.');
  }
}

function escapeHtml(text) {
  return String(text ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('DOMContentLoaded', () => { checkUserRole(); loadData(); });
</script>
</body>
</html>
