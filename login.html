<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Penarikan Perangkat</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
</head>
<body class="fade-in" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="glass-card" style="width: 100%; max-width: 400px;">
    <h2 style="text-align: center; margin-bottom: 24px;">🔐 Login Aplikasi</h2>
    <form id="loginForm">
      <div style="margin-bottom: 16px;">
        <label style="color: var(--text-muted); font-size: 14px;">Email</label>
        <input type="email" id="email" required class="glass-card" style="width: 100%; padding: 12px; margin-top: 4px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px;">
      </div>
      <div style="margin-bottom: 24px;">
        <label style="color: var(--text-muted); font-size: 14px;">Password</label>
        <input type="password" id="password" required class="glass-card" style="width: 100%; padding: 12px; margin-top: 4px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px;">
      </div>
      <button type="submit" class="btn btn-primary">
        <span class="material-icons">login</span> Masuk
      </button>
    </form>
  </div>

  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        Swal.fire('Error', error.message, 'error');
      } else {
        // Ambil role user
        const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
        if (profile?.role === 'admin') window.location.href = 'dashboard.html';
        else window.location.href = 'teknisi.html';
      }
    });
  </script>
</body>
</html>
