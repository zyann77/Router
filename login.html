<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .login-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: var(--spacing-3xl) var(--spacing-xl);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 48px;
        }
        
        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--ios-blue) 0%, #5856D6 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3);
        }
        
        .login-title {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.021em;
        }
        
        .login-subtitle {
            font-size: 17px;
            color: var(--text-secondary);
        }
        
        .error-banner {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: var(--ios-red);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-xl);
            font-size: 15px;
            display: none;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 13px;
            color: var(--text-tertiary);
        }
    </style>
</head>
<body>
    <div class="login-screen">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h1 class="login-title">Selamat Datang</h1>
            <p class="login-subtitle">Masuk untuk melanjutkan</p>
        </div>
        
        <div id="errorMsg" class="error-banner"></div>
        
        <form id="loginForm">
            <div class="ios-input-group">
                <input type="text" id="username" class="ios-input" placeholder="Username" required>
                <input type="password" id="password" class="ios-input" placeholder="Password" required>
            </div>
            
            <button type="submit" class="ios-btn ios-btn-primary ios-btn-full ios-btn-large" style="margin-top: 24px;">
                Masuk
            </button>
        </form>
        
        <div class="login-footer">
            Penarikan Perangkat v1.0
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';
            
            try {
                const { data: user, error } = await supabaseClient
                    .from('profiles')
                    .select('id, username, password_hash, nama, role')
                    .eq('username', username)
                    .single();
                
                if (error || !user) {
                    throw new Error('Username tidak ditemukan');
                }
                
                if (user.password_hash !== password) {
                    throw new Error('Password salah');
                }
                
                localStorage.setItem('userLoggedIn', JSON.stringify({
                    id: user.id,
                    username: user.username,
                    nama: user.nama,
                    role: user.role
                }));
                
                if (user.role === 'admin') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'teknisi.html';
                }
                
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
