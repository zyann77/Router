<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk — Penarikan Perangkat</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="signet lg">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
                </div>
                <h1 class="login-title">Selamat Datang</h1>
                <p class="login-subtitle">Masuk untuk melanjutkan sesi kerja Anda</p>
            </div>

            <div id="errorMsg" class="error-banner"></div>

            <form id="loginForm">
                <div class="field">
                    <label class="field-label">Username</label>
                    <input type="text" id="username" class="field-input" placeholder="Masukkan username" autocomplete="username" required>
                </div>

                <div class="field" style="margin-bottom: 30px;">
                    <label class="field-label">Kata Sandi</label>
                    <input type="password" id="password" class="field-input" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-brass btn-full btn-lg">Masuk</button>
            </form>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Memeriksa…';

            try {
                const { data: user, error } = await supabaseClient
                    .from('profiles')
                    .select('id, username, password_hash, nama, role')
                    .eq('username', username)
                    .single();

                if (error || !user) {
                    throw new Error('Username tidak ditemukan');
                }

                if (user.password_hash !== password) {
                    throw new Error('Kata sandi salah');
                }

                localStorage.setItem('userLoggedIn', JSON.stringify({
                    id: user.id,
                    username: user.username,
                    nama: user.nama,
                    role: user.role
                }));

                window.location.href = user.role === 'admin' ? 'dashboard.html' : 'teknisi.html';

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Masuk';
            }
        });
    </script>
</body>
</html>
