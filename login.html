<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Penarikan Perangkat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0F172A;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            padding: 16px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; margin-bottom: 24px; }
        label { color: #94A3B8; font-size: 14px; display: block; margin-bottom: 4px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #2563EB; }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            background: #2563EB;
            color: white;
        }
        button:hover { background: #1d4ed8; }
        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #DC2626;
            color: #FCA5A5;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Login Aplikasi</h2>
        <div id="errorMsg" class="error"></div>
        <form id="loginForm">
            <label>Username</label>
            <input type="text" id="username" required placeholder="admin atau teknisi">
            <label>Password</label>
            <input type="password" id="password" required placeholder="••••••••">
            <button type="submit">Masuk</button>
        </form>
    </div>
    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
            try {
                const { data: user, error } = await supabaseClient
                    .from('profiles')
                    .select('id, username, password_hash, nama, role')
                    .eq('username', username)
                    .single();
                if (error || !user) throw new Error('Username tidak ditemukan');
                if (user.password_hash !== password) throw new Error('Password salah');
                localStorage.setItem('userLoggedIn', JSON.stringify({
                    id: user.id,
                    username: user.username,
                    nama: user.nama,
                    role: user.role
                }));
                if (user.role === 'admin') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'teknisi.html';
                }
            } catch (err) {
                errorMsg.textContent = '❌ ' + err.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
