<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola Data — Penarikan Perangkat</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        .coord-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 13px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--hairline);
            background: rgba(201, 169, 110, 0.05);
            font-size: 13px;
            color: var(--ink-soft);
        }
        .coord-preview svg { width: 15px; height: 15px; color: var(--brass); flex-shrink: 0; }
        .coord-preview a { color: var(--brass-soft); font-weight: 600; margin-left: auto; white-space: nowrap; }
        .entry-swatch { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .leaflet-control-attribution { background: rgba(11,11,13,0.7) !important; color: var(--ink-faint) !important; font-size: 9px !important; }
        .leaflet-control-attribution a { color: var(--ink-soft) !important; }
        #locateBtn { position: absolute; z-index: 1000; top: 10px; right: 10px; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-title">Kelola Data</div>
        <a href="dashboard.html" class="btn btn-icon btn-ghost" aria-label="Kembali">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </a>
    </div>

    <h1 class="nav-large-title">Tambah Data</h1>
    <p class="nav-sub">Ketuk peta untuk menandai titik lokasi — latitude &amp; longitude terisi otomatis.</p>

    <form id="formPelanggan">
        <div class="form-section panel">
            <div id="regionLocked" class="region-locked" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span id="regionLockedName"></span>
                <a href="dashboard.html">Ganti</a>
            </div>

            <div class="field" id="wilayahFieldWrap">
                <label class="field-label">Wilayah</label>
                <select id="wilayah" class="field-select" required>
                    <option value="">Pilih wilayah</option>
                    <option value="Sukamelang">Sukamelang</option>
                    <option value="Cibarola">Cibarola</option>
                    <option value="Panglejar">Panglejar</option>
                    <option value="Perum / Flamboyan">Perum / Flamboyan</option>
                </select>
            </div>

            <div class="field">
                <label class="field-label">Nama Pelanggan</label>
                <input type="text" id="nama" class="field-input" placeholder="Nama lengkap" required>
            </div>

            <div class="field">
                <label class="field-label">Nomor HP / WhatsApp</label>
                <input type="text" id="nomor_hp" class="field-input" placeholder="08xxxxxxxxxx" required>
            </div>

            <div class="field-row">
                <div class="field">
                    <label class="field-label">Latitude</label>
                    <input type="number" id="latitude" class="field-input mono" step="any" placeholder="-6.xxxxxx" required>
                </div>
                <div class="field">
                    <label class="field-label">Longitude</label>
                    <input type="number" id="longitude" class="field-input mono" step="any" placeholder="107.xxxxxx" required>
                </div>
            </div>

            <div class="field">
                <label class="field-label">Titik Koordinat</label>
                <div class="map-picker" style="position:relative;">
                    <div id="coordMap" style="width:100%; height:100%;"></div>
                    <button type="button" id="locateBtn" class="btn btn-icon btn-brass" style="width:36px;height:36px;" aria-label="Gunakan lokasi saat ini">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2"/></svg>
                    </button>
                </div>
                <div class="map-picker-hint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    Ketuk atau geser pin untuk memilih titik. Tombol bulat = lokasi Anda saat ini.
                </div>
            </div>

            <div id="coordPreview" class="coord-preview" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span>Titik lokasi siap</span>
                <a id="coordPreviewLink" href="#" target="_blank">Buka di Google Maps →</a>
            </div>
        </div>

        <div class="sticky-bar" style="position: static; background: none; padding: 24px;">
            <button type="submit" class="btn btn-brass btn-full btn-lg">Simpan Data</button>
        </div>
    </form>

    <div class="section-title" style="padding-top: 6px;">Daftar Pelanggan</div>

    <div class="toolbar-row">
        <button id="btnExport" type="button" class="btn btn-outline-brass">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export Excel
        </button>
        <button id="btnImport" type="button" class="btn btn-ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Import Excel
        </button>
        <input type="file" id="importFile" accept=".xlsx,.xls,.csv" style="display:none;">
    </div>

    <div class="search-wrap" style="padding-top: 0;">
        <div class="search-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchTable" placeholder="Cari nama, HP, atau wilayah…">
        </div>
    </div>

    <div style="padding: 0 24px 40px;" id="tableBody"></div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---- Region lock from ?wilayah= query param (came from home tile) ----
        const params = new URLSearchParams(window.location.search);
        const wParam = params.get('wilayah');
        const wilayahSelect = document.getElementById('wilayah');

        if (wParam) {
            document.getElementById('regionLocked').style.display = 'flex';
            document.getElementById('regionLockedName').textContent = wParam;
            document.getElementById('wilayahFieldWrap').style.display = 'none';
            wilayahSelect.value = wParam;
            wilayahSelect.required = false;
        }

        // ---- Coordinate map picker (Leaflet + OpenStreetMap, no API key needed) ----
        const latInput = document.getElementById('latitude');
        const lngInput = document.getElementById('longitude');
        const preview = document.getElementById('coordPreview');
        const previewLink = document.getElementById('coordPreviewLink');

        const DEFAULT_CENTER = [-6.5717, 107.7576]; // Subang, Jawa Barat
        const map = L.map('coordMap', { attributionControl: true }).setView(DEFAULT_CENTER, 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let marker = null;

        function setMarker(lat, lng, recenter) {
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng], { draggable: true }).addTo(map);
                marker.on('dragend', (ev) => {
                    const p = ev.target.getLatLng();
                    updateFromLatLng(p.lat, p.lng);
                });
            }
            if (recenter) map.setView([lat, lng], 16);
            latInput.value = lat.toFixed(6);
            lngInput.value = lng.toFixed(6);
            updatePreview();
        }

        function updateFromLatLng(lat, lng) {
            latInput.value = lat.toFixed(6);
            lngInput.value = lng.toFixed(6);
            updatePreview();
        }

        map.on('click', (e) => setMarker(e.latlng.lat, e.latlng.lng, false));

        document.getElementById('locateBtn').addEventListener('click', () => {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                (pos) => setMarker(pos.coords.latitude, pos.coords.longitude, true),
                () => Swal.fire({ title: 'Tidak bisa mengambil lokasi', text: 'Izinkan akses lokasi di browser Anda.', icon: 'error', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' })
            );
        });

        function updatePreview() {
            const lat = latInput.value, lng = lngInput.value;
            if (lat && lng) {
                preview.style.display = 'flex';
                previewLink.href = `https://www.google.com/maps?q=${lat},${lng}`;
            } else {
                preview.style.display = 'none';
            }
        }

        [latInput, lngInput].forEach(input => {
            input.addEventListener('change', () => {
                const lat = parseFloat(latInput.value), lng = parseFloat(lngInput.value);
                if (!isNaN(lat) && !isNaN(lng)) setMarker(lat, lng, true);
            });
        });

        setTimeout(() => map.invalidateSize(), 200);

        // ---- Form submit ----
        document.getElementById('formPelanggan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const wilayahValue = wParam || wilayahSelect.value;
            const { error } = await supabaseClient.from('pelanggan').insert([{
                nama_pelanggan: document.getElementById('nama').value,
                nomor_hp: document.getElementById('nomor_hp').value,
                latitude: latInput.value,
                longitude: lngInput.value,
                wilayah: wilayahValue,
                status: 'Belum Diambil'
            }]);

            if (!error) {
                Swal.fire({ title: 'Berhasil', text: 'Data disimpan', icon: 'success', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' });
                document.getElementById('nama').value = '';
                document.getElementById('nomor_hp').value = '';
                loadTable();
            } else {
                Swal.fire({ title: 'Error', text: error.message, icon: 'error', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' });
            }
        });

        async function deleteData(id) {
            const result = await Swal.fire({
                title: 'Hapus data?',
                text: 'Data tidak bisa dikembalikan.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, hapus',
                cancelButtonText: 'Batal',
                background: '#18171b',
                color: '#f3efe7',
                confirmButtonColor: '#9a4a4a',
                cancelButtonColor: '#2a2930'
            });

            if (result.isConfirmed) {
                const { error } = await supabaseClient.from('pelanggan').delete().eq('id', id);
                if (!error) {
                    Swal.fire({ title: 'Terhapus', icon: 'success', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' });
                    loadTable();
                }
            }
        }

        let currentData = [];

        async function loadTable() {
            let query = supabaseClient.from('pelanggan').select('*').order('created_at', { ascending: false });
            if (wParam) query = query.eq('wilayah', wParam);
            const { data: pelanggan } = await query;
            currentData = pelanggan || [];

            const container = document.getElementById('tableBody');
            container.innerHTML = '';

            if (currentData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="signet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>
                        <div class="empty-title">Belum ada data</div>
                        <div>Tambahkan pelanggan pertama di atas.</div>
                    </div>`;
                return;
            }

            currentData.forEach(p => {
                const isDone = p.status === 'Sudah Diambil';
                const mapsLink = (p.latitude && p.longitude) ? `https://www.google.com/maps?q=${p.latitude},${p.longitude}` : null;
                const card = document.createElement('div');
                card.className = `entry-card ${isDone ? 'done' : 'pending'}`;
                card.innerHTML = `
                    <div class="entry-swatch">
                        <div>
                            <div class="entry-name">${p.nama_pelanggan}</div>
                            <div class="entry-meta" style="margin-top:6px;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                                ${p.nomor_hp}
                            </div>
                            <div class="entry-meta" style="margin-bottom:0;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                ${p.wilayah || '-'}
                            </div>
                        </div>
                        <button onclick="deleteData('${p.id}')" class="btn btn-icon btn-danger" aria-label="Hapus">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:16px;">
                        <span class="status ${isDone ? 'done' : 'pending'}"><span class="status-dot"></span>${p.status}</span>
                        ${mapsLink ? `<a href="${mapsLink}" target="_blank" class="btn btn-map" style="padding:8px 16px; font-size:12px;">Lihat di Maps</a>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchTable').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            document.querySelectorAll('#tableBody .entry-card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(keyword) ? '' : 'none';
            });
        });

        // ---- Export to Excel ----
        document.getElementById('btnExport').addEventListener('click', () => {
            if (!currentData.length) {
                Swal.fire({ title: 'Tidak ada data', text: 'Belum ada data untuk diekspor.', icon: 'info', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' });
                return;
            }
            const rows = currentData.map(p => ({
                'Nama Pelanggan': p.nama_pelanggan,
                'Nomor HP': p.nomor_hp,
                'Wilayah': p.wilayah,
                'Status': p.status,
                'Latitude': p.latitude,
                'Longitude': p.longitude,
                'Tanggal Penarikan': p.tanggal_penarikan || '',
                'Teknisi': p.teknisi || '',
                'Catatan': p.catatan || ''
            }));
            const ws = XLSX.utils.json_to_sheet(rows);
            ws['!cols'] = [{ wch: 24 }, { wch: 16 }, { wch: 18 }, { wch: 16 }, { wch: 12 }, { wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 24 }];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Pelanggan');
            const fileName = 'Data Pelanggan' + (wParam ? ' - ' + wParam : '') + '.xlsx';
            XLSX.writeFile(wb, fileName);
        });

        // ---- Import from Excel ----
        document.getElementById('btnImport').addEventListener('click', () => {
            document.getElementById('importFile').click();
        });

        document.getElementById('importFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const buffer = await file.arrayBuffer();
            const wb = XLSX.read(buffer, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet);

            if (!rows.length) {
                Swal.fire({ title: 'File kosong', icon: 'warning', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' });
                e.target.value = '';
                return;
            }

            const payload = rows.map(r => ({
                nama_pelanggan: r['Nama Pelanggan'] || r['Nama'] || '',
                nomor_hp: String(r['Nomor HP'] || r['No HP'] || r['HP'] || ''),
                wilayah: r['Wilayah'] || wParam || '',
                latitude: r['Latitude'] || r['latitude'] || null,
                longitude: r['Longitude'] || r['longitude'] || null,
                status: r['Status'] || 'Belum Diambil'
            })).filter(r => r.nama_pelanggan);

            const confirmImport = await Swal.fire({
                title: `Impor ${payload.length} data?`,
                text: 'Data akan ditambahkan ke daftar pelanggan.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Ya, impor',
                cancelButtonText: 'Batal',
                background: '#18171b',
                color: '#f3efe7',
                confirmButtonColor: '#c9a96e',
                cancelButtonColor: '#2a2930'
            });

            if (confirmImport.isConfirmed) {
                const { error } = await supabaseClient.from('pelanggan').insert(payload);
                if (!error) {
                    Swal.fire({ title: 'Impor berhasil', text: `${payload.length} data ditambahkan.`, icon: 'success', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' });
                    loadTable();
                } else {
                    Swal.fire({ title: 'Error', text: error.message, icon: 'error', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' });
                }
            }
            e.target.value = '';
        });

        loadTable();
    </script>
</body>
</html>
