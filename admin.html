<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#08090d">
    <title>Kelola Data — Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
            </div>
            <div class="brand-text">
                <span class="brand-title">Kelola Data</span>
                <span class="brand-sub">Daftar Pelanggan</span>
            </div>
        </div>
        <a href="dashboard.html" class="icon-btn" aria-label="Kembali ke dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
    </header>

    <div class="page">
        <div class="page-head">
            <span class="eyebrow">Manajemen Pelanggan</span>
            <h1 class="page-title display">Data <em>Pelanggan</em></h1>
            <p class="page-desc">Tambah, cari, dan kelola data penarikan perangkat.</p>
        </div>

        <!-- Form: kartu biasa di desktop, lembar geser di mobile -->
        <div class="form-card sheet" id="formSheet">
            <div class="sheet-handle"></div>
            <h2 class="form-title">
                <svg class="icon" viewBox="0 0 24 24" stroke="var(--brass-400)"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Tambah Data Pelanggan
            </h2>
            <form id="formPelanggan">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Nama Pelanggan</label>
                        <input type="text" id="nama" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nomor HP</label>
                        <input type="text" id="nomor_hp" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Wilayah</label>
                        <select id="wilayah" class="form-select" required>
                            <option value="">Pilih Wilayah</option>
                            <option value="Sukamelang">Sukamelang</option>
                            <option value="Cibarola">Cibarola</option>
                            <option value="Panglejar">Panglejar</option>
                            <option value="Perum / Flamboyan">Perum / Flamboyan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Latitude</label>
                        <input type="number" id="latitude" class="form-input" step="any">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Longitude</label>
                        <input type="number" id="longitude" class="form-input" step="any">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 16px;">
                    <label class="form-label">Alamat Lengkap</label>
                    <textarea id="alamat" class="form-textarea" required></textarea>
                </div>
                <div style="display:flex; gap:10px; margin-top: 22px;">
                    <button type="button" class="btn btn-ghost" id="closeSheetBtn" style="flex:0 0 auto;">Batal</button>
                    <button type="submit" class="btn btn-success" style="flex:1;">
                        <svg class="icon" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        Simpan Data
                    </button>
                </div>
            </form>
        </div>
        <div class="sheet-backdrop" id="sheetBackdrop"></div>

        <div class="card table-card">
            <h2 class="form-title">
                <svg class="icon" viewBox="0 0 24 24" stroke="var(--brass-400)"><path d="M3 3h18v18H3z"></path><path d="M3 9h18M9 21V9"></path></svg>
                Daftar Pelanggan
            </h2>
            <div class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchTable" class="search-input" placeholder="Cari nama, HP, atau wilayah…">
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>HP</th>
                            <th>Wilayah</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="empty-state" id="emptyState" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                <p>Belum ada data pelanggan.</p>
            </div>
        </div>
    </div>

    <button class="fab" id="fabToggle" aria-label="Tambah data pelanggan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
            Dashboard
        </a>
        <a href="admin.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
            Kelola Data
        </a>
        <button onclick="logout()" class="nav-item logout">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Keluar
        </button>
    </nav>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }

        // --- Lembar geser (mobile) untuk formulir tambah data ---
        const formSheet = document.getElementById('formSheet');
        const sheetBackdrop = document.getElementById('sheetBackdrop');
        const fabToggle = document.getElementById('fabToggle');

        function isMobile() { return window.matchMedia('(max-width: 719px)').matches; }

        function openSheet() {
            if (!isMobile()) return;
            formSheet.classList.add('open');
            sheetBackdrop.classList.add('open');
            fabToggle.classList.add('is-open');
        }
        function closeSheet() {
            formSheet.classList.remove('open');
            sheetBackdrop.classList.remove('open');
            fabToggle.classList.remove('is-open');
        }
        fabToggle.addEventListener('click', () => {
            formSheet.classList.contains('open') ? closeSheet() : openSheet();
        });
        sheetBackdrop.addEventListener('click', closeSheet);
        document.getElementById('closeSheetBtn').addEventListener('click', closeSheet);

        document.getElementById('formPelanggan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.from('pelanggan').insert([{
                nama_pelanggan: document.getElementById('nama').value,
                nomor_hp: document.getElementById('nomor_hp').value,
                alamat: document.getElementById('alamat').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value,
                wilayah: document.getElementById('wilayah').value,
                status: 'Belum Diambil'
            }]);

            if (!error) {
                Swal.fire('Berhasil', 'Data disimpan', 'success');
                e.target.reset();
                closeSheet();
                loadTable();
            } else {
                Swal.fire('Error', error.message, 'error');
            }
        });

        async function deleteData(id) {
            const { value: confirmed } = await Swal.fire({
                title: 'Hapus data?',
                text: "Data tidak bisa dikembalikan!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, hapus!',
                cancelButtonText: 'Batal'
            });

            if (confirmed) {
                const { error } = await supabaseClient.from('pelanggan').delete().eq('id', id);
                if (!error) {
                    Swal.fire('Terhapus!', 'Data telah dihapus.', 'success');
                    loadTable();
                }
            }
        }

        async function loadTable() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (!pelanggan || pelanggan.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            pelanggan.forEach(p => {
                const badgeClass = p.status === 'Sudah Diambil' ? 'badge-success' : 'badge-warning';
                tbody.innerHTML += `
                    <tr>
                        <td data-label="Nama">${p.nama_pelanggan}</td>
                        <td data-label="HP">${p.nomor_hp}</td>
                        <td data-label="Wilayah">${p.wilayah}</td>
                        <td data-label="Status"><span class="badge ${badgeClass}">${p.status}</span></td>
                        <td data-label="Aksi"><button onclick="deleteData('${p.id}')" class="btn btn-danger btn-sm">
                            <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" style="width:14px;height:14px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>
                            Hapus
                        </button></td>
                    </tr>
                `;
            });
        }

        document.getElementById('searchTable').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(keyword) ? '' : 'none';
            });
        });

        loadTable();
    </script>
</body>
</html>
