<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kelola Data - RNB Premium</title>
    
    <!-- Leaflet & Supabase & SheetJS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505; --glass-bg: rgba(255, 255, 255, 0.04); --glass-border: rgba(255, 255, 255, 0.08);
            --aurora-1: #8B5CF6; --aurora-2: #3B82F6; --accent-gold: #C9A961; --accent-gold-light: #E5C97A;
            --success: #10B981; --warning: #F59E0B; --danger: #EF4444; --info: #3B82F6;
            --text-main: #FFFFFF; --text-muted: #A1A1AA;
            --font-main: 'Poppins', sans-serif;
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275); --smooth: cubic-bezier(0.25, 1, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-main); min-height: 100vh; overflow-x: hidden; padding-bottom: 120px; }

        /* Aurora Background */
        .bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .aurora-blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.35; mix-blend-mode: screen; animation: floatBlob 20s infinite alternate ease-in-out; }
        .blob-1 { width: 450px; height: 450px; background: var(--aurora-1); top: -10%; left: -10%; }
        .blob-2 { width: 400px; height: 400px; background: var(--aurora-2); bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 300px; height: 300px; background: var(--accent-gold); top: 30%; left: 30%; opacity: 0.15; animation-duration: 25s; }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, 80px) scale(1.2); } 100% { transform: translate(-30px, -50px) scale(0.9); } }

        /* Top Header */
        .top-header { position: sticky; top: 0; z-index: 100; background: rgba(5, 5, 5, 0.7); backdrop-filter: blur(30px); border-bottom: 1px solid var(--glass-border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { width: 40px; height: 40px; border-radius: 14px; background: var(--glass-bg); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s var(--spring); }
        .nav-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.1); }
        .nav-btn:active { transform: scale(0.9); }
        .nav-btn svg { width: 20px; height: 20px; stroke: var(--text-main); stroke-width: 1.5; fill: none; }
        .header-title-box { text-align: center; }
        .header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
        .header-subtitle { font-size: 10px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* Actions & Search */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .action-btn { padding: 14px; border-radius: 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s var(--spring); border: none; font-family: inherit; }
        .action-btn:active { transform: scale(0.95); }
        .action-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
        .btn-export { background: rgba(201, 169, 97, 0.1); border: 1px solid rgba(201, 169, 97, 0.3); color: var(--accent-gold); }
        .btn-add { background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light)); color: #000; box-shadow: 0 10px 20px rgba(201,169,97,0.2); }

        .search-box { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; transition: all 0.3s; }
        .search-box:focus-within { border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(201,169,97,0.1); }
        .search-box svg { width: 18px; height: 18px; stroke: var(--accent-gold); stroke-width: 2; fill: none; flex-shrink: 0; }
        .search-box input { background: none; border: none; color: white; font-size: 14px; width: 100%; outline: none; font-family: inherit; }
        .search-box input::placeholder { color: var(--text-muted); }

        /* Chips */
        .filter-label { font-size: 11px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: 600; }
        .chips-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .chip { padding: 10px 18px; border-radius: 20px; font-size: 12px; font-weight: 500; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.3s var(--spring); }
        .chip:active { transform: scale(0.95); }
        .chip.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); box-shadow: 0 10px 20px rgba(201,169,97,0.3); font-weight: 600; }

        /* Customer Cards */
        .customer-list { display: flex; flex-direction: column; gap: 15px; }
        .cust-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; position: relative; animation: slideUp 0.5s var(--spring) backwards; transition: all 0.3s var(--spring); }
        .cust-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.15); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        
        .cust-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .cust-name { font-size: 16px; font-weight: 600; color: white; margin-bottom: 4px; }
        .cust-sub { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .cust-sub .dot { width: 4px; height: 4px; background: var(--text-muted); border-radius: 50%; opacity: 0.5; }
        
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
        .badge-belum { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-selesai { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

        .isolir-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: 500; margin-bottom: 10px; }
        .isolir-badge svg { width: 14px; height: 14px; stroke-width: 1.5; fill: none; }
        .isolir-short { background: rgba(59, 130, 246, 0.15); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }
        .isolir-long { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .isolir-critical { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

        .cust-info { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .cust-info svg { width: 16px; height: 16px; stroke: var(--accent-gold); stroke-width: 1.5; fill: none; flex-shrink: 0; }

        .cust-actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .btn-action { padding: 8px 14px; border-radius: 12px; border: none; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; font-family: inherit; text-decoration: none; }
        .btn-action:active { transform: scale(0.95); }
        .btn-map { background: rgba(59, 130, 246, 0.15); color: #93C5FD; border: 1px solid rgba(59, 130, 246, 0.3); }
        .btn-edit { background: rgba(245, 158, 11, 0.15); color: #FCD34D; border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.3); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }

        /* Floating Dock */
        .dock-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; padding: 12px 20px; background: rgba(25, 25, 30, 0.7); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); z-index: 500; }
        .dock-item { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: all 0.3s var(--spring); }
        .dock-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-8px) scale(1.1); }
        .dock-item:active { transform: scale(0.9); }
        .dock-item svg { width: 22px; height: 22px; stroke: rgba(255,255,255,0.7); stroke-width: 1.5; fill: none; transition: stroke 0.3s; }
        .dock-item.active svg { stroke: var(--accent-gold); }
        .dock-item.active::after { content: ''; position: absolute; bottom: -6px; width: 4px; height: 4px; background: var(--accent-gold); border-radius: 50%; }

        /* Notif Popup dalam Dock */
        .notif-badge { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; background: var(--danger); border-radius: 50%; display: none; box-shadow: 0 0 0 2px rgba(25,25,30,1); }
        .notif-badge.active { display: block; animation: pulseRed 2s infinite; }
        .notif-popup { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%) scale(0.9); width: 320px; background: rgba(18, 18, 24, 0.85); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; display: none; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); z-index: 1000; cursor: default; opacity: 0; transition: all 0.3s var(--spring); }
        .notif-popup.active { display: block; opacity: 1; transform: translateX(-50%) scale(1); }
        .notif-popup-header { padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: white; }
        .clear-all { color: var(--accent-gold); font-size: 11px; cursor: pointer; }
        .notif-list { max-height: 280px; overflow-y: auto; scrollbar-width: none; }
        .notif-item { padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; gap: 14px; text-align: left; }
        .notif-item-icon { width: 36px; height: 36px; border-radius: 50%; background: rgba(16, 185, 129, 0.15); color: var(--success); display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .notif-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

        /* Bottom Sheet Form */
        .bottom-sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); z-index: 1000; }
        .bottom-sheet-overlay.active { display: block; animation: fadeIn 0.3s; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20, 20, 25, 0.95); backdrop-filter: blur(30px); border-radius: 32px 32px 0 0; padding: 25px; padding-bottom: calc(25px + env(safe-area-inset-bottom)); z-index: 1001; transform: translateY(100%); transition: transform 0.4s var(--spring); max-height: 90vh; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.1); }
        .bottom-sheet.active { transform: translateY(0); }
        .bottom-sheet-handle { width: 50px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto 20px; }
        .bottom-sheet-title { font-size: 20px; font-weight: 600; margin-bottom: 25px; color: white; text-align: center; }

        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 11px; color: var(--accent-gold); text-transform: uppercase; margin-bottom: 8px; font-weight: 500; }
        .input-field { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; color: white; font-size: 14px; font-family: inherit; outline: none; transition: all 0.3s; }
        .input-field:focus { border-color: var(--accent-gold); background: rgba(201,169,97,0.05); }
        textarea.input-field { min-height: 80px; resize: none; }

        .perangkat-selector { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .perangkat-option { padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; text-align: center; cursor: pointer; transition: all 0.2s; font-size: 12px; font-weight: 500; color: var(--text-muted); }
        .perangkat-option.selected { background: rgba(201,169,97,0.15); color: var(--accent-gold); border-color: var(--accent-gold); }

        .map-container { width: 100%; height: 200px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); margin-top: 5px; position: relative;}
        #map-picker { width: 100%; height: 100%; }
        .coord-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        
        .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(18, 18, 24, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 14px 24px; border-radius: 16px; z-index: 9999; font-size: 13px; font-weight: 500; color: white; transition: all 0.4s var(--spring); box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }

        .page-transit { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.4s var(--smooth); }
        .page-transit.active { opacity: 1; pointer-events: all; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulseRed { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>

        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
    </div>

    <div class="page-transit" id="pageTransit"></div>

    <div class="top-header">
        <div class="nav-buttons">
            <button class="nav-btn transit-link" href="index.html">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <a href="index.html" class="nav-btn transit-link">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </a>
        </div>
        <div class="header-title-box">
            <div class="header-subtitle">Panel Administrasi</div>
            <div class="header-title">Kelola Data</div>
        </div>
        <div style="width: 90px;"></div>
    </div>

    <div class="container">
        <div class="action-grid">
            <button class="action-btn btn-export" onclick="doExport('all')">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Semua
            </button>
            <button class="action-btn btn-add" onclick="openBottomSheet()">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Tambah Data
            </button>
        </div>

        <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchTable" placeholder="Pencarian cerdas...">
        </div>

        <div class="filter-label">Filter Bulan Penarikan</div>
        <div class="chips-container" id="bulanChips"></div>

        <div class="customer-list" id="tableContainer"></div>
    </div>

    <!-- FLOATING DOCK -->
    <div class="dock-container">
        <!-- 1. Dashboard -->
        <div class="dock-item transit-link" href="dashboard.html">
            <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        
        <!-- 2. Admin Data (Active) -->
        <div class="dock-item active transit-link" href="admin.html">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        
        <!-- 3. Notifikasi (TENGAH) -->
        <div class="dock-item" id="notifBtn" onclick="toggleNotifPopup(event)">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <div class="notif-badge" id="notifBadge"></div>
            
            <div class="notif-popup" id="notifPopup" onclick="event.stopPropagation()">
                <div class="notif-popup-header">
                    <span>Notifikasi Baru</span>
                    <span class="clear-all" onclick="clearAllNotifs(event)">Bersihkan</span>
                </div>
                <div class="notif-list" id="notifList">
                    <div class="notif-empty">Sistem aman. Belum ada aktivitas baru.</div>
                </div>
            </div>
        </div>

        <!-- 4. Teknisi -->
        <div class="dock-item transit-link" href="teknisi.html">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        
        <!-- 5. Logout -->
        <div class="dock-item" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
    </div>
        
        <div class="dock-item" id="notifBtn" onclick="toggleNotifPopup(event)">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <div class="notif-badge" id="notifBadge"></div>
            <div class="notif-popup" id="notifPopup" onclick="event.stopPropagation()">
                <div class="notif-popup-header">
                    <span>Notifikasi Baru</span>
                    <span class="clear-all" onclick="clearAllNotifs(event)">Bersihkan</span>
                </div>
                <div class="notif-list" id="notifList">
                    <div class="notif-empty">Belum ada aktivitas baru.</div>
                </div>
            </div>
        </div>
        
        <div class="dock-item" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
    </div>

    <!-- Bottom Sheet Form -->
    <div id="bottomSheetOverlay" class="bottom-sheet-overlay" onclick="closeBottomSheet()"></div>
    <div id="bottomSheet" class="bottom-sheet">
        <div class="bottom-sheet-handle"></div>
        <div class="bottom-sheet-title" id="formTitle">Tambah Data Baru</div>
        <form id="formPelanggan">
            <input type="hidden" id="editId">
            <div class="input-group">
                <label class="input-label">Nama Pelanggan *</label>
                <input type="text" id="nama" class="input-field" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="input-group">
                <label class="input-label">Nomor HP *</label>
                <input type="text" id="nomor_hp" class="input-field" placeholder="08xxxxxxxxxx" required>
            </div>
            <div class="input-group">
                <label class="input-label">Wilayah *</label>
                <select id="wilayah" class="input-field" required>
                    <option value="">Pilih Wilayah</option>
                    <option value="Sukamelang">Sukamelang</option>
                    <option value="Cibarola">Cibarola</option>
                    <option value="Panglejar">Panglejar</option>
                    <option value="Perum / Flamboyan">Perum / Flamboyan</option>
                </select>
            </div>
            <div class="input-group">
                <label class="input-label">Jenis Perangkat</label>
                <div class="perangkat-selector">
                    <div class="perangkat-option selected" onclick="selectPerangkat('Router', this)">Router</div>
                    <div class="perangkat-option" onclick="selectPerangkat('STB', this)">STB</div>
                    <div class="perangkat-option" onclick="selectPerangkat('Router + STB', this)">Router+STB</div>
                </div>
                <input type="hidden" id="perangkat" value="Router">
            </div>
            <div class="input-group">
                <label class="input-label">Tanggal Isolir</label>
                <input type="date" id="tanggal_isolir" class="input-field">
            </div>
            <div class="input-group">
                <label class="input-label">Alamat (Opsional)</label>
                <textarea id="alamat" class="input-field" placeholder="Keterangan alamat detail..."></textarea>
            </div>
            <div class="input-group">
                <label class="input-label">Titik Koordinat (Opsional)</label>
                <div class="map-container"><div id="map-picker"></div></div>
                <div class="coord-inputs">
                    <input type="text" id="latitude" class="input-field" placeholder="Latitude">
                    <input type="text" id="longitude" class="input-field" placeholder="Longitude">
                </div>
                <button type="button" class="action-btn btn-export" style="width: 100%; margin-top: 10px;" onclick="useMyGPS()">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
                    Dapatkan Lokasi Saya
                </button>
            </div>
            <button type="submit" class="action-btn btn-add" style="width: 100%; margin-top: 20px;">Simpan Data Registrasi</button>
        </form>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') { window.location.href = 'login.html'; }
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let map, marker;
        let currentBulan = 'all';
        let allData = [];
        const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        function logout() { localStorage.removeItem('userLoggedIn'); window.location.href = 'login.html'; }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + type; setTimeout(() => { t.className = 'toast'; }, 3000); }

        // --- Notifikasi ---
        let sessionNotifs = [];
        function toggleNotifPopup(event) { event.stopPropagation(); const popup = document.getElementById('notifPopup'); popup.classList.toggle('active'); if (popup.classList.contains('active')) document.getElementById('notifBadge').classList.remove('active'); }
        document.addEventListener('click', function(event) { const popup = document.getElementById('notifPopup'); const btn = document.getElementById('notifBtn'); if (popup && popup.classList.contains('active') && !btn.contains(event.target)) { popup.classList.remove('active'); } });
        function clearAllNotifs(event) { event.stopPropagation(); sessionNotifs = []; updateNotifUI(); document.getElementById('notifPopup').classList.remove('active'); showToast('Riwayat dibersihkan', 'success'); }
        function updateNotifUI() { const list = document.getElementById('notifList'); if (sessionNotifs.length === 0) { list.innerHTML = '<div class="notif-empty">Belum ada aktivitas baru.</div>'; return; } list.innerHTML = sessionNotifs.map(n => `<div class="notif-item"><div class="notif-item-icon">✅</div><div class="notif-item-content"><div class="notif-item-title">${n.nama}</div><div class="notif-item-time">${n.wilayah} • Pkl ${n.waktu}</div></div></div>`).join(''); }

        const processedNotifs = new Set();
        supabaseClient.channel('admin-realtime').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pelanggan' }, payload => {
            const newData = payload.new;
            if (newData.status === 'Sudah Diambil') {
                const notifKey = newData.id + '_selesai';
                if (!processedNotifs.has(notifKey)) {
                    processedNotifs.add(notifKey);
                    sessionNotifs.unshift({ nama: newData.nama_pelanggan, wilayah: newData.wilayah, waktu: new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}) });
                    updateNotifUI(); showToast(`🔔 ${newData.nama_pelanggan} telah diambil!`, 'success'); document.getElementById('notifBadge').classList.add('active'); loadTable();
                }
            }
        }).subscribe();

        // --- CRUD Logic ---
        function selectPerangkat(value, el) { document.querySelectorAll('.perangkat-option').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); document.getElementById('perangkat').value = value; }
        function hitungDurasiIsolir(tanggalIsolir) { if (!tanggalIsolir) return null; const tgl = new Date(tanggalIsolir); if (isNaN(tgl)) return null; return Math.ceil(Math.abs(new Date() - tgl) / (1000 * 60 * 60 * 24)); }
        function getIsolirBadge(days) { if (days === null) return ''; let className = days >= 30 ? 'isolir-critical' : (days >= 14 ? 'isolir-long' : 'isolir-short'); let icon = days >= 30 ? '<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'; return `<div class="isolir-badge ${className}">${icon} Isolir ${days} Hari</div>`; }
        
        function renderBulanChips() { 
            const container = document.getElementById('bulanChips'); container.innerHTML = `<div class="chip ${currentBulan === 'all' ? 'active' : ''}" onclick="filterByBulan('all', this)">Semua Transaksi</div>`; 
            const bulanSet = new Set(); allData.forEach(p => { if (p.tanggal_penarikan) { const d = new Date(p.tanggal_penarikan); if (!isNaN(d)) bulanSet.add(d.getMonth()); }}); 
            bulanSet.add(new Date().getMonth()); 
            Array.from(bulanSet).sort((a,b)=>a-b).forEach(m => { 
                const count = allData.filter(p => p.tanggal_penarikan && !isNaN(new Date(p.tanggal_penarikan)) && new Date(p.tanggal_penarikan).getMonth() === m).length; 
                container.innerHTML += `<div class="chip ${currentBulan === String(m) ? 'active' : ''}" onclick="filterByBulan('${m}', this)">${namaBulan[m]} (${count})</div>`; 
            }); 
        }
        function filterByBulan(b, el) { currentBulan = b; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); loadTable(false); }

        async function loadTable(fetchData = true) {
            if (fetchData) {
                const { data } = await supabaseClient.from('pelanggan').select('*').order('created_at', { ascending: false });
                allData = data || []; renderBulanChips();
            }
            let filtered = allData;
            if (currentBulan !== 'all') { filtered = filtered.filter(p => p.tanggal_penarikan && !isNaN(new Date(p.tanggal_penarikan)) && String(new Date(p.tanggal_penarikan).getMonth()) === currentBulan); }
            
            // Check URL Params for Wilayah Filter (from Dashboard)
            const urlParams = new URLSearchParams(window.location.search);
            const wilParam = urlParams.get('wilayah');
            if(wilParam) { filtered = filtered.filter(p => p.wilayah === wilParam); }

            const container = document.getElementById('tableContainer');
            if (filtered.length === 0) { container.innerHTML = '<div class="empty-state">Tidak ada data ditemukan.</div>'; return; }
            container.innerHTML = '';
            filtered.forEach((p, index) => {
                const badgeClass = p.status === 'Sudah Diambil' ? 'badge-selesai' : 'badge-belum';
                const mapsLink = p.latitude && p.longitude ? `https://www.google.com/maps?q=${p.latitude},${p.longitude}` : '#';
                const isolirBadge = getIsolirBadge(hitungDurasiIsolir(p.tanggal_isolir));
                let tanggalInfo = '';
                if (p.tanggal_penarikan) { const d = new Date(p.tanggal_penarikan); if (!isNaN(d)) tanggalInfo = `<div class="cust-info"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Diselesaikan: ${d.getDate()} ${namaBulan[d.getMonth()]} ${d.getFullYear()}</div>`; }
                
                container.innerHTML += `
                    <div class="cust-card" style="animation-delay: ${index * 0.05}s">
                        <div class="cust-header">
                            <div>
                                <div class="cust-name">${p.nama_pelanggan}</div>
                                <div class="cust-sub"><span>${p.wilayah}</span><span class="dot"></span><span>${p.perangkat || 'Router'}</span><span class="dot"></span><span>${p.nomor_hp}</span></div>
                            </div>
                            <span class="badge ${badgeClass}">${p.status}</span>
                        </div>
                        ${isolirBadge}${tanggalInfo}
                        ${p.alamat ? `<div class="cust-info"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> ${p.alamat}</div>` : ''}
                        <div class="cust-actions">
                            ${p.latitude && p.longitude ? `<a href="${mapsLink}" target="_blank" class="btn-action btn-map"><svg viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg> Peta</a>` : ''}
                            <button class="btn-action btn-edit" onclick="editData('${p.id}')">Edit</button>
                            <button class="btn-action btn-delete" onclick="deleteData('${p.id}')">Hapus</button>
                        </div>
                    </div>`;
            });
        }

        document.getElementById('searchTable').addEventListener('input', (e) => { const keyword = e.target.value.toLowerCase(); document.querySelectorAll('.cust-card').forEach(card => { card.style.display = card.textContent.toLowerCase().includes(keyword) ? 'block' : 'none'; }); });

        function openBottomSheet(editData = null) {
            document.getElementById('bottomSheetOverlay').classList.add('active'); document.getElementById('bottomSheet').classList.add('active');
            if (editData) {
                document.getElementById('formTitle').textContent = 'Edit Data Pelanggan'; document.getElementById('editId').value = editData.id; document.getElementById('nama').value = editData.nama_pelanggan; document.getElementById('nomor_hp').value = editData.nomor_hp; document.getElementById('wilayah').value = editData.wilayah; document.getElementById('alamat').value = editData.alamat || ''; document.getElementById('tanggal_isolir').value = editData.tanggal_isolir || ''; document.getElementById('perangkat').value = editData.perangkat || 'Router';
                document.querySelectorAll('.perangkat-option').forEach(el => { el.classList.remove('selected'); if (el.textContent.trim().replace(/\s+/g, '') === (editData.perangkat || 'Router').replace(/\s+/g, '')) el.classList.add('selected'); });
                setTimeout(() => { initMap(editData.latitude, editData.longitude); }, 300);
            } else {
                document.getElementById('formTitle').textContent = 'Registrasi Baru'; document.getElementById('formPelanggan').reset(); document.getElementById('editId').value = ''; document.getElementById('perangkat').value = 'Router'; document.getElementById('tanggal_isolir').value = new Date().toISOString().split('T')[0]; document.querySelectorAll('.perangkat-option').forEach((el, i) => { el.classList.toggle('selected', i === 0); }); setTimeout(initMap, 300);
            }
        }
        function closeBottomSheet() { document.getElementById('bottomSheetOverlay').classList.remove('active'); document.getElementById('bottomSheet').classList.remove('active'); }

        function initMap(lat = -6.568, lng = 107.765) {
            if (map) { map.invalidateSize(); if (lat && lng) { marker.setLatLng([lat, lng]); map.setView([lat, lng], 15); updateCoordDisplay(lat, lng); } return; }
            map = L.map('map-picker').setView([lat, lng], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap' }).addTo(map);
            marker = L.marker([lat, lng], { draggable: true }).addTo(map); updateCoordDisplay(lat, lng);
            map.on('click', function(e) { marker.setLatLng(e.latlng); updateCoordDisplay(e.latlng.lat, e.latlng.lng); });
            marker.on('dragend', function() { const pos = marker.getLatLng(); updateCoordDisplay(pos.lat, pos.lng); });
        }
        function updateCoordDisplay(lat, lng) { document.getElementById('latitude').value = lat.toFixed(6); document.getElementById('longitude').value = lng.toFixed(6); }
        document.getElementById('latitude').addEventListener('input', function(e) { const lat = parseFloat(e.target.value); const lng = parseFloat(document.getElementById('longitude').value); if (!isNaN(lat) && !isNaN(lng) && map && marker) { marker.setLatLng([lat, lng]); map.setView([lat, lng], 15); }});
        document.getElementById('longitude').addEventListener('input', function(e) { const lat = parseFloat(document.getElementById('latitude').value); const lng = parseFloat(e.target.value); if (!isNaN(lat) && !isNaN(lng) && map && marker) { marker.setLatLng([lat, lng]); map.setView([lat, lng], 15); }});
        function useMyGPS() {
            if (!navigator.geolocation) { showToast('GPS tidak didukung', 'error'); return; }
            showToast('Mencari lokasi akurat...', 'success');
            navigator.geolocation.getCurrentPosition(
                (pos) => { const lat = pos.coords.latitude; const lng = pos.coords.longitude; if (map && marker) { marker.setLatLng([lat, lng]); map.setView([lat, lng], 16); } updateCoordDisplay(lat, lng); showToast('Lokasi ditemukan!', 'success'); },
                () => { showToast('Gagal mendapat akses GPS', 'error'); }, { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        document.getElementById('formPelanggan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editId').value; const nama = document.getElementById('nama').value.trim(); const nomorHp = document.getElementById('nomor_hp').value.trim(); const alamat = document.getElementById('alamat').value.trim(); const lat = parseFloat(document.getElementById('latitude').value); const lng = parseFloat(document.getElementById('longitude').value); const tanggalIsolir = document.getElementById('tanggal_isolir').value;
            if (!nama || !nomorHp) { showToast('Nama & HP wajib!', 'error'); return; }
            if (!editId) {
                const { data: existing } = await supabaseClient.from('pelanggan').select('id').eq('nama_pelanggan', nama).eq('nomor_hp', nomorHp);
                if (existing && existing.length > 0 && !confirm('Peringatan: Data duplikat ditemukan. Tetap lanjutkan?')) return;
            }
            const data = { nama_pelanggan: nama, nomor_hp: nomorHp, alamat: alamat || (isNaN(lat) || isNaN(lng) ? '' : `Lat: ${lat}, Lng: ${lng}`), latitude: isNaN(lat) ? null : lat, longitude: isNaN(lng) ? null : lng, wilayah: document.getElementById('wilayah').value, perangkat: document.getElementById('perangkat').value, tanggal_isolir: tanggalIsolir || null };
            let error;
            if (editId) { const result = await supabaseClient.from('pelanggan').update(data).eq('id', editId); error = result.error; } 
            else { data.status = 'Belum Diambil'; const result = await supabaseClient.from('pelanggan').insert([data]); error = result.error; }
            if (!error) { showToast(editId ? 'Sistem diperbarui!' : 'Data tersimpan!', 'success'); closeBottomSheet(); loadTable(); } else { showToast('Gagal: ' + error.message, 'error'); }
        });
        
        async function deleteData(id) { if (!confirm('Tindakan ini tidak bisa dibatalkan. Hapus?')) return; const { error } = await supabaseClient.from('pelanggan').delete().eq('id', id); if (!error) { showToast('Data dihapus permanen.', 'success'); loadTable(); } else { showToast('Error: ' + error.message, 'error'); } }
        async function editData(id) { const { data } = await supabaseClient.from('pelanggan').select('*').eq('id', id).single(); if (data) openBottomSheet(data); }

        function doExport(type) {
            let dataToExport = type === 'all' ? allData : allData.filter(p => p.status === 'Sudah Diambil');
            if (dataToExport.length === 0) { showToast('Kosong. Tidak ada yang bisa di-export.', 'error'); return; }
            const exportData = dataToExport.map(p => ({ 'Nama': p.nama_pelanggan, 'HP': p.nomor_hp, 'Perangkat': p.perangkat || 'Router', 'Wilayah': p.wilayah, 'Alamat': p.alamat || '', 'Tanggal Isolir': p.tanggal_isolir || '', 'Status': p.status, 'Tgl Penarikan': p.tanggal_penarikan || '' }));
            const ws = XLSX.utils.json_to_sheet(exportData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Data');
            XLSX.writeFile(wb, `Laporan_Sistem_${new Date().toISOString().split('T')[0]}.xlsx`);
            showToast(`Export sukses!`, 'success');
        }

        // --- Transition Links ---
        document.querySelectorAll('.transit-link').forEach(link => {
            link.addEventListener('click', function(e) { e.preventDefault(); const href = this.getAttribute('href'); document.getElementById('pageTransit').classList.add('active'); setTimeout(() => window.location.href = href, 400); });
        });
        window.addEventListener('pageshow', e => { if(e.persisted) document.getElementById('pageTransit').classList.remove('active'); });

        loadTable();
    </script>
</body>
</html>
