<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Data - Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0F172A; color: white; font-family: system-ui, sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .btn-danger { background: #DC2626; color: white; }
        .btn-primary { background: #2563EB; color: white; }
        .btn-success { background: #16A34A; color: white; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #94A3B8; }
    </style>
</head>
<body>
    <div class="header">
        <h2>📝 Kelola Data Pelanggan</h2>
        <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>
    <div class="card">
        <h3>Tambah Data Pelanggan</h3>
        <form id="formPelanggan">
            <input type="text" id="nama" placeholder="Nama Pelanggan" required>
            <input type="text" id="nomor_hp" placeholder="Nomor HP (08xx)" required>
            <textarea id="alamat" placeholder="Alamat Lengkap" required></textarea>
            <input type="number" id="latitude" placeholder="Latitude" step="any">
            <input type="number" id="longitude" placeholder="Longitude" step="any">
            <select id="wilayah" required>
                <option value="">Pilih Wilayah</option>
                <option value="Sukamelang">Sukamelang</option>
                <option value="Cibarola">Cibarola</option>
                <option value="Panglejar">Panglejar</option>
                <option value="Perum / Flamboyan">Perum / Flamboyan</option>
            </select>
            <button type="submit" class="btn btn-success">💾 Simpan</button>
        </form>
    </div>
    <div class="card">
        <h3>Daftar Pelanggan</h3>
        <input type="text" id="searchTable" placeholder="🔍 Cari...">
        <div style="overflow-x: auto;">
            <table id="tabelPelanggan">
                <thead>
                    <tr><th>Nama</th><th>HP</th><th>Wilayah</th><th>Status</th><th>Aksi</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') { window.location.href = 'login.html'; }
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        function logout() { localStorage.removeItem('userLoggedIn'); window.location.href = 'login.html'; }
        document.getElementById('formPelanggan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.from('pelanggan').insert([{
                nama_pelanggan: document.getElementById('nama').value,
                nomor_hp: document.getElementById('nomor_hp').value,
                alamat: document.getElementById('alamat').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value,
                wilayah: document.getElementById('wilayah').value,
                status: 'Belum Diambil'
            }]);
            if (!error) {
                Swal.fire('Berhasil', 'Data disimpan', 'success');
                e.target.reset();
                loadTable();
            } else {
                Swal.fire('Error', error.message, 'error');
            }
        });
        async function deleteData(id) {
            const { value: confirm } = await Swal.fire({
                title: 'Hapus data?',
                text: "Data tidak bisa dikembalikan!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, hapus!',
                cancelButtonText: 'Batal'
            });
            if (confirm) {
                const { error } = await supabaseClient.from('pelanggan').delete().eq('id', id);
                if (!error) {
                    Swal.fire('Terhapus!', 'Data telah dihapus.', 'success');
                    loadTable();
                }
            }
        }
        async function loadTable() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            pelanggan.forEach(p => {
                const badgeColor = p.status === 'Sudah Diambil' ? '#86EFAC' : '#FCA5A5';
                tbody.innerHTML += `
                    <tr>
                        <td>${p.nama_pelanggan}</td>
                        <td>${p.nomor_hp}</td>
                        <td>${p.wilayah}</td>
                        <td style="color: ${badgeColor}">${p.status}</td>
                        <td><button onclick="deleteData('${p.id}')" style="background:#DC2626; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">🗑️ Hapus</button></td>
                    </tr>
                `;
            });
        }
        document.getElementById('searchTable').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(keyword) ? '' : 'none';
            });
        });
        loadTable();
    </script>
</body>
</html>
