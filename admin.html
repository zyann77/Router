<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kelola Data</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js"></script>
    <style>
        .wilayah-banner {
            background: linear-gradient(135deg, var(--leather) 0%, var(--leather-dark) 100%);
            border: 1px solid rgba(201, 169, 97, 0.3);
            border-radius: 16px;
            padding: var(--spacing-lg) var(--spacing-xl);
            margin: 0 var(--spacing-xl) var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .wilayah-banner-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .wilayah-banner-name {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: var(--cream);
        }
        .wilayah-banner-btn {
            background: rgba(201, 169, 97, 0.2);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="top-header">
        <div class="header-content">
            <div>
                <div class="header-subtitle">Panel Administrasi</div>
                <div class="header-title">Kelola Data</div>
            </div>
            <div class="header-icon">A</div>
        </div>
    </div>

    <div id="wilayahBanner" style="display: none;"></div>

    <div class="section-header">
        <div class="section-label">Daftar Pelanggan</div>
        <div class="section-title">Data Lapangan</div>
    </div>

    <div class="search-container">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchTable" placeholder="Cari pelanggan...">
        </div>
    </div>

    <div id="tableContainer"></div>

    <button class="fab" onclick="openBottomSheet()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <div id="bottomSheetOverlay" class="bottom-sheet-overlay" onclick="closeBottomSheet()"></div>
    <div id="bottomSheet" class="bottom-sheet">
        <div class="bottom-sheet-handle"></div>
        <div class="bottom-sheet-title">Tambah Data Baru</div>
        
        <form id="formPelanggan">
            <div class="input-group">
                <label class="input-label">Nama Pelanggan</label>
                <input type="text" id="nama" class="input-field" placeholder="Masukkan nama lengkap" required>
            </div>
            
            <div class="input-group">
                <label class="input-label">Nomor HP</label>
                <input type="text" id="nomor_hp" class="input-field input-mono" placeholder="08xxxxxxxxxx" required>
            </div>
            
            <div class="input-group">
                <label class="input-label">Wilayah</label>
                <select id="wilayah" class="input-field" required>
                    <option value="">Pilih Wilayah</option>
                    <option value="Sukamelang">Sukamelang</option>
                    <option value="Cibarola">Cibarola</option>
                    <option value="Panglejar">Panglejar</option>
                    <option value="Perum / Flamboyan">Perum / Flamboyan</option>
                </select>
            </div>
            
            <div class="input-group">
                <label class="input-label">Pilih Lokasi di Peta</label>
                <div class="map-container">
                    <div id="map-picker"></div>
                </div>
                <div class="coord-display">
                    <div>Lat: <span id="displayLat">-</span></div>
                    <div>Lng: <span id="displayLng">-</span></div>
                </div>
                <input type="hidden" id="latitude">
                <input type="hidden" id="longitude">
            </div>
            
            <button type="submit" class="btn btn-primary btn-full btn-large" style="margin-top: var(--spacing-lg);">
                Simpan Data
            </button>
        </form>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='dashboard.html'">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <div class="nav-label">Dashboard</div>
        </div>
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <div class="nav-label">Kelola Data</div>
        </div>
        <div class="nav-item" onclick="logout()">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <div class="nav-label">Keluar</div>
        </div>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let map, marker;
        let currentWilayahFilter = null;

        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        function openBottomSheet() {
            document.getElementById('bottomSheetOverlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
            setTimeout(initMap, 300);
        }

        function closeBottomSheet() {
            document.getElementById('bottomSheetOverlay').classList.remove('active');
            document.getElementById('bottomSheet').classList.remove('active');
        }

        function initMap() {
            if (map) {
                map.invalidateSize();
                return;
            }
            
            // Default: Bandung
            const defaultLat = -6.9175;
            const defaultLng = 107.6191;
            
            map = L.map('map-picker').setView([defaultLat, defaultLng], 13);
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap © CARTO',
                maxZoom: 19
            }).addTo(map);
            
            marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);
            
            updateCoordDisplay(defaultLat, defaultLng);
            
            map.on('click', function(e) {
                marker.setLatLng(e.latlng);
                updateCoordDisplay(e.latlng.lat, e.latlng.lng);
            });
            
            marker.on('dragend', function(e) {
                const pos = marker.getLatLng();
                updateCoordDisplay(pos.lat, pos.lng);
            });
        }

        function updateCoordDisplay(lat, lng) {
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
            document.getElementById('displayLat').textContent = lat.toFixed(6);
            document.getElementById('displayLng').textContent = lng.toFixed(6);
        }

        document.getElementById('formPelanggan').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;
            
            if (!lat || !lng) {
                showToast('Pilih lokasi di peta terlebih dahulu!', 'error');
                return;
            }
            
            const { error } = await supabaseClient.from('pelanggan').insert([{
                nama_pelanggan: document.getElementById('nama').value,
                nomor_hp: document.getElementById('nomor_hp').value,
                alamat: `Lat: ${lat}, Lng: ${lng}`,
                latitude: parseFloat(lat),
                longitude: parseFloat(lng),
                wilayah: document.getElementById('wilayah').value,
                status: 'Belum Diambil'
            }]);
            
            if (!error) {
                showToast('Data berhasil disimpan!', 'success');
                e.target.reset();
                closeBottomSheet();
                loadTable();
            } else {
                showToast('Error: ' + error.message, 'error');
            }
        });
        
        async function deleteData(id) {
            if (!confirm('Yakin ingin menghapus data ini?')) return;
            const { error } = await supabaseClient.from('pelanggan').delete().eq('id', id);
            if (!error) {
                showToast('Data dihapus!', 'success');
                loadTable();
            } else {
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        async function loadTable() {
            let query = supabaseClient.from('pelanggan').select('*').order('created_at', { ascending: false });
            
            if (currentWilayahFilter) {
                query = query.eq('wilayah', currentWilayahFilter);
            }
            
            const { data: pelanggan } = await query;
            const container = document.getElementById('tableContainer');
            
            if (!pelanggan || pelanggan.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Belum ada data</div><div class="empty-subtitle">Tekan tombol + untuk menambah data</div></div>';
                return;
            }
            
            container.innerHTML = '';
            
            pelanggan.forEach(p => {
                const badgeClass = p.status === 'Sudah Diambil' ? 'badge-success' : 'badge-warning';
                const mapsLink = p.latitude && p.longitude ? `https://www.google.com/maps?q=${p.latitude},${p.longitude}` : '#';
                
                container.innerHTML += `
                    <div class="modern-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${p.nama_pelanggan}</div>
                                <div class="card-subtitle mono-text">${p.wilayah}</div>
                            </div>
                            <span class="card-badge ${badgeClass}">${p.status}</span>
                        </div>
                        <div class="card-info mono-text">📱 ${p.nomor_hp}</div>
                        ${p.latitude && p.longitude ? `<div class="card-info mono-text" style="font-size:12px;"> ${p.latitude.toFixed(5)}, ${p.longitude.toFixed(5)}</div>` : ''}
                        <div style="margin-top: var(--spacing-md); position: relative; display: flex; gap: var(--spacing-sm);">
                            ${p.latitude && p.longitude ? `<a href="${mapsLink}" target="_blank" class="btn btn-map" style="padding: 10px 16px; font-size: 13px; min-height: auto;">Maps</a>` : ''}
                            <button onclick="deleteData('${p.id}')" class="btn btn-danger" style="padding: 10px 16px; font-size: 13px; min-height: auto;">Hapus</button>
                        </div>
                    </div>
                `;
            });
        }
        
        document.getElementById('searchTable').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('#tableContainer .modern-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(keyword) ? 'block' : 'none';
            });
        });

        // Cek URL params untuk filter wilayah
        const urlParams = new URLSearchParams(window.location.search);
        const wilayahParam = urlParams.get('wilayah');
        if (wilayahParam) {
            currentWilayahFilter = wilayahParam;
            const banner = document.getElementById('wilayahBanner');
            banner.style.display = 'flex';
            banner.innerHTML = `
                <div class="wilayah-banner" style="flex: 1;">
                    <div>
                        <div class="wilayah-banner-label">Wilayah Aktif</div>
                        <div class="wilayah-banner-name">${wilayahParam}</div>
                    </div>
                    <button class="wilayah-banner-btn" onclick="clearWilayahFilter()">✕ Reset</button>
                </div>
            `;
        }

        function clearWilayahFilter() {
            window.location.href = 'admin.html';
        }
        
        loadTable();
    </script>
</body>
</html>
