<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kelola Data</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="top-header">
        <div class="header-content">
            <div>
                <div class="header-subtitle">Panel Administrasi</div>
                <div class="header-title">Kelola Data</div>
            </div>
            <div class="header-icon">A</div>
        </div>
    </div>

    <div id="wilayahBanner" style="display: none;"></div>

    <div class="section-header">
        <div class="section-label">Daftar Pelanggan</div>
        <div class="section-title">Data Lapangan</div>
    </div>

    <div class="search-container">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchTable" placeholder="Cari pelanggan...">
        </div>
    </div>

    <div class="filter-section" style="padding: 0 var(--spacing-xl) var(--spacing-sm);">
        <div class="filter-label" style="font-family: var(--font-mono); font-size: 11px; color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: var(--spacing-md);">Filter Bulan Penarikan</div>
    </div>
    <div class="bulan-chips" id="bulanChips"></div>

    <div id="tableContainer"></div>

    <button class="fab" onclick="openBottomSheet()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <div id="bottomSheetOverlay" class="bottom-sheet-overlay" onclick="closeBottomSheet()"></div>
    <div id="bottomSheet" class="bottom-sheet">
        <div class="bottom-sheet-handle"></div>
        <div class="bottom-sheet-title" id="formTitle">Tambah Data Baru</div>
        
        <form id="formPelanggan">
            <input type="hidden" id="editId">
            
            <div class="input-group">
                <label class="input-label">Nama Pelanggan <span style="color: var(--danger);">*</span></label>
                <input type="text" id="nama" class="input-field" placeholder="Masukkan nama lengkap" required>
            </div>
            
            <div class="input-group">
                <label class="input-label">Nomor HP <span style="color: var(--danger);">*</span></label>
                <input type="text" id="nomor_hp" class="input-field input-mono" placeholder="08xxxxxxxxxx" required>
            </div>
            
            <div class="input-group">
                <label class="input-label">Wilayah <span style="color: var(--danger);">*</span></label>
                <select id="wilayah" class="input-field" required>
                    <option value="">Pilih Wilayah</option>
                    <option value="Sukamelang">Sukamelang</option>
                    <option value="Cibarola">Cibarola</option>
                    <option value="Panglejar">Panglejar</option>
                    <option value="Perum / Flamboyan">Perum / Flamboyan</option>
                </select>
            </div>
            
            <div class="input-group">
                <label class="input-label">Jenis Perangkat</label>
                <div class="perangkat-selector">
                    <div class="perangkat-option selected" onclick="selectPerangkat('Router', this)">
                        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="6" rx="1"/><rect x="2" y="15" width="20" height="6" rx="1"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                        Router
                    </div>
                    <div class="perangkat-option" onclick="selectPerangkat('STB', this)">
                        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2"/><circle cx="8" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><line x1="16" y1="10" x2="18" y2="10"/><line x1="16" y1="14" x2="18" y2="14"/></svg>
                        STB
                    </div>
                    <div class="perangkat-option" onclick="selectPerangkat('Router + STB', this)">
                        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="5" rx="1"/><rect x="2" y="10" width="20" height="5" rx="1"/><rect x="2" y="18" width="20" height="4" rx="1"/></svg>
                        Router+STB
                    </div>
                </div>
                <input type="hidden" id="perangkat" value="Router">
            </div>
            
            <div class="input-group">
                <label class="input-label">Alamat Lengkap <span class="optional-badge">(Opsional)</span></label>
                <textarea id="alamat" class="input-field" style="min-height: 80px; resize: vertical;" placeholder="Contoh: Jl. Merdeka No. 10, RT 02/RW 05"></textarea>
            </div>
            
            <div class="input-group">
                <label class="input-label">Titik Koordinat <span class="optional-badge">(Opsional)</span></label>
                <div class="map-container">
                    <div id="map-picker"></div>
                </div>
                
                <div class="coord-divider"> Atau isi koordinat manual</div>
                <div class="coord-inputs">
                    <div class="coord-input-wrapper">
                        <label class="input-label">Latitude</label>
                        <input type="text" id="latitude" class="coord-input" placeholder="-6.xxxxxx">
                    </div>
                    <div class="coord-input-wrapper">
                        <label class="input-label">Longitude</label>
                        <input type="text" id="longitude" class="coord-input" placeholder="107.xxxxxx">
                    </div>
                </div>
                
                <button type="button" class="btn btn-outline gps-btn" onclick="useMyGPS()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
                    Gunakan GPS Saya
                </button>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full btn-large" style="margin-top: var(--spacing-lg);">
                Simpan Data
            </button>
        </form>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='dashboard.html'">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <div class="nav-label">Dashboard</div>
        </div>
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <div class="nav-label">Kelola Data</div>
        </div>
        <div class="nav-item" onclick="logout()">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <div class="nav-label">Keluar</div>
        </div>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') { window.location.href = 'login.html'; }
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let map, marker;
        let currentWilayahFilter = null;
        let currentBulan = 'all';
        let allDataForBulan = [];

        const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        function logout() { localStorage.removeItem('userLoggedIn'); window.location.href = 'login.html'; }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        function selectPerangkat(value, element) {
            document.querySelectorAll('.perangkat-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('perangkat').value = value;
        }

        function renderBulanChips() {
            const container = document.getElementById('bulanChips');
            container.innerHTML = '';
            container.innerHTML += `<div class="chip-bulan ${currentBulan === 'all' ? 'active' : ''}" onclick="filterByBulan('all', this)">Semua</div>`;
            
            const bulanTersedia = new Set();
            allDataForBulan.forEach(p => {
                if (p.tanggal_penarikan) {
                    const d = new Date(p.tanggal_penarikan);
                    if (!isNaN(d)) bulanTersedia.add(d.getMonth());
                }
            });
            bulanTersedia.add(new Date().getMonth());
            
            const sortedBulan = Array.from(bulanTersedia).sort((a, b) => a - b);
            sortedBulan.forEach(m => {
                const count = allDataForBulan.filter(p => {
                    if (!p.tanggal_penarikan) return false;
                    const d = new Date(p.tanggal_penarikan);
                    return !isNaN(d) && d.getMonth() === m;
                }).length;
                container.innerHTML += `<div class="chip-bulan ${currentBulan === String(m) ? 'active' : ''}" onclick="filterByBulan('${m}', this)">${namaBulan[m]} (${count})</div>`;
            });
        }

        function filterByBulan(bulan, element) {
            currentBulan = bulan;
            var parent = element.parentElement;
            parent.querySelectorAll('.chip-bulan').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            loadTable();
        }

        function filterByBulanPenarikan(pelanggan, bulan) {
            if (bulan === 'all') return true;
            if (!pelanggan.tanggal_penarikan) return false;
            const d = new Date(pelanggan.tanggal_penarikan);
            if (isNaN(d)) return false;
            return String(d.getMonth()) === bulan;
        }

        function openBottomSheet(editData = null) {
            document.getElementById('bottomSheetOverlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
            
            if (editData) {
                document.getElementById('formTitle').textContent = 'Edit Data Pelanggan';
                document.getElementById('editId').value = editData.id;
                document.getElementById('nama').value = editData.nama_pelanggan;
                document.getElementById('nomor_hp').value = editData.nomor_hp;
                document.getElementById('wilayah').value = editData.wilayah;
                document.getElementById('alamat').value = editData.alamat || '';
                document.getElementById('perangkat').value = editData.perangkat || 'Router';
                
                document.querySelectorAll('.perangkat-option').forEach(el => {
                    el.classList.remove('selected');
                    const text = el.textContent.trim().replace(/\s+/g, '');
                    const val = (editData.perangkat || 'Router').replace(/\s+/g, '');
                    if (text === val) el.classList.add('selected');
                });
                
                setTimeout(() => { initMap(editData.latitude, editData.longitude); }, 300);
            } else {
                document.getElementById('formTitle').textContent = 'Tambah Data Baru';
                document.getElementById('formPelanggan').reset();
                document.getElementById('editId').value = '';
                document.getElementById('perangkat').value = 'Router';
                document.querySelectorAll('.perangkat-option').forEach((el, i) => { el.classList.toggle('selected', i === 0); });
                setTimeout(initMap, 300);
            }
        }

        function closeBottomSheet() {
            document.getElementById('bottomSheetOverlay').classList.remove('active');
            document.getElementById('bottomSheet').classList.remove('active');
        }

        function initMap(lat = -6.9175, lng = 107.6191) {
            if (map) {
                map.invalidateSize();
                if (lat && lng) {
                    marker.setLatLng([lat, lng]);
                    map.setView([lat, lng], 15);
                    updateCoordDisplay(lat, lng);
                }
                return;
            }
            
            map = L.map('map-picker').setView([lat, lng], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap © CARTO', maxZoom: 19
            }).addTo(map);
            
            marker = L.marker([lat, lng], { draggable: true }).addTo(map);
            updateCoordDisplay(lat, lng);
            
            map.on('click', function(e) {
                marker.setLatLng(e.latlng);
                updateCoordDisplay(e.latlng.lat, e.latlng.lng);
            });
            
            marker.on('dragend', function(e) {
                const pos = marker.getLatLng();
                updateCoordDisplay(pos.lat, pos.lng);
            });
        }

        function updateCoordDisplay(lat, lng) {
            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lng.toFixed(6);
        }

        document.getElementById('latitude').addEventListener('input', function(e) {
            const lat = parseFloat(e.target.value);
            const lng = parseFloat(document.getElementById('longitude').value);
            if (!isNaN(lat) && !isNaN(lng) && map && marker) {
                marker.setLatLng([lat, lng]);
                map.setView([lat, lng], 15);
            }
        });

        document.getElementById('longitude').addEventListener('input', function(e) {
            const lat = parseFloat(document.getElementById('latitude').value);
            const lng = parseFloat(e.target.value);
            if (!isNaN(lat) && !isNaN(lng) && map && marker) {
                marker.setLatLng([lat, lng]);
                map.setView([lat, lng], 15);
            }
        });

        ['latitude', 'longitude'].forEach(id => {
            document.getElementById(id).addEventListener('paste', function(e) {
                setTimeout(() => {
                    const lat = parseFloat(document.getElementById('latitude').value);
                    const lng = parseFloat(document.getElementById('longitude').value);
                    if (!isNaN(lat) && !isNaN(lng) && map && marker) {
                        marker.setLatLng([lat, lng]);
                        map.setView([lat, lng], 15);
                    }
                }, 100);
            });
        });

        function useMyGPS() {
            if (!navigator.geolocation) { showToast('GPS tidak didukung', 'error'); return; }
            showToast('Mencari lokasi GPS...', 'success');
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    if (map && marker) { marker.setLatLng([lat, lng]); map.setView([lat, lng], 16); }
                    updateCoordDisplay(lat, lng);
                    showToast('Lokasi GPS berhasil!', 'success');
                },
                (error) => {
                    let msg = 'Gagal mengambil GPS';
                    if (error.code === 1) msg = 'Izin GPS ditolak';
                    else if (error.code === 2) msg = 'GPS tidak tersedia';
                    else if (error.code === 3) msg = 'Timeout GPS';
                    showToast(msg, 'error');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        document.getElementById('formPelanggan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const alamat = document.getElementById('alamat').value.trim();
            const lat = parseFloat(document.getElementById('latitude').value);
            const lng = parseFloat(document.getElementById('longitude').value);
            
            if (!alamat && (isNaN(lat) || isNaN(lng))) {
                showToast('Isi alamat atau titik koordinat!', 'error');
                return;
            }
            
            const data = {
                nama_pelanggan: document.getElementById('nama').value,
                nomor_hp: document.getElementById('nomor_hp').value,
                alamat: alamat || (isNaN(lat) || isNaN(lng) ? '' : `Lat: ${lat}, Lng: ${lng}`),
                latitude: isNaN(lat) ? null : lat,
                longitude: isNaN(lng) ? null : lng,
                wilayah: document.getElementById('wilayah').value,
                perangkat: document.getElementById('perangkat').value
            };
            
            let error;
            if (editId) {
                const result = await supabaseClient.from('pelanggan').update(data).eq('id', editId);
                error = result.error;
            } else {
                data.status = 'Belum Diambil';
                const result = await supabaseClient.from('pelanggan').insert([data]);
                error = result.error;
            }
            
            if (!error) {
                showToast(editId ? 'Data berhasil diupdate!' : 'Data berhasil disimpan!', 'success');
                closeBottomSheet();
                loadTable();
            } else { showToast('Error: ' + error.message, 'error'); }
        });
        
        async function deleteData(id) {
            if (!confirm('Yakin ingin menghapus data ini?')) return;
            const { error } = await supabaseClient.from('pelanggan').delete().eq('id', id);
            if (!error) { showToast('Data dihapus!', 'success'); loadTable(); }
            else { showToast('Error: ' + error.message, 'error'); }
        }

        async function editData(id) {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*').eq('id', id).single();
            if (pelanggan) openBottomSheet(pelanggan);
        }
        
        async function loadTable() {
            let query = supabaseClient.from('pelanggan').select('*').order('created_at', { ascending: false });
            if (currentWilayahFilter) query = query.eq('wilayah', currentWilayahFilter);
            
            const { data: pelanggan } = await query;
            allDataForBulan = pelanggan || [];
            renderBulanChips();
            
            let filtered = allDataForBulan;
            if (currentBulan !== 'all') {
                filtered = filtered.filter(p => filterByBulanPenarikan(p, currentBulan));
            }
            
            const container = document.getElementById('tableContainer');
            
            let filterInfo = '';
            if (currentBulan !== 'all') {
                filterInfo = `<div style="padding: var(--spacing-md) var(--spacing-xl); font-family: var(--font-mono); font-size: 12px; color: var(--gold); background: rgba(201, 169, 97, 0.1); border-radius: 12px; margin: 0 var(--spacing-xl) var(--spacing-lg);">📅 Bulan: <b>${namaBulan[parseInt(currentBulan)]}</b> • ${filtered.length} data penarikan</div>`;
            }
            
            if (!filtered || filtered.length === 0) {
                container.innerHTML = filterInfo + '<div class="empty-state"><div class="empty-title">Belum ada data</div><div class="empty-subtitle">Tekan tombol + untuk menambah data</div></div>';
                return;
            }
            
            container.innerHTML = filterInfo;
            
            filtered.forEach(p => {
                const badgeClass = p.status === 'Sudah Diambil' ? 'badge-success' : 'badge-warning';
                const mapsLink = p.latitude && p.longitude ? `https://www.google.com/maps?q=${p.latitude},${p.longitude}` : '#';
                
                let tanggalInfo = '';
                if (p.tanggal_penarikan) {
                    const d = new Date(p.tanggal_penarikan);
                    if (!isNaN(d)) {
                        tanggalInfo = `<div class="card-info mono-text" style="font-size:12px; color: var(--success);">✅ ${d.getDate()} ${namaBulan[d.getMonth()]} ${d.getFullYear()}</div>`;
                    }
                }
                
                let alamatInfo = '';
                if (p.alamat) {
                    const alamatText = p.alamat.length > 100 ? p.alamat.substring(0, 100) + '...' : p.alamat;
                    alamatInfo = `<div class="card-info mono-text" style="font-size:12px; line-height:1.4;"> ${alamatText}</div>`;
                }
                
                container.innerHTML += `
                    <div class="modern-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${p.nama_pelanggan}</div>
                                <div class="card-subtitle mono-text">${p.wilayah} • ${p.perangkat || 'Router'}</div>
                            </div>
                            <span class="card-badge ${badgeClass}">${p.status}</span>
                        </div>
                        <div class="card-info mono-text">📱 ${p.nomor_hp}</div>
                        ${alamatInfo}
                        ${tanggalInfo}
                        ${p.latitude && p.longitude ? `<div class="card-info mono-text" style="font-size:12px;"> ${p.latitude.toFixed(5)}, ${p.longitude.toFixed(5)}</div>` : ''}
                        <div style="margin-top: var(--spacing-md); display: flex; gap: var(--spacing-sm); flex-wrap: wrap;">
                            ${p.latitude && p.longitude ? `<a href="${mapsLink}" target="_blank" class="btn btn-map btn-small">Maps</a>` : ''}
                            <button onclick="editData('${p.id}')" class="btn btn-warning btn-small">️ Edit</button>
                            <button onclick="deleteData('${p.id}')" class="btn btn-danger btn-small">Hapus</button>
                        </div>
                    </div>
                `;
            });
        }
        
        document.getElementById('searchTable').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('#tableContainer .modern-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(keyword) ? 'block' : 'none';
            });
        });

        const urlParams = new URLSearchParams(window.location.search);
        const wilayahParam = urlParams.get('wilayah');
        if (wilayahParam) {
            currentWilayahFilter = wilayahParam;
            const banner = document.getElementById('wilayahBanner');
            banner.style.display = 'block';
            banner.innerHTML = `
                <div class="wilayah-banner" style="flex: 1;">
                    <div>
                        <div class="wilayah-banner-label">Wilayah Aktif</div>
                        <div class="wilayah-banner-name">${wilayahParam}</div>
                    </div>
                    <button class="wilayah-banner-btn" onclick="clearWilayahFilter()">✕ Reset</button>
                </div>
            `;
        }

        function clearWilayahFilter() { window.location.href = 'admin.html'; }
        
        loadTable();
    </script>
</body>
</html>
