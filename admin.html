<!-- MAIN CONTENT -->
<main>
    <!-- SECTION: DAFTAR PELANGGAN -->
    <div class="section-header">
        <div class="section-label">Kelola Data</div>
        <div class="section-title">Daftar Pelanggan</div>
    </div>

    <!-- SEARCH -->
    <div class="search-container">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="Cari nama pelanggan...">
        </div>
    </div>

    <!-- FILTER CHIPS -->
    <div class="filter-chips">
        <div class="chip active" data-filter="all">Semua</div>
        <div class="chip" data-filter="router">Router</div>
        <div class="chip" data-filter="stb">STB</div>
        <div class="chip" data-filter="both">Router+STB</div>
    </div>

    <!-- DATA LIST -->
    <div id="dataList"></div>

    <!-- EMPTY STATE -->
    <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">📋</div>
        <div class="empty-title">Belum Ada Data</div>
        <div class="empty-subtitle">Tambahkan data pelanggan baru</div>
    </div>

    <!-- FAB BUTTON -->
    <button class="fab" id="fabAdd">
        <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>
</main>

<!-- BOTTOM SHEET: TAMBAH DATA -->
<div class="bottom-sheet-overlay" id="addOverlay"></div>
<div class="bottom-sheet" id="addSheet">
    <div class="bottom-sheet-handle"></div>
    <div class="bottom-sheet-title">Tambah Data Baru</div>

    <form id="addForm">
        <!-- NAMA PELANGGAN -->
        <div class="input-group">
            <label class="input-label">Nama Pelanggan</label>
            <input type="text" class="input-field" id="inputNama" placeholder="Masukkan nama pelanggan" required>
        </div>

        <!-- NOMOR HP -->
        <div class="input-group">
            <label class="input-label">Nomor HP</label>
            <input type="tel" class="input-field" id="inputHp" placeholder="08xxxxxxxxxx" required>
        </div>

        <!-- WILAYAH -->
        <div class="input-group">
            <label class="input-label">Wilayah</label>
            <select class="input-field" id="inputWilayah" required>
                <option value="">Pilih Wilayah</option>
                <option value="Sukamelang">Sukamelang</option>
                <option value="Cibarola">Cibarola</option>
                <option value="Panglejar">Panglejar</option>
                <option value="Perum / Flamboyan">Perum / Flamboyan</option>
            </select>
        </div>

        <!-- JENIS PERANGKAT -->
        <div class="input-group">
            <label class="input-label">Jenis Perangkat</label>
            <div class="perangkat-selector">
                <div class="perangkat-option" data-value="Router">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="14" width="20" height="8" rx="2"></rect>
                        <circle cx="6" cy="18" r="1"></circle>
                        <circle cx="10" cy="18" r="1"></circle>
                        <path d="M6 14V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6"></path>
                    </svg>
                    Router
                </div>
                <div class="perangkat-option" data-value="STB">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="7" width="20" height="15" rx="2"></rect>
                        <circle cx="12" cy="14" r="3"></circle>
                        <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    STB
                </div>
                <div class="perangkat-option" data-value="Router+STB">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="14" width="9" height="8" rx="1"></rect>
                        <rect x="13" y="14" width="9" height="8" rx="1"></rect>
                        <path d="M6 14V8a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v6"></path>
                        <path d="M17 14V8a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v6"></path>
                    </svg>
                    Router+STB
                </div>
            </div>
            <input type="hidden" id="inputPerangkat" required>
        </div>

        <!-- LOKASI PETA -->
        <div class="input-group">
            <label class="input-label">Pilih Lokasi di Peta</label>
            <div class="map-container">
                <div id="map-picker"></div>
            </div>
            <div class="coord-display">
                <div>
                    <span>Lat:</span>
                    <input type="text" id="inputLat" class="coord-input" placeholder="-6.xxxxx" style="background: transparent; border: none; color: var(--cream); font-family: var(--font-mono); font-size: 13px; width: 100px; outline: none;">
                </div>
                <div>
                    <span>Lng:</span>
                    <input type="text" id="inputLng" class="coord-input" placeholder="107.xxxxx" style="background: transparent; border: none; color: var(--cream); font-family: var(--font-mono); font-size: 13px; width: 100px; outline: none;">
                </div>
            </div>
            <button type="button" class="btn btn-outline btn-full gps-btn" id="btnGps">
                <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none;">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
                </svg>
                Gunakan GPS Saya
            </button>
        </div>

        <!-- SUBMIT -->
        <button type="submit" class="btn btn-primary btn-full btn-large">
            Simpan Data
        </button>
    </form>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <div class="nav-item" data-page="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <div class="nav-label">Dashboard</div>
    </div>
    <div class="nav-item active" data-page="admin">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <div class="nav-label">Kelola Data</div>
    </div>
    <div class="nav-item" data-page="logout">
        <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <div class="nav-label">Keluar</div>
    </div>
</nav>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // DATA STORAGE
    let dataList = JSON.parse(localStorage.getItem('rnb_data') || '[]');
    let selectedPerangkat = '';
    let map, marker;
    let currentLat = null;
    let currentLng = null;

    // TOAST
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // BOTTOM SHEET
    const fabAdd = document.getElementById('fabAdd');
    const addOverlay = document.getElementById('addOverlay');
    const addSheet = document.getElementById('addSheet');

    fabAdd.addEventListener('click', () => {
        addOverlay.classList.add('active');
        addSheet.classList.add('active');
        setTimeout(() => {
            initMap();
        }, 100);
    });

    addOverlay.addEventListener('click', () => {
        addOverlay.classList.remove('active');
        addSheet.classList.remove('active');
    });

    // PERANGKAT SELECTOR
    document.querySelectorAll('.perangkat-option').forEach(option => {
        option.addEventListener('click', () => {
            document.querySelectorAll('.perangkat-option').forEach(o => o.classList.remove('selected'));
            option.classList.add('selected');
            selectedPerangkat = option.dataset.value;
            document.getElementById('inputPerangkat').value = selectedPerangkat;
        });
    });

    // MAP INITIALIZATION
    function initMap() {
        if (map) {
            map.invalidateSize();
            return;
        }
        
        map = L.map('map-picker').setView([-6.9175, 107.6191], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        map.on('click', (e) => {
            setMarker(e.latlng.lat, e.latlng.lng);
        });

        setTimeout(() => map.invalidateSize(), 100);
    }

    function setMarker(lat, lng) {
        currentLat = lat;
        currentLng = lng;
        
        document.getElementById('inputLat').value = lat.toFixed(6);
        document.getElementById('inputLng').value = lng.toFixed(6);

        if (marker) {
            marker.setLatLng([lat, lng]);
        } else {
            marker = L.marker([lat, lng]).addTo(map);
        }
        map.setView([lat, lng], 16);
    }

    // COORDINATE INPUT HANDLERS
    const inputLat = document.getElementById('inputLat');
    const inputLng = document.getElementById('inputLng');

    // Handle paste for Lat input
    inputLat.addEventListener('paste', (e) => {
        setTimeout(() => {
            let value = inputLat.value.trim();
            
            // Check if pasted value contains both lat and lng (e.g., "-6.917500, 107.619100")
            if (value.includes(',')) {
                const parts = value.split(',').map(p => p.trim());
                if (parts.length >= 2) {
                    const lat = parseFloat(parts[0]);
                    const lng = parseFloat(parts[1]);
                    
                    if (!isNaN(lat) && !isNaN(lng)) {
                        inputLat.value = lat.toFixed(6);
                        inputLng.value = lng.toFixed(6);
                        setMarker(lat, lng);
                        showToast('Koordinat berhasil diinput', 'success');
                    }
                }
            } else {
                // Only lat was pasted
                const lat = parseFloat(value);
                if (!isNaN(lat)) {
                    currentLat = lat;
                    if (currentLng) {
                        setMarker(lat, currentLng);
                    }
                }
            }
        }, 10);
    });

    // Handle paste for Lng input
    inputLng.addEventListener('paste', (e) => {
        setTimeout(() => {
            let value = inputLng.value.trim();
            
            // Check if pasted value contains both lat and lng
            if (value.includes(',')) {
                const parts = value.split(',').map(p => p.trim());
                if (parts.length >= 2) {
                    const lat = parseFloat(parts[0]);
                    const lng = parseFloat(parts[1]);
                    
                    if (!isNaN(lat) && !isNaN(lng)) {
                        inputLat.value = lat.toFixed(6);
                        inputLng.value = lng.toFixed(6);
                        setMarker(lat, lng);
                        showToast('Koordinat berhasil diinput', 'success');
                    }
                }
            } else {
                // Only lng was pasted
                const lng = parseFloat(value);
                if (!isNaN(lng)) {
                    currentLng = lng;
                    if (currentLat) {
                        setMarker(currentLat, lng);
                    }
                }
            }
        }, 10);
    });

    // Handle manual input change
    inputLat.addEventListener('change', () => {
        const lat = parseFloat(inputLat.value);
        if (!isNaN(lat) && currentLng) {
            setMarker(lat, currentLng);
        }
    });

    inputLng.addEventListener('change', () => {
        const lng = parseFloat(inputLng.value);
        if (!isNaN(lng) && currentLat) {
            setMarker(currentLat, lng);
        }
    });

    // GPS BUTTON
    document.getElementById('btnGps').addEventListener('click', () => {
        if (!navigator.geolocation) {
            showToast('GPS tidak tersedia', 'error');
            return;
        }

        showToast('Mencari lokasi...', 'success');
        navigator.geolocation.getCurrentPosition(
            (position) => {
                setMarker(position.coords.latitude, position.coords.longitude);
                showToast('Lokasi berhasil didapat', 'success');
            },
            (error) => {
                showToast('Gagal mendapatkan lokasi', 'error');
            }
        );
    });

    // FORM SUBMIT
    document.getElementById('addForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const nama = document.getElementById('inputNama').value.trim();
        const hp = document.getElementById('inputHp').value.trim();
        const wilayah = document.getElementById('inputWilayah').value;
        const perangkat = document.getElementById('inputPerangkat').value;
        const lat = document.getElementById('inputLat').value;
        const lng = document.getElementById('inputLng').value;

        if (!nama || !hp || !wilayah || !perangkat) {
            showToast('Lengkapi semua data', 'error');
            return;
        }

        if (!lat || !lng) {
            showToast('Isi koordinat lokasi', 'error');
            return;
        }

        const newData = {
            id: Date.now(),
            nama,
            hp,
            wilayah,
            perangkat,
            lat: parseFloat(lat),
            lng: parseFloat(lng),
            tanggal: new Date().toISOString(),
            status: 'belum'
        };

        dataList.push(newData);
        localStorage.setItem('rnb_data', JSON.stringify(dataList));

        showToast('Data berhasil disimpan', 'success');
        
        // Reset form
        document.getElementById('addForm').reset();
        document.querySelectorAll('.perangkat-option').forEach(o => o.classList.remove('selected'));
        document.getElementById('inputPerangkat').value = '';
        document.getElementById('inputLat').value = '';
        document.getElementById('inputLng').value = '';
        if (marker) {
            marker.remove();
            marker = null;
        }
        currentLat = null;
        currentLng = null;

        // Close sheet
        addOverlay.classList.remove('active');
        addSheet.classList.remove('active');

        renderData();
    });

    // RENDER DATA
    function renderData() {
        const dataListEl = document.getElementById('dataList');
        const emptyState = document.getElementById('emptyState');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const activeFilter = document.querySelector('.chip.active').dataset.filter;

        let filtered = dataList.filter(item => {
            const matchSearch = item.nama.toLowerCase().includes(searchTerm);
            let matchFilter = true;
            
            if (activeFilter === 'router') matchFilter = item.perangkat === 'Router';
            else if (activeFilter === 'stb') matchFilter = item.perangkat === 'STB';
            else if (activeFilter === 'both') matchFilter = item.perangkat === 'Router+STB';

            return matchSearch && matchFilter;
        });

        if (filtered.length === 0) {
            dataListEl.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }

        emptyState.style.display = 'none';
        dataListEl.innerHTML = filtered.map(item => {
            const wilayahClass = item.wilayah.toLowerCase().replace(/ /g, '').replace('/', '');
            const tanggal = new Date(item.tanggal).toLocaleDateString('id-ID');
            
            return `
                <div class="modern-card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">${item.nama}</div>
                            <div class="card-subtitle">${item.wilayah} • ${tanggal}</div>
                        </div>
                        <div class="card-badge badge-${item.status === 'selesai' ? 'success' : 'warning'}">
                            ${item.status === 'selesai' ? 'Selesai' : 'Belum'}
                        </div>
                    </div>
                    <div class="card-info">
                        <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: var(--gold); stroke-width: 2; fill: none;">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <a href="tel:${item.hp}">${item.hp}</a>
                    </div>
                    <div class="card-info">
                        <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: var(--gold); stroke-width: 2; fill: none;">
                            <rect x="2" y="14" width="20" height="8" rx="2"></rect>
                            <circle cx="6" cy="18" r="1"></circle>
                            <circle cx="10" cy="18" r="1"></circle>
                        </svg>
                        ${item.perangkat}
                    </div>
                    <div class="card-info">
                        <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: var(--gold); stroke-width: 2; fill: none;">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <a href="https://maps.google.com/?q=${item.lat},${item.lng}" target="_blank">
                            ${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}
                        </a>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-whatsapp btn-small" onclick="openWhatsApp('${item.hp}', '${item.nama}')">
                            <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none;">
                                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                            </svg>
                            WhatsApp
                        </button>
                        <button class="btn btn-map btn-small" onclick="openMap(${item.lat}, ${item.lng})">
                            <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none;">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            Peta
                        </button>
                        <button class="btn btn-danger btn-small btn-full" onclick="deleteData(${item.id})">
                            Hapus Data
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // HELPER FUNCTIONS
    function openWhatsApp(hp, nama) {
        const message = encodeURIComponent(`Halo ${nama}, kami dari RnB Network...`);
        window.open(`https://wa.me/${hp}?text=${message}`, '_blank');
    }

    function openMap(lat, lng) {
        window.open(`https://maps.google.com/?q=${lat},${lng}`, '_blank');
    }

    function deleteData(id) {
        if (confirm('Hapus data ini?')) {
            dataList = dataList.filter(item => item.id !== id);
            localStorage.setItem('rnb_data', JSON.stringify(dataList));
            showToast('Data berhasil dihapus', 'success');
            renderData();
        }
    }

    // SEARCH
    document.getElementById('searchInput').addEventListener('input', renderData);

    // FILTER CHIPS
    document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            renderData();
        });
    });

    // NAVIGATION
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
            const page = item.dataset.page;
            if (page === 'dashboard') window.location.href = 'dashboard.html';
            else if (page === 'logout') {
                if (confirm('Keluar dari aplikasi?')) {
                    localStorage.removeItem('rnb_logged_in');
                    window.location.href = 'login.html';
                }
            }
        });
    });

    // INIT
    renderData();
</script>
