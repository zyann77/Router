<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola Data</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .form-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            margin: var(--spacing-lg) var(--spacing-xl);
        }
        
        .form-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: var(--spacing-xl);
        }
        
        .form-row {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
        }
        
        .table-container {
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            margin: var(--spacing-lg) var(--spacing-xl);
            overflow: hidden;
        }
        
        .table-header {
            padding: var(--spacing-xl);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        
        .table-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: var(--spacing-lg);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: var(--spacing-md) var(--spacing-xl);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        
        td {
            padding: var(--spacing-lg) var(--spacing-xl);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.05);
            font-size: 15px;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        .btn-delete {
            background: var(--ios-red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-delete:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-title">Kelola Data</div>
    </div>
    
    <h1 class="nav-large-title">Tambah Data</h1>
    
    <form id="formPelanggan">
        <div class="form-section">
            <div class="form-row">
                <label class="form-label">Nama Pelanggan</label>
                <input type="text" id="nama" class="ios-input" style="padding: 0; border: none;" required>
            </div>
            
            <div class="form-row">
                <label class="form-label">Nomor HP</label>
                <input type="text" id="nomor_hp" class="ios-input" style="padding: 0; border: none;" required>
            </div>
            
            <div class="form-row">
                <label class="form-label">Wilayah</label>
                <select id="wilayah" class="ios-input" style="padding: 0; border: none;" required>
                    <option value="">Pilih Wilayah</option>
                    <option value="Sukamelang">Sukamelang</option>
                    <option value="Cibarola">Cibarola</option>
                    <option value="Panglejar">Panglejar</option>
                    <option value="Perum / Flamboyan">Perum / Flamboyan</option>
                </select>
            </div>
            
            <div class="form-row">
                <label class="form-label">Alamat Lengkap</label>
                <textarea id="alamat" class="ios-textarea" style="margin: 0; width: 100%;" required></textarea>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-lg);">
                <div class="form-row">
                    <label class="form-label">Latitude</label>
                    <input type="number" id="latitude" class="ios-input" style="padding: 0; border: none;" step="any">
                </div>
                <div class="form-row">
                    <label class="form-label">Longitude</label>
                    <input type="number" id="longitude" class="ios-input" style="padding: 0; border: none;" step="any">
                </div>
            </div>
        </div>
        
        <div style="padding: var(--spacing-xl);">
            <button type="submit" class="ios-btn ios-btn-success ios-btn-full ios-btn-large">
                💾 Simpan Data
            </button>
        </div>
    </form>
    
    <div class="table-container">
        <div class="table-header">
            <div class="table-title">Daftar Pelanggan</div>
            <input type="text" id="searchTable" class="ios-input" style="padding: 0; border: none;" placeholder="🔍 Cari...">
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>HP</th>
                        <th>Wilayah</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn || userLoggedIn.role !== 'admin') {
            window.location.href = 'login.html';
        }
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        document.getElementById('formPelanggan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.from('pelanggan').insert([{
                nama_pelanggan: document.getElementById('nama').value,
                nomor_hp: document.getElementById('nomor_hp').value,
                alamat: document.getElementById('alamat').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value,
                wilayah: document.getElementById('wilayah').value,
                status: 'Belum Diambil'
            }]);
            
            if (!error) {
                Swal.fire('Berhasil', 'Data disimpan', 'success');
                e.target.reset();
                loadTable();
            } else {
                Swal.fire('Error', error.message, 'error');
            }
        });
        
        async function deleteData(id) {
            const { value: confirm } = await Swal.fire({
                title: 'Hapus data?',
                text: "Data tidak bisa dikembalikan!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, hapus!',
                cancelButtonText: 'Batal'
            });
            
            if (confirm) {
                const { error } = await supabaseClient.from('pelanggan').delete().eq('id', id);
                if (!error) {
                    Swal.fire('Terhapus!', 'Data telah dihapus.', 'success');
                    loadTable();
                }
            }
        }
        
        async function loadTable() {
            const { data: pelanggan } = await supabaseClient.from('pelanggan').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            pelanggan.forEach(p => {
                const badgeClass = p.status === 'Sudah Diambil' ? 'ios-badge-success' : 'ios-badge-warning';
                tbody.innerHTML += `
                    <tr>
                        <td>${p.nama_pelanggan}</td>
                        <td>${p.nomor_hp}</td>
                        <td>${p.wilayah}</td>
                        <td><span class="ios-badge ${badgeClass}">${p.status}</span></td>
                        <td><button onclick="deleteData('${p.id}')" class="btn-delete">Hapus</button></td>
                    </tr>
                `;
            });
        }
        
        document.getElementById('searchTable').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(keyword) ? '' : 'none';
            });
        });
        
        loadTable();
    </script>
</body>
</html>
