<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tugas Penarikan</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .customer-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            margin: var(--spacing-lg) var(--spacing-xl);
            transition: transform 0.2s ease;
        }
        
        .customer-card:active {
            transform: scale(0.98);
        }
        
        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-md);
        }
        
        .customer-name {
            font-size: 20px;
            font-weight: 600;
            flex: 1;
            margin-right: var(--spacing-md);
        }
        
        .customer-detail {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: var(--spacing-sm);
        }
        
        .customer-detail a {
            color: var(--ios-blue);
            text-decoration: none;
        }
        
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
        }
        
        .action-btn {
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            min-height: 44px;
        }
        
        .action-btn:active {
            transform: scale(0.96);
        }
        
        .action-btn-wa {
            background: var(--ios-green);
            color: white;
        }
        
        .action-btn-map {
            background: var(--ios-blue);
            color: white;
        }
        
        .action-btn-done {
            grid-column: 1 / -1;
            background: var(--ios-green);
            color: white;
            padding: var(--spacing-lg);
            font-size: 17px;
        }
        
        .empty-state {
            text-align: center;
            padding: 64px var(--spacing-xl);
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: var(--spacing-lg);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-title">Tugas Penarikan</div>
    </div>
    
    <div class="ios-search">
        <span class="ios-search-icon">🔍</span>
        <input type="text" id="searchInput" class="ios-search-input" placeholder="Cari nama, HP, atau wilayah">
    </div>
    
    <div id="customerList">
        <div class="skeleton" style="height: 200px; margin: var(--spacing-lg) var(--spacing-xl);"></div>
        <div class="skeleton" style="height: 200px; margin: var(--spacing-lg) var(--spacing-xl);"></div>
    </div>

    <script>
        var userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn) { window.location.href = 'login.html'; }
        
        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        function formatWA(nomor) {
            var clean = nomor.replace(/\D/g, '');
            if (clean.startsWith('0')) clean = '62' + clean.substring(1);
            return 'https://wa.me/' + clean;
        }
        
        async function completeTask(pelangganId) {
            const { value: formValues } = await Swal.fire({
                title: 'Konfirmasi',
                html: `
                    <input id="swal-tanggal" class="swal2-input" type="date" value="${new Date().toISOString().split('T')[0]}" style="width:100%; margin-bottom:10px;">
                    <textarea id="swal-catatan" class="swal2-textarea" placeholder="Catatan (opsional)" style="width:100%; min-height:80px;"></textarea>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: '✅ Selesai',
                cancelButtonText: 'Batal',
                preConfirm: () => ({
                    tanggal: document.getElementById('swal-tanggal').value,
                    catatan: document.getElementById('swal-catatan').value
                })
            });
            
            if (formValues) {
                const { error } = await supabaseClient.from('pelanggan').update({
                    status: 'Sudah Diambil',
                    tanggal_penarikan: formValues.tanggal,
                    teknisi: userLoggedIn.nama,
                    catatan: formValues.catatan
                }).eq('id', pelangganId);
                
                if (!error) {
                    Swal.fire('Berhasil!', 'Perangkat telah diambil.', 'success');
                    loadCustomers();
                } else {
                    Swal.fire('Error', error.message, 'error');
                }
            }
        }
        
        async function loadCustomers() {
            const { data: pelanggan, error } = await supabaseClient
                .from('pelanggan')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                document.getElementById('customerList').innerHTML = '<div class="empty-state">Error: ' + error.message + '</div>';
                return;
            }
            
            const container = document.getElementById('customerList');
            
            if (!pelanggan || pelanggan.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div>Belum ada data pelanggan</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            pelanggan.forEach(function(p) {
                const badgeClass = p.status === 'Sudah Diambil' ? 'ios-badge-success' : 'ios-badge-warning';
                const waLink = formatWA(p.nomor_hp);
                const mapsLink = 'https://www.google.com/maps?q=' + p.latitude + ',' + p.longitude;
                
                let actionButtons = `
                    <div class="action-grid">
                        <a href="${waLink}" target="_blank" class="action-btn action-btn-wa">📱 WhatsApp</a>
                        <a href="${mapsLink}" target="_blank" class="action-btn action-btn-map">🗺️ Maps</a>
                `;
                
                if (p.status !== 'Sudah Diambil') {
                    actionButtons += `
                        <button onclick="completeTask('${p.id}')" class="action-btn action-btn-done">✅ DONE / SELESAI</button>
                    `;
                }
                
                actionButtons += '</div>';
                
                container.innerHTML += `
                    <div class="customer-card slide-up">
                        <div class="customer-header">
                            <div class="customer-name">${p.nama_pelanggan}</div>
                            <span class="ios-badge ${badgeClass}">${p.status}</span>
                        </div>
                        <div class="customer-detail">
                            📱 <a href="${waLink}" target="_blank">${p.nomor_hp}</a>
                        </div>
                        <div class="customer-detail">
                            📍 ${p.wilayah || '-'}
                        </div>
                        ${p.alamat ? `<div class="customer-detail" style="font-size:13px; margin-top:8px; line-height:1.4;">${p.alamat.substring(0, 80)}${p.alamat.length > 80 ? '...' : ''}</div>` : ''}
                        ${actionButtons}
                    </div>
                `;
            });
        }
        
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.customer-card');
            cards.forEach(function(card) {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(keyword) ? 'block' : 'none';
            });
        });
        
        loadCustomers();
    </script>
</body>
</html>
