<!DOCTYPE html>
<html>
<head>
    <title>Test Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body style="background:#0F172A; color:white; padding:20px; font-family:sans-serif;">
    <h1>Test Supabase Connection</h1>
    <div id="result"></div>
    
    <script>
        const result = document.getElementById('result');
        
        // Test 1: Cek Supabase
        if (typeof supabase === 'undefined') {
            result.innerHTML = '<p style="color:red">❌ Supabase CDN: GAGAL LOAD</p>';
        } else {
            result.innerHTML += '<p style="color:green">✅ Supabase CDN: BERHASIL</p>';
        }
        
        // Test 2: Cek Config
        if (typeof SUPABASE_URL === 'undefined') {
            result.innerHTML += '<p style="color:red">❌ Config.js: GAGAL LOAD</p>';
        } else {
            result.innerHTML += '<p style="color:green">✅ Config.js: BERHASIL</p>';
            result.innerHTML += '<p>URL: ' + SUPABASE_URL + '</p>';
        }
        
        // Test 3: Coba Connect
        try {
            const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            result.innerHTML += '<p style="color:green">✅ Supabase Client: BERHASIL DIBUAT</p>';
            
            // Test 4: Coba Query
            client.from('profiles').select('*').then(({data, error}) => {
                if (error) {
                    result.innerHTML += '<p style="color:orange">️ Query: ERROR - ' + error.message + '</p>';
                } else {
                    result.innerHTML += '<p style="color:green">✅ Query Database: BERHASIL (' + data.length + ' rows)</p>';
                }
            });
        } catch (e) {
            result.innerHTML += '<p style="color:red">❌ Create Client: GAGAL - ' + e.message + '</p>';
        }
    </script>
</body>
</html>
