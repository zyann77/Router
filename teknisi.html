<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tugas Teknisi</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; padding: var(--spacing-xl); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-card); border-radius: 20px; padding: var(--spacing-2xl); width: 100%; max-width: 400px; border: 1px solid rgba(201, 169, 97, 0.3); position: relative; }
        .modal-content::before { content: ''; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px; border: 1px dashed rgba(201, 169, 97, 0.3); border-radius: 16px; pointer-events: none; }
        .modal-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-bottom: var(--spacing-xl); text-align: center; color: var(--cream); position: relative; }
        .modal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md); margin-top: var(--spacing-xl); position: relative; }
        
        .filter-section { padding: 0 var(--spacing-xl) var(--spacing-sm); }
        .filter-label { font-family: var(--font-mono); font-size: 11px; color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: var(--spacing-md); }
        
        .status-chips { display: flex; gap: var(--spacing-sm); padding: 0 var(--spacing-xl) var(--spacing-lg); overflow-x: auto; scrollbar-width: none; }
        .status-chips::-webkit-scrollbar { display: none; }
        .chip { padding: 10px 18px; border-radius: 20px; background: var(--bg-secondary); border: 1px solid rgba(201, 169, 97, 0.2); color: var(--cream-dark); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .chip:active { transform: scale(0.95); }
        .chip.active { background: var(--gold); color: var(--leather-dark); border-color: var(--gold); }
        
        /* BULAN CHIPS - Scroll horizontal */
        .bulan-chips {
            display: flex;
            gap: var(--spacing-sm);
            padding: 0 var(--spacing-xl) var(--spacing-lg);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .bulan-chips::-webkit-scrollbar { display: none; }
        .chip-bulan {
            padding: 10px 16px;
            border-radius: 20px;
            background: var(--bg-secondary);
            border: 1px solid rgba(201, 169, 97, 0.2);
            color: var(--cream-dark);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            min-width: 70px;
            text-align: center;
        }
        .chip-bulan:active { transform: scale(0.95); }
        .chip-bulan.active {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--leather-dark);
            border-color: var(--gold);
            box-shadow: 0 4px 12px rgba(201, 169, 97, 0.3);
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="top-header">
        <div class="header-content">
            <div>
                <div class="header-subtitle">Lapangan Hari Ini</div>
                <div class="header-title">Tugas Teknisi</div>
            </div>
            <div class="header-icon">T</div>
        </div>
    </div>

    <div class="filter-section">
        <div class="filter-label">Pilih Wilayah</div>
    </div>
    <div class="wilayah-grid" id="wilayahGrid"></div>

    <div class="filter-section">
        <div class="filter-label">Filter Status</div>
    </div>
    <div class="status-chips">
        <div class="chip active" onclick="filterByStatus('all', this)">Semua</div>
        <div class="chip" onclick="filterByStatus('Belum Diambil', this)">Belum</div>
        <div class="chip" onclick="filterByStatus('Sudah Diambil', this)">Selesai</div>
    </div>

    <div class="filter-section">
        <div class="filter-label">Filter Bulan Penarikan</div>
    </div>
    <div class="bulan-chips" id="bulanChips"></div>

    <div class="search-container">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Cari nama atau HP...">
        </div>
    </div>

    <div id="customerList"></div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Konfirmasi Penyelesaian</div>
            <div class="input-group">
                <label class="input-label">Tanggal Penarikan</label>
                <input type="date" id="modalTanggal" class="input-field input-mono">
            </div>
            <div class="input-group">
                <label class="input-label">Catatan (Opsional)</label>
                <textarea id="modalCatatan" class="input-field" style="min-height: 80px;" placeholder="Tambahkan catatan..."></textarea>
            </div>
            <div class="modal-buttons">
                <button onclick="closeModal()" class="btn btn-danger">Batal</button>
                <button onclick="confirmComplete()" class="btn btn-success">Selesai</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <div class="nav-label">Teknisi</div>
        </div>
        <div class="nav-item" onclick="logout()">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <div class="nav-label">Keluar</div>
        </div>
    </div>

    <script>
        var userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn) { window.location.href = 'login.html'; }
        
        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        var currentPelangganId = null;
        var currentWilayah = 'all';
        var currentStatus = 'all';
        var currentBulan = 'all';
        var isLoading = false;
        var dataLoaded = false;
        var allCustomers = [];

        const serverIcon = `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="6" rx="1"/><rect x="2" y="15" width="20" height="6" rx="1"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/><line x1="10" y1="6" x2="14" y2="6"/><line x1="10" y1="18" x2="14" y2="18"/></svg>`;

        const wilayahConfig = [
            { name: 'Sukamelang', class: 'wilayah-sukamelang' },
            { name: 'Cibarola', class: 'wilayah-cibarola' },
            { name: 'Panglejar', class: 'wilayah-panglejar' },
            { name: 'Perum / Flamboyan', class: 'wilayah-perum' }
        ];

        const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        function initApp() {
            if (dataLoaded) return;
            dataLoaded = true;
            loadCustomers();
            setupSearch();
        }

        function logout() { localStorage.removeItem('userLoggedIn'); window.location.href = 'login.html'; }

        function formatWA(nomor) {
            var clean = nomor.replace(/\D/g, '');
            if (clean.startsWith('0')) clean = '62' + clean.substring(1);
            return 'https://wa.me/' + clean;
        }

        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(function() { toast.className = 'toast'; }, 3000);
        }

        // === RENDER FILTER BULAN ===
        function renderBulanChips() {
            const container = document.getElementById('bulanChips');
            container.innerHTML = '';
            
            // Chip "Semua"
            container.innerHTML += `<div class="chip-bulan ${currentBulan === 'all' ? 'active' : ''}" onclick="filterByBulan('all', this)">Semua</div>`;
            
            // Chip bulan yang ada datanya (dari tanggal_penarikan)
            const bulanTersedia = new Set();
            allCustomers.forEach(p => {
                if (p.tanggal_penarikan) {
                    const d = new Date(p.tanggal_penarikan);
                    if (!isNaN(d)) {
                        bulanTersedia.add(d.getMonth());
                    }
                }
            });
            
            // Tambahkan bulan saat ini
            bulanTersedia.add(new Date().getMonth());
            
            // Render chip bulan (urut dari Jan ke Des)
            const sortedBulan = Array.from(bulanTersedia).sort((a, b) => a - b);
            sortedBulan.forEach(m => {
                container.innerHTML += `<div class="chip-bulan ${currentBulan === String(m) ? 'active' : ''}" onclick="filterByBulan('${m}', this)">${namaBulan[m]}</div>`;
            });
        }

        function loadWilayahGrid() {
            const grid = document.getElementById('wilayahGrid');
            grid.innerHTML = '';
            
            const allPending = allCustomers.filter(p => p.status !== 'Sudah Diambil').length;
            grid.innerHTML += `
                <div class="wilayah-card" onclick="filterByWilayah('all', this)" style="${currentWilayah === 'all' ? 'border-color: var(--gold); box-shadow: 0 0 20px rgba(201, 169, 97, 0.4);' : ''}; grid-column: 1 / -1;">
                    <div style="display: flex; align-items: center; gap: var(--spacing-md);">
                        <div class="wilayah-icon" style="margin-bottom: 0;">${serverIcon}</div>
                        <div>
                            <div class="wilayah-name">Semua Wilayah</div>
                            <div class="wilayah-count">${allPending} tugas pending</div>
                        </div>
                    </div>
                </div>
            `;
            
            wilayahConfig.forEach((w) => {
                const count = allCustomers.filter(p => p.wilayah === w.name && p.status !== 'Sudah Diambil').length;
                grid.innerHTML += `
                    <div class="wilayah-card ${w.class}" onclick="filterByWilayah('${w.name}', this)" style="${currentWilayah === w.name ? 'box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); transform: scale(1.02);' : ''}">
                        <div>
                            <div class="wilayah-icon">${serverIcon}</div>
                            <div class="wilayah-name">${w.name}</div>
                            <div class="wilayah-count">${count} tugas</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterByWilayah(wilayah) {
            currentWilayah = wilayah;
            loadWilayahGrid();
            renderCustomers();
        }

        function filterByStatus(status, element) {
            currentStatus = status;
            var parent = element.parentElement;
            parent.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderCustomers();
        }

        function filterByBulan(bulan, element) {
            currentBulan = bulan;
            var parent = element.parentElement;
            parent.querySelectorAll('.chip-bulan').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderCustomers();
        }

        // === FILTER BERDASARKAN BULAN ===
        function filterByBulanPenarikan(pelanggan, bulan) {
            if (bulan === 'all') return true;
            if (!pelanggan.tanggal_penarikan) return false;
            const d = new Date(pelanggan.tanggal_penarikan);
            if (isNaN(d)) return false;
            return String(d.getMonth()) === bulan;
        }

        function renderCustomers() {
            var container = document.getElementById('customerList');
            var filtered = allCustomers;
            
            if (currentWilayah !== 'all') {
                filtered = filtered.filter(p => p.wilayah === currentWilayah);
            }
            if (currentStatus !== 'all') {
                filtered = filtered.filter(p => p.status === currentStatus);
            }
            if (currentBulan !== 'all') {
                filtered = filtered.filter(p => filterByBulanPenarikan(p, currentBulan));
            }
            
            // Tampilkan info filter aktif
            let filterInfo = '';
            if (currentBulan !== 'all') {
                filterInfo = `<div style="padding: 0 var(--spacing-xl) var(--spacing-md); font-family: var(--font-mono); font-size: 12px; color: var(--gold);">📅 Menampilkan data bulan: <b>${namaBulan[parseInt(currentBulan)]}</b> (${filtered.length} data)</div>`;
            }
            
            if (filtered.length === 0) {
                container.innerHTML = filterInfo + '<div class="empty-state"><div class="empty-title">Tidak ada data</div><div class="empty-subtitle">Belum ada tugas untuk filter ini</div></div>';
                return;
            }
            
            container.innerHTML = filterInfo;
            
            filtered.forEach(function(p) {
                var badgeClass = p.status === 'Sudah Diambil' ? 'badge-success' : 'badge-warning';
                var waLink = formatWA(p.nomor_hp);
                var mapsLink = 'https://www.google.com/maps?q=' + p.latitude + ',' + p.longitude;
                
                // Tampilkan tanggal penarikan jika ada
                var tanggalInfo = '';
                if (p.tanggal_penarikan) {
                    const d = new Date(p.tanggal_penarikan);
                    if (!isNaN(d)) {
                        const tgl = d.getDate();
                        const bln = namaBulan[d.getMonth()];
                        const thn = d.getFullYear();
                        tanggalInfo = `<div class="card-info mono-text" style="font-size:12px; color: var(--success);">✅ Diambil: ${tgl} ${bln} ${thn}</div>`;
                    }
                }
                
                var actionButtons = '<div class="card-actions">';
                actionButtons += '<a href="' + waLink + '" target="_blank" class="btn btn-whatsapp">WhatsApp</a>';
                actionButtons += '<a href="' + mapsLink + '" target="_blank" class="btn btn-map">Maps</a>';
                
                if (p.status !== 'Sudah Diambil') {
                    actionButtons += '<button onclick="openModal(\'' + p.id + '\')" class="btn btn-success btn-full">Selesai</button>';
                }
                actionButtons += '</div>';
                
                var cardHTML = '<div class="modern-card">';
                cardHTML += '<div class="card-header">';
                cardHTML += '<div><div class="card-title">' + p.nama_pelanggan + '</div>';
                cardHTML += '<div class="card-subtitle mono-text">' + (p.wilayah || '-') + ' • ' + (p.perangkat || 'Router') + '</div></div>';
                cardHTML += '<span class="card-badge ' + badgeClass + '">' + p.status + '</span>';
                cardHTML += '</div>';
                cardHTML += '<div class="card-info mono-text">📱 <a href="' + waLink + '" target="_blank">' + p.nomor_hp + '</a></div>';
                cardHTML += tanggalInfo;
                
                if (p.alamat) {
                    var alamatText = p.alamat.length > 100 ? p.alamat.substring(0, 100) + '...' : p.alamat;
                    cardHTML += '<div class="card-info mono-text" style="font-size:12px; line-height:1.4;">📍 ' + alamatText + '</div>';
                }
                cardHTML += actionButtons;
                cardHTML += '</div>';
                
                container.innerHTML += cardHTML;
            });
        }

        function openModal(pelangganId) {
            currentPelangganId = pelangganId;
            document.getElementById('modalTanggal').value = new Date().toISOString().split('T')[0];
            document.getElementById('modalCatatan').value = '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            currentPelangganId = null;
            document.getElementById('modalOverlay').classList.remove('active');
        }

        async function confirmComplete() {
            if (!currentPelangganId) return;
            var tanggal = document.getElementById('modalTanggal').value;
            var catatan = document.getElementById('modalCatatan').value;
            
            if (!tanggal) { showToast('Tanggal wajib diisi!', 'error'); return; }
            
            try {
                var result = await supabaseClient.from('pelanggan').update({
                    status: 'Sudah Diambil',
                    tanggal_penarikan: tanggal,
                    teknisi: 'Teknisi',
                    catatan: catatan
                }).eq('id', currentPelangganId);
                
                if (result.error) throw result.error;
                showToast('Perangkat berhasil diambil!', 'success');
                closeModal();
                loadCustomers();
            } catch (err) { showToast('Error: ' + err.message, 'error'); }
        }

        async function loadCustomers() {
            if (isLoading) return;
            isLoading = true;
            
            var container = document.getElementById('customerList');
            container.innerHTML = '<div class="skeleton" style="height: 180px; margin: 0 var(--spacing-xl) var(--spacing-lg);"></div><div class="skeleton" style="height: 180px; margin: 0 var(--spacing-xl) var(--spacing-lg);"></div>';
            
            try {
                var result = await supabaseClient.from('pelanggan').select('*').order('created_at', { ascending: false });
                if (result.error) throw result.error;
                allCustomers = result.data || [];
                loadWilayahGrid();
                renderBulanChips();
                renderCustomers();
            } catch (err) {
                container.innerHTML = '<div class="empty-state"><div class="empty-title">Error</div><div class="empty-subtitle">' + err.message + '</div></div>';
            }
            isLoading = false;
        }

        function setupSearch() {
            var searchInput = document.getElementById('searchInput');
            var searchTimeout = null;
            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                var keyword = e.target.value.toLowerCase();
                searchTimeout = setTimeout(function() {
                    var cards = document.querySelectorAll('.modern-card');
                    cards.forEach(function(card) {
                        var text = card.textContent.toLowerCase();
                        card.style.display = text.includes(keyword) ? 'block' : 'none';
                    });
                }, 300);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else { initApp(); }
    </script>
</body>
</html>
