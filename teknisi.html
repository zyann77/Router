<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tugas Penarikan</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-xl);
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: 20px;
            padding: var(--spacing-2xl);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(201, 169, 97, 0.3);
            position: relative;
        }
        
        .modal-content::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px dashed rgba(201, 169, 97, 0.3);
            border-radius: 16px;
            pointer-events: none;
        }
        
        .modal-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: var(--spacing-xl);
            text-align: center;
            color: var(--cream);
            position: relative;
        }
        
        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
            position: relative;
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="top-header">
        <div class="header-content">
            <div>
                <div class="header-subtitle">Lapangan Hari Ini</div>
                <div class="header-title">Daftar Tugas</div>
            </div>
            <div class="header-icon" id="userAvatar">T</div>
        </div>
    </div>

    <div class="search-container">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Cari nama, HP, atau wilayah...">
        </div>
    </div>

    <div class="filter-chips">
        <div class="chip active" onclick="filterByStatus('all', this)">Semua</div>
        <div class="chip" onclick="filterByStatus('Belum Diambil', this)">Belum Diambil</div>
        <div class="chip" onclick="filterByStatus('Sudah Diambil', this)">Sudah Diambil</div>
    </div>

    <div id="customerList"></div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Konfirmasi Penyelesaian</div>
            <div class="input-group">
                <label class="input-label">Tanggal Penarikan</label>
                <input type="date" id="modalTanggal" class="input-field input-mono">
            </div>
            <div class="input-group">
                <label class="input-label">Catatan (Opsional)</label>
                <textarea id="modalCatatan" class="input-field" style="min-height: 80px;" placeholder="Tambahkan catatan..."></textarea>
            </div>
            <div class="modal-buttons">
                <button onclick="closeModal()" class="btn btn-danger">Batal</button>
                <button onclick="confirmComplete()" class="btn btn-success">Selesai</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='dashboard.html'">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <div class="nav-label">Dashboard</div>
        </div>
        <div class="nav-item" onclick="window.location.href='admin.html'">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <div class="nav-label">Kelola Data</div>
        </div>
        <div class="nav-item" onclick="logout()">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <div class="nav-label">Keluar</div>
        </div>
    </div>

    <script>
        var userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn) { window.location.href = 'login.html'; }
        
        document.getElementById('userAvatar').textContent = userLoggedIn.nama.charAt(0).toUpperCase();
        
        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        var currentPelangganId = null;
        var currentFilter = 'all';
        var isLoading = false;
        var dataLoaded = false;

        function initApp() {
            if (dataLoaded) return;
            dataLoaded = true;
            loadCustomers();
            setupSearch();
        }

        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }

        function formatWA(nomor) {
            var clean = nomor.replace(/\D/g, '');
            if (clean.startsWith('0')) clean = '62' + clean.substring(1);
            return 'https://wa.me/' + clean;
        }

        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(function() { toast.className = 'toast'; }, 3000);
        }

        function filterByStatus(status, element) {
            currentFilter = status;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            loadCustomers();
        }

        function openModal(pelangganId) {
            currentPelangganId = pelangganId;
            document.getElementById('modalTanggal').value = new Date().toISOString().split('T')[0];
            document.getElementById('modalCatatan').value = '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            currentPelangganId = null;
            document.getElementById('modalOverlay').classList.remove('active');
        }

        async function confirmComplete() {
            if (!currentPelangganId) return;
            
            var tanggal = document.getElementById('modalTanggal').value;
            var catatan = document.getElementById('modalCatatan').value;
            
            if (!tanggal) {
                showToast('Tanggal wajib diisi!', 'error');
                return;
            }
            
            try {
                var result = await supabaseClient.from('pelanggan').update({
                    status: 'Sudah Diambil',
                    tanggal_penarikan: tanggal,
                    teknisi: userLoggedIn.nama,
                    catatan: catatan
                }).eq('id', currentPelangganId);
                
                if (result.error) throw result.error;
                
                showToast('Perangkat berhasil diambil!', 'success');
                closeModal();
                loadCustomers();
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            }
        }

        async function loadCustomers() {
            if (isLoading) return;
            isLoading = true;
            
            var container = document.getElementById('customerList');
            container.innerHTML = '<div class="skeleton" style="height: 180px; margin: 0 var(--spacing-xl) var(--spacing-lg);"></div><div class="skeleton" style="height: 180px; margin: 0 var(--spacing-xl) var(--spacing-lg);"></div>';
            
            try {
                var result = await supabaseClient.from('pelanggan').select('*').order('created_at', { ascending: false });
                
                if (result.error) throw result.error;
                
                var pelanggan = result.data || [];
                
                if (currentFilter !== 'all') {
                    pelanggan = pelanggan.filter(p => p.status === currentFilter);
                }
                
                if (pelanggan.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Tidak ada data</div><div class="empty-subtitle">Belum ada tugas untuk filter ini</div></div>';
                    isLoading = false;
                    return;
                }
                
                container.innerHTML = '';
                
                pelanggan.forEach(function(p) {
                    var badgeClass = p.status === 'Sudah Diambil' ? 'badge-success' : 'badge-warning';
                    var waLink = formatWA(p.nomor_hp);
                    var mapsLink = 'https://www.google.com/maps?q=' + p.latitude + ',' + p.longitude;
                    
                    var actionButtons = '<div class="card-actions">';
                    actionButtons += '<a href="' + waLink + '" target="_blank" class="btn btn-whatsapp">WhatsApp</a>';
                    actionButtons += '<a href="' + mapsLink + '" target="_blank" class="btn btn-map">Maps</a>';
                    
                    if (p.status !== 'Sudah Diambil') {
                        actionButtons += '<button onclick="openModal(\'' + p.id + '\')" class="btn btn-success btn-full">Selesai</button>';
                    }
                    
                    actionButtons += '</div>';
                    
                    var cardHTML = '<div class="modern-card">';
                    cardHTML += '<div class="card-header">';
                    cardHTML += '<div><div class="card-title">' + p.nama_pelanggan + '</div>';
                    cardHTML += '<div class="card-subtitle mono-text">' + (p.wilayah || '-') + '</div></div>';
                    cardHTML += '<span class="card-badge ' + badgeClass + '">' + p.status + '</span>';
                    cardHTML += '</div>';
                    cardHTML += '<div class="card-info mono-text"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg> <a href="' + waLink + '" target="_blank">' + p.nomor_hp + '</a></div>';
                    
                    if (p.alamat) {
                        var alamatText = p.alamat.length > 100 ? p.alamat.substring(0, 100) + '...' : p.alamat;
                        cardHTML += '<div class="card-info mono-text" style="font-size:12px; line-height:1.4;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> ' + alamatText + '</div>';
                    }
                    
                    cardHTML += actionButtons;
                    cardHTML += '</div>';
                    
                    container.innerHTML += cardHTML;
                });
                
            } catch (err) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">Error</div><div class="empty-subtitle">' + err.message + '</div></div>';
            }
            
            isLoading = false;
        }

        function setupSearch() {
            var searchInput = document.getElementById('searchInput');
            var searchTimeout = null;
            
            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                var keyword = e.target.value.toLowerCase();
                
                searchTimeout = setTimeout(function() {
                    var cards = document.querySelectorAll('.modern-card');
                    cards.forEach(function(card) {
                        var text = card.textContent.toLowerCase();
                        card.style.display = text.includes(keyword) ? 'block' : 'none';
                    });
                }, 300);
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
