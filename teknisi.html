<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tugas Penarikan</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="nav-bar">
        <div>
            <div class="nav-eyebrow">Tugas Hari Ini</div>
            <div class="nav-title" id="teknisiName">Penarikan Perangkat</div>
        </div>
        <button onclick="logout()" class="btn btn-icon btn-ghost" aria-label="Keluar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
    </div>

    <div class="search-wrap">
        <div class="search-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Cari nama, HP, atau wilayah…">
        </div>
    </div>

    <div style="padding: 0 24px 40px;" id="customerList">
        <div class="skeleton" style="height: 180px; margin-bottom: 16px;"></div>
        <div class="skeleton" style="height: 180px; margin-bottom: 16px;"></div>
    </div>

    <script>
        var userLoggedIn = JSON.parse(localStorage.getItem('userLoggedIn'));
        if (!userLoggedIn) { window.location.href = 'login.html'; }
        if (userLoggedIn) document.getElementById('teknisiName').textContent = userLoggedIn.nama || 'Penarikan Perangkat';

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function logout() {
            localStorage.removeItem('userLoggedIn');
            window.location.href = 'login.html';
        }

        function formatWA(nomor) {
            var clean = (nomor || '').replace(/\D/g, '');
            if (clean.startsWith('0')) clean = '62' + clean.substring(1);
            return 'https://wa.me/' + clean;
        }

        const ICON_WA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
        const ICON_MAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
        const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

        async function completeTask(pelangganId) {
            const { value: formValues } = await Swal.fire({
                title: 'Konfirmasi Penyelesaian',
                html: `
                    <input id="swal-tanggal" class="swal2-input" type="date" value="${new Date().toISOString().split('T')[0]}" style="width:100%; margin-bottom:10px;">
                    <textarea id="swal-catatan" class="swal2-textarea" placeholder="Catatan (opsional)" style="width:100%; min-height:80px;"></textarea>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Ya, Sudah Diambil',
                cancelButtonText: 'Batal',
                background: '#18171b',
                color: '#f3efe7',
                confirmButtonColor: '#c9a96e',
                cancelButtonColor: '#2a2930',
                preConfirm: () => ({
                    tanggal: document.getElementById('swal-tanggal').value,
                    catatan: document.getElementById('swal-catatan').value
                })
            });

            if (formValues) {
                const { error } = await supabaseClient.from('pelanggan').update({
                    status: 'Sudah Diambil',
                    tanggal_penarikan: formValues.tanggal,
                    teknisi: userLoggedIn.nama,
                    catatan: formValues.catatan
                }).eq('id', pelangganId);

                if (!error) {
                    Swal.fire({ title: 'Berhasil', text: 'Perangkat telah diambil.', icon: 'success', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' });
                    loadCustomers();
                } else {
                    Swal.fire({ title: 'Error', text: error.message, icon: 'error', background: '#18171b', color: '#f3efe7', confirmButtonColor: '#c9a96e' });
                }
            }
        }

        async function loadCustomers() {
            const { data: pelanggan, error } = await supabaseClient
                .from('pelanggan')
                .select('*')
                .order('created_at', { ascending: false });

            const container = document.getElementById('customerList');

            if (error) {
                container.innerHTML = `<div class="entry-card pending">Error: ${error.message}</div>`;
                return;
            }

            if (!pelanggan || pelanggan.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="signet">${ICON_CHECK}</div>
                        <div class="empty-title">Belum ada tugas</div>
                        <div>Data pelanggan akan muncul di sini.</div>
                    </div>`;
                return;
            }

            container.innerHTML = '';

            pelanggan.forEach(function (p) {
                const isDone = p.status === 'Sudah Diambil';
                const waLink = formatWA(p.nomor_hp);
                const mapsLink = (p.latitude && p.longitude) ? `https://www.google.com/maps?q=${p.latitude},${p.longitude}` : null;

                const card = document.createElement('div');
                card.className = `entry-card fade-in ${isDone ? 'done' : 'pending'}`;
                card.innerHTML = `
                    <div class="entry-header">
                        <div class="entry-name">${p.nama_pelanggan}</div>
                        <span class="status ${isDone ? 'done' : 'pending'}"><span class="status-dot"></span>${isDone ? 'Selesai' : 'Menunggu'}</span>
                    </div>
                    <div class="entry-meta">${ICON_WA}<a href="${waLink}" target="_blank" style="color:var(--ink-soft);">${p.nomor_hp}</a></div>
                    <div class="entry-meta" style="margin-bottom:0;">${ICON_MAP}${p.wilayah || '-'}</div>
                    <div class="entry-actions">
                        <a href="${waLink}" target="_blank" class="btn btn-wa">${ICON_WA} WhatsApp</a>
                        ${mapsLink ? `<a href="${mapsLink}" target="_blank" class="btn btn-map">${ICON_MAP} Peta</a>` : `<span class="btn btn-ghost" style="opacity:0.4;">${ICON_MAP} Tanpa Titik</span>`}
                        ${!isDone ? `<button onclick="completeTask('${p.id}')" class="btn btn-success full">${ICON_CHECK} Tandai Selesai</button>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', function (e) {
            const keyword = e.target.value.toLowerCase();
            document.querySelectorAll('#customerList .entry-card').forEach(function (card) {
                card.style.display = card.textContent.toLowerCase().includes(keyword) ? '' : 'none';
            });
        });

        loadCustomers();
    </script>
</body>
</html>
