<!DOCTYPE html>
<html lang="id" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Detail Rekap PSB</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(25px);
            --accent-gold: #C9A961;
            --accent-gold-light: #E5C97A;
            --success: #10B981;
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            --font-main: 'Poppins', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: var(--font-main); 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; /* Mengunci layar agar pas 1 screenshot */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 16px;
            position: relative;
        }

        /* Ambient Glow Background */
        .bg-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.22; }
        .blob-1 { width: 300px; height: 300px; background: #8B5CF6; top: -10%; left: -10%; }
        .blob-2 { width: 300px; height: 300px; background: #10B981; bottom: -10%; right: -10%; }

        .app-container {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Top Header Area */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .btn-back {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: 12px;
            backdrop-filter: var(--glass-blur);
        }
        .btn-back svg { width: 14px; height: 14px; stroke: var(--text-muted); stroke-width: 2; fill: none; }

        /* Logo Transparan */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .logo-svg {
            width: 100px;
            height: auto;
            background: transparent;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
        }

        /* Main Month Title Banner */
        .title-banner {
            text-align: center;
            background: rgba(201, 169, 97, 0.1);
            border: 1px solid rgba(201, 169, 97, 0.25);
            padding: 8px 12px;
            border-radius: 14px;
            backdrop-filter: var(--glass-blur);
        }
        .title-banner h2 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--accent-gold-light);
            text-transform: uppercase;
        }
        .realtime-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 400;
        }

        /* Main Summary Banner */
        .summary-banner {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(201, 169, 97, 0.08));
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 18px;
            padding: 12px 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            backdrop-filter: var(--glass-blur);
        }
        .sum-card { display: flex; flex-direction: column; gap: 2px; }
        .sum-card.border-right { border-right: 1px solid rgba(255, 255, 255, 0.1); padding-right: 8px; }
        .sum-label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .sum-value { font-size: 20px; font-weight: 700; color: var(--success); line-height: 1.1; }
        .sum-sub { font-size: 10px; font-weight: 500; color: var(--accent-gold-light); }

        /* Package Details Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
        }
        .section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .package-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: flex-start;
            overflow: hidden;
        }

        .package-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 9px 12px;
            backdrop-filter: var(--glass-blur);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pkg-info { display: flex; flex-direction: column; gap: 2px; }
        .pkg-name { font-size: 13px; font-weight: 700; color: #FFFFFF; }
        .pkg-count { font-size: 11px; color: #6EE7B7; font-weight: 500; }
        .pkg-total { text-align: right; display: flex; flex-direction: column; gap: 1px; }
        .pkg-price-val { font-size: 14px; font-weight: 700; color: var(--accent-gold-light); }
        .pkg-unit-price { font-size: 10px; color: var(--text-muted); }

        /* Footer Stamp */
        .footer-stamp {
            text-align: center;
            font-size: 9px;
            color: var(--text-muted);
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="bg-layer">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <!-- Top Header -->
        <div class="header">
            <a href="index.html" class="btn-back">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Wangsul
            </a>
            
            <!-- Logo RnB Transparan -->
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 130 70" xmlns="http://www.w3.org/2000/svg">
                  <text x="6" y="34" font-family="Arial Black, Impact, sans-serif" font-size="34" font-weight="900" fill="#E31E24">R</text>
                  <text x="32" y="32" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" transform="rotate(15 41 20)">n</text>
                  <text x="44" y="34" font-family="Arial Black, Impact, sans-serif" font-size="34" font-weight="900" fill="#E31E24">B</text>
                  <text x="6" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#FFD700" font-style="italic">by</text>
                  <ellipse cx="48" cy="48" rx="30" ry="9" fill="none" stroke="#FFD700" stroke-width="1.8" transform="rotate(-12 48 48)"/>
                  <text x="18" y="52" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#1E90FF" letter-spacing="-1">PMY</text>
                  <text x="52" y="52" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#00C853" letter-spacing="-1">NET</text>
                </svg>
            </div>
        </div>

        <!-- Realtime Month Banner Title -->
        <div class="title-banner">
            <h2 id="bannerMonthTitle">TOTAL PSB BULAN SEPTEMBER 2026</h2>
            <div class="realtime-tag" id="realtimeDateSub">Update Terkini: Realtime</div>
        </div>

        <!-- Summary Banner -->
        <div class="summary-banner">
            <div class="sum-card border-right">
                <span class="sum-label">Total PSB</span>
                <span class="sum-value" id="totalCountPSB">0</span>
                <span class="sum-sub">Terpasang</span>
            </div>
            <div class="sum-card">
                <span class="sum-label">Total Uang</span>
                <span class="sum-value" style="color: var(--accent-gold-light);" id="totalUangPSB">Rp 0</span>
            </div>
        </div>

        <!-- Section Label -->
        <div class="section-header">
            <span class="section-title">Rincian Per Paket</span>
        </div>

        <!-- Dynamic Package List -->
        <div class="package-list" id="packageListContainer">
            <div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 12px;">
                Ngamuat data PSB...
            </div>
        </div>

        <!-- Footer Info -->
        <div class="footer-stamp">
            RNB NETWORK SUBANG • REALTIME REKAP
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const namaBulanArr = ['Januari', 'Pébruari', 'Maret', 'April', 'Méi', 'Juni', 'Juli', 'Agustus', 'Séptémber', 'Oktober', 'Nopémber', 'Desémber'];

        function updateRealtimeLabels(now) {
            const tgl = now.getDate();
            const bulanIdx = now.getMonth();
            const tahun = now.getFullYear();
            const jam = String(now.getHours()).padStart(2, '0');
            const menit = String(now.getMinutes()).padStart(2, '0');

            const bulanStr = namaBulanArr[bulanIdx].toUpperCase();
            
            document.getElementById('bannerMonthTitle').textContent = `TOTAL PSB BULAN ${bulanStr} ${tahun}`;
            document.getElementById('realtimeDateSub').textContent = `Per ${tgl} ${namaBulanArr[bulanIdx]} ${tahun} • ${jam}:${menit} WIB`;
        }

        async function muatDetailPSB() {
            const now = new Date();
            const bulanIni = now.getMonth();
            const tahunIni = now.getFullYear();

            updateRealtimeLabels(now);

            try {
                const { data: psbSemua, error } = await supabaseClient
                    .from('psb')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const psbBulanIni = (psbSemua || []).filter(item => {
                    const tgl = item.tanggal_pasang || item.created_at;
                    if (!tgl) return false;
                    const d = new Date(tgl);
                    return d.getMonth() === bulanIni && d.getFullYear() === tahunIni;
                });

                let grandTotalCount = psbBulanIni.length;
                let grandTotalUang = 0;

                const rekapPaket = {};

                psbBulanIni.forEach(item => {
                    const paketName = item.paket || 'Paket Lain';
                    const hargaVal = parseInt(item.harga) || 0;

                    grandTotalUang += hargaVal;

                    if (!rekapPaket[paketName]) {
                        rekapPaket[paketName] = {
                            count: 0,
                            totalRupiah: 0,
                            hargaSatuan: hargaVal
                        };
                    }
                    rekapPaket[paketName].count += 1;
                    rekapPaket[paketName].totalRupiah += hargaVal;
                });

                document.getElementById('totalCountPSB').textContent = grandTotalCount;
                document.getElementById('totalUangPSB').textContent = 'Rp ' + grandTotalUang.toLocaleString('id-ID');

                const container = document.getElementById('packageListContainer');
                container.innerHTML = '';

                const keyPaketArr = Object.keys(rekapPaket);

                if (keyPaketArr.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; color: var(--text-muted); padding: 25px; font-size: 12px;">
                            Teu aya data PSB dina bulan ieu.
                        </div>`;
                    return;
                }

                keyPaketArr.sort((a, b) => rekapPaket[b].count - rekapPaket[a].count);

                keyPaketArr.forEach(pkgKey => {
                    const data = rekapPaket[pkgKey];
                    const card = document.createElement('div');
                    card.className = 'package-card';
                    card.innerHTML = `
                        <div class="pkg-info">
                            <div class="pkg-name">${pkgKey}</div>
                            <div class="pkg-count">✓ ${data.count} Terpasang</div>
                        </div>
                        <div class="pkg-total">
                            <div class="pkg-price-val">Rp ${data.totalRupiah.toLocaleString('id-ID')}</div>
                            <div class="pkg-unit-price">@ Rp ${data.hargaSatuan.toLocaleString('id-ID')}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Gagal muat data detail PSB:", err);
                document.getElementById('packageListContainer').innerHTML = `
                    <div style="text-align: center; color: #EF4444; padding: 20px; font-size: 12px;">
                        Gagal ngamuat data Supabase!
                    </div>`;
            }
        }

        muatDetailPSB();
    </script>
</body>
</html>
