<!DOCTYPE html>
<html lang="su" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="google" content="notranslate">
    <title>Iyann RnB Network Tools - Detail Rekap PSB</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --bg-dark: #050505; 
            --glass-bg: rgba(255, 255, 255, 0.04); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(30px); 
            --aurora-1: #8B5CF6; 
            --aurora-2: #3B82F6; 
            --accent-gold: #C9A961;
            --accent-gold-light: #E5C97A; 
            --success: #10B981; 
            --danger: #EF4444;
            --text-main: #FFFFFF; 
            --text-muted: #A1A1AA;
            --font-main: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --smooth: cubic-bezier(0.25, 1, 0.25, 1);
        }

        /* PROTEKSI ANTI SELECT / ANTI COPY */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: var(--font-main); 
            min-height: 100vh; 
            padding: 20px 20px 60px; 
            position: relative; 
            overflow-x: hidden; 
        }

        /* Aurora background */
        .bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .aurora-blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.25; mix-blend-mode: screen; }
        .blob-1 { width: 400px; height: 400px; background: var(--aurora-1); top: -10%; left: -10%; }
        .blob-2 { width: 350px; height: 350px; background: var(--aurora-2); bottom: -10%; right: -10%; }

        /* Navigation & Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; max-width: 900px; margin-left: auto; margin-right: auto; }
        .btn-wangsul {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-border);
            border-radius: 12px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 500;
            backdrop-filter: blur(10px); transition: all 0.2s; cursor: pointer;
        }
        .btn-wangsul:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.12); }
        
        /* LOGO STYLING SVG */
        .logo-rnb-box { display: flex; align-items: center; }
        .logo-rnb-box svg { height: 45px; width: auto; overflow: visible; }

        /* Main Container */
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }

        /* Title Header Box */
        .banner-box {
            background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur);
            border-radius: 16px; padding: 18px; text-align: center;
        }
        .banner-title { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent-gold-light); text-transform: uppercase; }
        .banner-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-weight: 400; }

        /* Summary Cards Grid */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .summary-card {
            background: rgba(16, 185, 129, 0.03); border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px; padding: 18px 20px; backdrop-filter: var(--glass-blur);
        }
        .summary-card.gold-card {
            background: rgba(201, 169, 97, 0.03); border-color: rgba(201, 169, 97, 0.2);
        }
        .sc-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .sc-val { font-size: 30px; font-weight: 700; color: var(--success); margin: 4px 0 2px; line-height: 1.1; }
        .gold-card .sc-val { color: var(--accent-gold-light); }
        .sc-sub { font-size: 11px; color: var(--success); font-weight: 500; }

        /* Section Title */
        .section-header { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 5px; }

        /* Package Accordion List */
        .package-list { display: flex; flex-direction: column; gap: 12px; }
        .package-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur);
            border-radius: 16px; overflow: hidden; transition: all 0.3s var(--smooth);
        }
        .package-header {
            padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; background: rgba(255, 255, 255, 0.01); transition: background 0.2s;
        }
        .package-header:active { background: rgba(255, 255, 255, 0.05); }
        .pkg-title-area { display: flex; flex-direction: column; gap: 4px; }
        .pkg-name { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
        .pkg-arrow { font-size: 9px; transition: transform 0.3s; color: var(--text-muted); }
        .package-card.active .pkg-arrow { transform: rotate(180deg); }
        .pkg-count { font-size: 12px; font-weight: 600; color: var(--success); display: flex; align-items: center; gap: 4px; }
        
        .pkg-price-area { text-align: right; }
        .pkg-total-price { font-size: 16px; font-weight: 700; color: #3B82F6; }
        .pkg-unit-price { font-size: 10px; color: #93C5FD; font-weight: 600; background: rgba(59, 130, 246, 0.2); padding: 3px 8px; border-radius: 6px; display: inline-block; margin-top: 3px; }

        /* Accordion Body Details */
        .package-body { display: none; padding: 0 20px 16px; border-top: 1px solid rgba(255, 255, 255, 0.05); background: rgba(0, 0, 0, 0.25); }
        .package-card.active .package-body { display: block; }

        .customer-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .customer-item:last-child { border-bottom: none; }
        .cust-info { display: flex; flex-direction: column; gap: 2px; }
        .cust-name { font-size: 13px; font-weight: 600; color: #fff; }
        .cust-alamat { font-size: 11px; color: var(--text-muted); }
        .cust-date { font-size: 11px; color: var(--accent-gold-light); text-align: right; font-weight: 500; }

        .footer-text { text-align: center; font-size: 10px; color: var(--text-muted); letter-spacing: 1.5px; margin-top: 25px; text-transform: uppercase; }

        .page-transit { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; opacity: 0; pointer-events: none; transition: 0.4s; }
        .page-transit.active { opacity: 1; pointer-events: all; }
    </style>
</head>
<body>

    <div class="bg-layer">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
    </div>
    <div class="page-transit" id="pageTransit"></div>

    <div class="top-bar">
        <a href="index.html" class="btn-wangsul transit-link">
            ‹ Wangsul
        </a>
        <div class="logo-rnb-box">
            <svg viewBox="0 0 130 70" xmlns="http://www.w3.org/2000/svg">
              <text x="6" y="34" font-family="Arial Black, Impact, sans-serif" font-size="34" font-weight="900" fill="#E31E24">R</text>
              <text x="32" y="32" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" fill="#ffffff" transform="rotate(15 41 20)">n</text>
              <text x="44" y="34" font-family="Arial Black, Impact, sans-serif" font-size="34" font-weight="900" fill="#E31E24">B</text>
              <text x="6" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#FFD700" font-style="italic">by</text>
              <ellipse cx="48" cy="48" rx="30" ry="9" fill="none" stroke="#FFD700" stroke-width="1.8" transform="rotate(-12 48 48)"/>
              <text x="18" y="52" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#1E90FF" letter-spacing="-1">PMY</text>
              <text x="52" y="52" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#00C853" letter-spacing="-1">NET</text>
            </svg>
        </div>
    </div>

    <div class="container">
        <!-- HEADER BANNER BULAN -->
        <div class="banner-box">
            <div class="banner-title" id="bannerTitle">TOTAL PSB BULAN ...</div>
            <div class="banner-sub" id="bannerSub">Per ...</div>
        </div>

        <!-- REKAP CARD -->
        <div class="summary-grid">
            <div class="summary-card">
                <div class="sc-label">TOTAL PSB</div>
                <div class="sc-val" id="totalPsbCount">0</div>
                <div class="sc-sub">Terpasang</div>
            </div>
            <div class="summary-card gold-card">
                <div class="sc-label">TOTAL UANG</div>
                <div class="sc-val" id="totalPsbUang">Rp 0</div>
            </div>
        </div>

        <div class="section-header">RINCIAN PER PAKET (KLIK UNTUK DETAIL)</div>

        <!-- LIST ACCORDION PAKET -->
        <div class="package-list" id="packageListContainer">
            <!-- Dynamic Data Render Here -->
        </div>

        <div class="footer-text">RNB NETWORK SUBANG • REALTIME REKAP</div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const namaBulanReal = ['Januari', 'Pébruari', 'Maret', 'April', 'Méi', 'Juni', 'Juli', 'Agustus', 'Séptémber', 'Oktober', 'Nopémber', 'Desémber'];

        function isBulanIni(tglInput, now) {
            if (!tglInput) return false;
            if (typeof tglInput === 'string') {
                const cleanStr = tglInput.split('T')[0];
                const parts = cleanStr.split(/[-/]/);
                if (parts.length === 3) {
                    let year, month;
                    if (parts[0].length === 4) {
                        year = parseInt(parts[0], 10);
                        month = parseInt(parts[1], 10) - 1;
                    } else {
                        year = parseInt(parts[2], 10);
                        month = parseInt(parts[1], 10) - 1;
                    }
                    return year === now.getFullYear() && month === now.getMonth();
                }
            }
            const d = new Date(tglInput);
            return !isNaN(d.getTime()) && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        }

        async function muatDataRekapPSB() {
            const now = new Date();
            const bulanStr = namaBulanReal[now.getMonth()].toUpperCase();
            
            // Set Header Banner
            document.getElementById('bannerTitle').textContent = `TOTAL PSB BULAN ${bulanStr} ${now.getFullYear()}`;
            
            const day = now.getDate();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('bannerSub').textContent = `Per ${day} ${namaBulanReal[now.getMonth()]} ${now.getFullYear()} • ${hrs}:${mins} WIB`;

            try {
                const { data: psbSemua, error } = await supabaseClient
                    .from('psb')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Filter Data Bulan Ini
                const psbBulanIni = psbSemua ? psbSemua.filter(item => {
                    const tgl = item.tanggal_pasang || item.created_at || item.tanggal;
                    return isBulanIni(tgl, now);
                }) : [];

                // Hitung Total keseluruhan
                let grandTotalCount = psbBulanIni.length;
                let grandTotalUang = 0;

                // Grouping berdasarkan Nama Paket
                const paketGroup = {};

                psbBulanIni.forEach(item => {
                    const namaPaket = item.paket || item.layanan || 'Paket Lainnya';
                    const harga = parseInt(item.harga) || 0;
                    grandTotalUang += harga;

                    if (!paketGroup[namaPaket]) {
                        paketGroup[namaPaket] = {
                            nama: namaPaket,
                            hargaSatuan: harga,
                            totalHarga: 0,
                            count: 0,
                            pelanggan: []
                        };
                    }
                    paketGroup[namaPaket].count++;
                    paketGroup[namaPaket].totalHarga += harga;
                    paketGroup[namaPaket].pelanggan.push(item);
                });

                // Update UI Summary Box
                document.getElementById('totalPsbCount').textContent = grandTotalCount;
                document.getElementById('totalPsbUang').textContent = "Rp " + grandTotalUang.toLocaleString('id-ID');

                // Render List Paket
                const container = document.getElementById('packageListContainer');
                container.innerHTML = '';

                const paketSorted = Object.values(paketGroup).sort((a, b) => b.count - a.count);

                if (paketSorted.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">Allahumma innii as-aluka 'ilman naafi'a, wa rizqon thoyyibaa, wa 'amalan mutaqobbalaa</div>`;
                    return;
                }

                paketSorted.forEach(pkg => {
                    const card = document.createElement('div');
                    card.className = 'package-card';
                    
                    let pelangganHtml = '';
                    pkg.pelanggan.forEach(p => {
                        const tglPasang = p.tanggal_pasang || p.created_at || p.tanggal || '';
                        const cleanTgl = tglPasang.split('T')[0];
                        pelangganHtml += `
                            <div class="customer-item">
                                <div class="cust-info">
                                    <div class="cust-name">${p.nama || p.nama_pelanggan || 'Tanpa Nama'}</div>
                                    <div class="cust-alamat">${p.alamat || p.lokasi || '-'}</div>
                                </div>
                                <div class="cust-date">${cleanTgl}</div>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <div class="package-header" onclick="toggleAccordion(this)">
                            <div class="pkg-title-area">
                                <div class="pkg-name">
                                    ${pkg.nama} <span class="pkg-arrow">▼</span>
                                </div>
                                <div class="pkg-count">✓ ${pkg.count} Terpasang</div>
                            </div>
                            <div class="pkg-price-area">
                                <div class="pkg-total-price">Rp ${pkg.totalHarga.toLocaleString('id-ID')}</div>
                                <div class="pkg-unit-price">@ Rp ${pkg.hargaSatuan.toLocaleString('id-ID')}</div>
                            </div>
                        </div>
                        <div class="package-body">
                            ${pelangganHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Gagal ngamuat rekap PSB:", err);
            }
        }

        function toggleAccordion(headerEl) {
            const card = headerEl.parentElement;
            card.classList.toggle('active');
        }

        // Transisi halaman
        const pageTransit = document.getElementById('pageTransit');
        document.querySelectorAll('.transit-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault(); 
                const href = this.getAttribute('href');
                pageTransit.classList.add('active'); 
                setTimeout(() => window.location.href = href, 400);
            });
        });

        window.addEventListener('DOMContentLoaded', muatDataRekapPSB);
    </script>
</body>
</html>
