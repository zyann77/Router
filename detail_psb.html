<!DOCTYPE html>
<html lang="su" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090B11" id="metaTheme">
<meta name="google" content="notranslate">
<title>Iyann RnB Network Tools - Detail Rekap PSB</title>

<script>
(function(){var t;try{t=localStorage.getItem('rnb-theme')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t;
document.getElementById('metaTheme').content=t==='light'?'#EEF1F7':'#090B11';})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --smooth:cubic-bezier(.25,1,.25,1);
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#090B11; --surface:#10131B; --surface-2:#161A24; --line:rgba(255,255,255,.08);
  --ink:#EEF1F8; --muted:#8C94A8; --accent:#7AA7FF; --accent-soft:rgba(122,167,255,.14);
  --ok:#3DDC97; --ok-soft:rgba(61,220,151,.13); --glow:rgba(79,110,255,.20);
  --shadow:none; --logo-n:#fff; --logo-y:#FFD700;
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#EEF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:rgba(15,23,42,.08);
  --ink:#0E1424; --muted:#5B657B; --accent:#2457F5; --accent-soft:rgba(36,87,245,.09);
  --ok:#0A8F5C; --ok-soft:rgba(10,143,92,.10); --glow:rgba(36,87,245,.13);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px -14px rgba(15,23,42,.14);
  --logo-n:#0E1424; --logo-y:#E0A400;
}

/* Proteksi anti select / anti copy */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}

body{
  font-family:var(--font); background:var(--bg); color:var(--ink); min-height:100vh;
  background-image:radial-gradient(900px 420px at 88% -8%,var(--glow),transparent 70%);
  background-repeat:no-repeat; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
          max(48px,calc(env(safe-area-inset-bottom) + 28px)) max(16px,env(safe-area-inset-left));
  transition:background-color .3s,color .3s;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

.shell{max-width:720px;margin:0 auto}

/* Top bar */
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.btn-wangsul,.btn-theme{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  font-size:13px;font-weight:600;transition:transform .2s,background .2s;
}
.btn-wangsul{padding:0 16px 0 10px}
.btn-theme{width:42px}
.btn-wangsul:active,.btn-theme:active{transform:scale(.94)}
.btn-wangsul svg,.btn-theme svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo-rnb-box{margin-left:auto;display:flex;align-items:center}
.logo-rnb-box svg{height:40px;width:auto;overflow:visible}
.ln{fill:var(--logo-n)} .ly{fill:var(--logo-y)} .ly-s{stroke:var(--logo-y)}
.ico-sun{display:none} html[data-theme=light] .ico-sun{display:block} html[data-theme=light] .ico-moon{display:none}

/* Layout */
.layout{display:flex;flex-direction:column;gap:16px}
.aside{display:flex;flex-direction:column;gap:12px}
.main{display:flex;flex-direction:column;gap:12px;min-width:0}

/* Hero */
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:22px;color:#fff;
  background:linear-gradient(140deg,#2563EB 0%,#3F3FD8 100%);
  box-shadow:0 18px 40px -18px rgba(37,99,235,.55);
}
.hero::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 38px rgba(255,255,255,.04),0 0 0 76px rgba(255,255,255,.03);pointer-events:none}
.hero h1{font-size:16px;font-weight:700;line-height:1.35;position:relative}
.hero p{font-size:12px;color:rgba(255,255,255,.72);margin-top:4px;position:relative}
.stats{display:flex;flex-wrap:wrap;gap:18px 32px;margin-top:22px;position:relative}
.sv{font-size:clamp(34px,10vw,44px);font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sv.money{font-size:clamp(22px,6.4vw,28px);padding-top:calc(clamp(34px,10vw,44px) - clamp(22px,6.4vw,28px));letter-spacing:-.01em}
.sl{font-size:12px;color:rgba(255,255,255,.72);margin-top:8px;font-weight:500}

/* Link komparasi */
.link-card{
  display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:13px;font-weight:600;transition:transform .2s;
}
.link-card:active{transform:scale(.985)}
.link-card .ic{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.link-card .ic svg{width:18px;height:18px}
.link-card .chev{margin-left:auto;color:var(--muted);width:18px;height:18px}
svg.s{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.section-header{font-size:15px;font-weight:700;padding:6px 4px 2px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.section-header small{font-size:12px;font-weight:500;color:var(--muted)}

/* Paket */
.package-list{display:flex;flex-direction:column;gap:10px}
.package-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .3s}
.package-card.active{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.package-header{
  width:100%;text-align:left;display:grid;grid-template-columns:1fr auto 20px;align-items:center;
  column-gap:12px;row-gap:14px;padding:16px 18px;
}
.pkg-name{font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.pkg-count{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 10px 3px 8px;border-radius:999px;
  background:var(--ok-soft);color:var(--ok);font-size:11.5px;font-weight:600}
.pkg-count::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pkg-price-area{text-align:right}
.pkg-total-price{font-size:15px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.pkg-unit-price{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:8px;background:var(--accent-soft);
  color:var(--accent);font-size:11px;font-weight:600;white-space:nowrap}
.pkg-arrow{width:18px;height:18px;color:var(--muted);transition:transform .3s var(--smooth)}
.package-card.active .pkg-arrow{transform:rotate(180deg)}
.pkg-share{grid-column:1/-1;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pkg-share i{display:block;height:100%;border-radius:99px;background:var(--accent)}

.package-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--smooth)}
.package-card.active .package-body{grid-template-rows:1fr}
.pb-clip{overflow:hidden;min-height:0}
.pb-list{padding:2px 18px 8px;border-top:1px solid var(--line);background:var(--surface-2)}
.customer-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.customer-item:last-child{border-bottom:0}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.cust-info{flex:1;min-width:0}
.cust-name{font-size:13px;font-weight:600}
.cust-alamat{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.cust-date{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}

.state{text-align:center;padding:36px 20px;color:var(--muted);font-size:13px;line-height:1.7;background:var(--surface);
  border:1px dashed var(--line);border-radius:20px}

.footer-text{text-align:center;font-size:11.5px;color:var(--muted);margin-top:34px}

.page-transit{position:fixed;inset:0;background:var(--bg);z-index:9999;opacity:0;pointer-events:none;transition:opacity .4s}
.page-transit.active{opacity:1;pointer-events:all}

/* Tablet & PC */
@media (min-width:960px){
  body{padding-top:32px}
  .shell{max-width:1080px}
  .layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:28px;align-items:start}
  .aside{position:sticky;top:24px}
  .hero{padding:28px}
  .hero h1{font-size:17px}
  .package-header{padding:18px 22px}
  .pb-list{padding:4px 22px 10px}
  .package-card:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
  .btn-wangsul:hover,.btn-theme:hover,.link-card:hover{background:var(--surface-2)}
}
@media (max-width:360px){
  .package-header{padding:14px}
  .pkg-total-price{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="page-transit" id="pageTransit"></div>

<div class="shell">
  <div class="top-bar">
    <a href="index.html" class="btn-wangsul transit-link">
      <svg class="s" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Wangsul
    </a>
    <div class="logo-rnb-box">
      <svg viewBox="0 0 130 70" xmlns="http://www.w3.org/2000/svg" aria-label="RnB by PMY NET">
        <text x="6" y="34" font-family="Arial Black, Impact, sans-serif" font-size="34" font-weight="900" fill="#E31E24">R</text>
        <text x="32" y="32" class="ln" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" transform="rotate(15 41 20)">n</text>
        <text x="44" y="34" font-family="Arial Black, Impact, sans-serif" font-size="34" font-weight="900" fill="#E31E24">B</text>
        <text x="6" y="42" class="ly" font-family="Arial, sans-serif" font-size="10" font-weight="600" font-style="italic">by</text>
        <ellipse class="ly-s" cx="48" cy="48" rx="30" ry="9" fill="none" stroke-width="1.8" transform="rotate(-12 48 48)"/>
        <text x="18" y="52" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#1E90FF" letter-spacing="-1">PMY</text>
        <text x="52" y="52" font-family="Arial Black, Impact, sans-serif" font-size="16" font-weight="900" fill="#00C853" letter-spacing="-1">NET</text>
      </svg>
    </div>
    <button class="btn-theme" id="btnTheme" onclick="toggleTheme()" aria-label="Ganti tema terang atau gelap">
      <svg class="s ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="s ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="layout">
    <div class="aside">
      <section class="hero">
        <h1 id="bannerTitle">Total PSB bulan ...</h1>
        <p id="bannerSub">Per ...</p>
        <div class="stats">
          <div>
            <div class="sv" id="totalPsbCount">0</div>
            <div class="sl">PSB terpasang</div>
          </div>
          <div>
            <div class="sv money" id="totalPsbUang">Rp 0</div>
            <div class="sl">Total uang</div>
          </div>
        </div>
      </section>

      <a href="komparasi_psb.html" class="link-card transit-link">
        <span class="ic"><svg class="s" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
        Komparasi performa PSB
        <svg class="s chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
    </div>

    <div class="main">
      <div class="section-header">Rincian per paket <small>Ketuk untuk lihat pelanggan</small></div>
      <div class="package-list" id="packageListContainer">
        <div class="state">Memuat data…</div>
      </div>
    </div>
  </div>

  <div class="footer-text">RnB Network Subang, rekap realtime</div>
</div>

<script>
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const namaBulanReal = ['Januari','Pébruari','Maret','April','Méi','Juni','Juli','Agustus','Séptémber','Oktober','Nopémber','Desémber'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + n.toLocaleString('id-ID');

function fmtTgl(s) {
    const clean = String(s || '').split('T')[0];
    const m = clean.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? `${+m[3]} ${namaBulanReal[+m[2] - 1].slice(0, 3)}` : clean;
}

function isBulanIni(tglInput, now) {
    if (!tglInput) return false;
    if (typeof tglInput === 'string') {
        const cleanStr = tglInput.split('T')[0];
        const parts = cleanStr.split(/[-/]/);
        if (parts.length === 3) {
            let year, month;
            if (parts[0].length === 4) {
                year = parseInt(parts[0], 10);
                month = parseInt(parts[1], 10) - 1;
            } else {
                year = parseInt(parts[2], 10);
                month = parseInt(parts[1], 10) - 1;
            }
            return year === now.getFullYear() && month === now.getMonth();
        }
    }
    const d = new Date(tglInput);
    return !isNaN(d.getTime()) && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
}

async function muatDataRekapPSB() {
    const now = new Date();
    document.getElementById('bannerTitle').textContent = `Total PSB bulan ${namaBulanReal[now.getMonth()]} ${now.getFullYear()}`;

    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('bannerSub').textContent = `Per ${now.getDate()} ${namaBulanReal[now.getMonth()]} ${now.getFullYear()}, ${hrs}:${mins} WIB`;

    const container = document.getElementById('packageListContainer');

    try {
        const { data: psbSemua, error } = await supabaseClient
            .from('psb')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;

        const psbBulanIni = psbSemua ? psbSemua.filter(item => {
            const tgl = item.tanggal_pasang || item.created_at || item.tanggal;
            return isBulanIni(tgl, now);
        }) : [];

        const grandTotalCount = psbBulanIni.length;
        let grandTotalUang = 0;
        const paketGroup = {};

        psbBulanIni.forEach(item => {
            const namaPaket = item.paket || item.layanan || 'Paket Lainnya';
            const harga = parseInt(item.harga) || 0;
            grandTotalUang += harga;

            if (!paketGroup[namaPaket]) {
                paketGroup[namaPaket] = { nama: namaPaket, hargaSatuan: harga, totalHarga: 0, count: 0, pelanggan: [] };
            }
            paketGroup[namaPaket].count++;
            paketGroup[namaPaket].totalHarga += harga;
            paketGroup[namaPaket].pelanggan.push(item);
        });

        document.getElementById('totalPsbCount').textContent = grandTotalCount;
        document.getElementById('totalPsbUang').textContent = rp(grandTotalUang);

        container.innerHTML = '';
        const paketSorted = Object.values(paketGroup).sort((a, b) => b.count - a.count);

        if (paketSorted.length === 0) {
            container.innerHTML = `<div class="state">Allahumma innii as-aluka 'ilman naafi'a, wa rizqon thoyyibaa, wa 'amalan mutaqobbalaa</div>`;
            return;
        }

        paketSorted.forEach(pkg => {
            const card = document.createElement('div');
            card.className = 'package-card';
            const share = Math.max(3, Math.round(pkg.count / grandTotalCount * 100));

            const pelangganHtml = pkg.pelanggan.map(p => {
                const nama = p.nama || p.nama_pelanggan || 'Tanpa Nama';
                return `
                <div class="customer-item">
                    <div class="avatar">${esc(nama.trim().charAt(0).toUpperCase() || '?')}</div>
                    <div class="cust-info">
                        <div class="cust-name">${esc(nama)}</div>
                        <div class="cust-alamat">${esc(p.alamat || p.lokasi || '-')}</div>
                    </div>
                    <div class="cust-date">${esc(fmtTgl(p.tanggal_pasang || p.created_at || p.tanggal))}</div>
                </div>`;
            }).join('');

            card.innerHTML = `
                <button class="package-header" onclick="toggleAccordion(this)" aria-expanded="false">
                    <div>
                        <div class="pkg-name">${esc(pkg.nama)}</div>
                        <div class="pkg-count">${pkg.count} terpasang</div>
                    </div>
                    <div class="pkg-price-area">
                        <div class="pkg-total-price">${rp(pkg.totalHarga)}</div>
                        <div class="pkg-unit-price">@ ${rp(pkg.hargaSatuan)}</div>
                    </div>
                    <svg class="s pkg-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                    <div class="pkg-share" title="${share}% dari total PSB"><i style="width:${share}%"></i></div>
                </button>
                <div class="package-body"><div class="pb-clip"><div class="pb-list">${pelangganHtml}</div></div></div>`;
            container.appendChild(card);
        });

    } catch (err) {
        console.error('Gagal ngamuat rekap PSB:', err);
        container.innerHTML = '<div class="state">Data gagal dimuat. Periksa koneksi, lalu muat ulang halaman.</div>';
    }
}

function toggleAccordion(headerEl) {
    const open = headerEl.parentElement.classList.toggle('active');
    headerEl.setAttribute('aria-expanded', open);
}

function toggleTheme() {
    const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.getElementById('metaTheme').content = t === 'light' ? '#EEF1F7' : '#090B11';
    try { localStorage.setItem('rnb-theme', t); } catch (e) {}
}

// Transisi halaman
const pageTransit = document.getElementById('pageTransit');
document.querySelectorAll('.transit-link').forEach(link => {
    link.addEventListener('click', function (e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        pageTransit.classList.add('active');
        setTimeout(() => window.location.href = href, 400);
    });
});
window.addEventListener('pageshow', () => pageTransit.classList.remove('active'));

window.addEventListener('DOMContentLoaded', muatDataRekapPSB);
</script>
</body>
</html>
