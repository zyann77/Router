<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RNB Network - Premium System</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2888/2888447.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <!-- BACKGROUND AURORA -->
    <div class="aurora-bg">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
    </div>

    <!-- PARTICLE CANVAS -->
    <canvas id="particleCanvas"></canvas>

    <!-- TOUCH GLOW -->
    <div class="touch-glow" id="touchGlow"></div>

    <!-- ==================== LOCK SCREEN ==================== -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-content">
            <div class="lock-status-bar">
                <span class="lock-carrier">RNB Network</span>
                <div class="lock-icons">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>
                    <span class="lock-battery">100%</span>
                </div>
            </div>

            <div class="lock-time-section">
                <div class="lock-date" id="lockDate">Senin, 4 Agustus</div>
                <div class="lock-time" id="lockTime">12:47</div>
                <div class="lock-seconds" id="lockSeconds">:32</div>
            </div>

            <div class="lock-app-info">
                <div class="lock-app-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="lock-app-name">RNB NETWORK</div>
                <div class="lock-app-tag">Premium Network System</div>
            </div>

            <div class="lock-widgets">
                <div class="lock-widget">
                    <div class="widget-icon">📡</div>
                    <div class="widget-info">
                        <div class="widget-value" id="widgetOnline">0</div>
                        <div class="widget-label">Online</div>
                    </div>
                </div>
                <div class="lock-widget">
                    <div class="widget-icon">⏳</div>
                    <div class="widget-info">
                        <div class="widget-value" id="widgetPending">0</div>
                        <div class="widget-label">Pending</div>
                    </div>
                </div>
                <div class="lock-widget">
                    <div class="widget-icon">✅</div>
                    <div class="widget-info">
                        <div class="widget-value" id="widgetDone">0</div>
                        <div class="widget-label">Selesai</div>
                    </div>
                </div>
            </div>

            <div class="unlock-hint" id="unlockHint">
                <div class="unlock-line"></div>
                <span>Tap to Enter</span>
            </div>
        </div>
    </div>

    <!-- ==================== HOME SCREEN ==================== -->
    <div class="home-screen" id="homeScreen">
        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time" id="statusTime">12:47</span>
            <div class="status-icons">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>
            </div>
        </div>

        <!-- Widgets -->
        <div class="widgets-container">
            <div class="widget-card widget-large">
                <div class="widget-header">
                    <span class="widget-title">Status Jaringan</span>
                    <span class="widget-badge">Live</span>
                </div>
                <div class="widget-big-time" id="widgetTime">12:47</div>
                <div class="widget-date" id="widgetDate">Senin, 4 Agustus 2026</div>
                <div class="widget-stats">
                    <div class="stat">
                        <div class="stat-value" id="statPelanggan">0</div>
                        <div class="stat-label">Pelanggan</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="statHariIni">0</div>
                        <div class="stat-label">Hari Ini</div>
                    </div>
                </div>
            </div>

            <div class="widget-row">
                <div class="widget-card widget-small">
                    <div class="widget-icon-small" style="background: linear-gradient(135deg, #10B981, #059669);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    </div>
                    <div class="widget-content">
                        <div class="widget-value" id="widgetOnlineHome">0</div>
                        <div class="widget-label">Online</div>
                    </div>
                </div>
                <div class="widget-card widget-small">
                    <div class="widget-icon-small" style="background: linear-gradient(135deg, #F59E0B, #D97706);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </div>
                    <div class="widget-content">
                        <div class="widget-value" id="widgetPendingHome">0</div>
                        <div class="widget-label">Pending</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- App Grid -->
        <div class="app-grid">
            <a href="teknisi.html" class="app-icon" data-name="Penarikan">
                <div class="app-icon-bg" style="background: linear-gradient(135deg, #667eea, #764ba2);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                        <path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
                    </svg>
                </div>
                <span class="app-label">Penarikan</span>
            </a>

            <a href="https://bot-production-ee35.up.railway.app/" target="_blank" class="app-icon" data-name="Redaman">
                <div class="app-icon-bg" style="background: linear-gradient(135deg, #f093fb, #f5576c);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M5 12.55a11 11 0 0114.08 0"/>
                        <path d="M1.42 9a16 16 0 0121.16 0"/>
                        <path d="M8.53 16.11a6 6 0 016.95 0"/>
                        <line x1="12" y1="20" x2="12.01" y2="20"/>
                    </svg>
                </div>
                <span class="app-label">Redaman</span>
            </a>

            <a href="https://ratioredaman.netlify.app/" target="_blank" class="app-icon" data-name="Kalkulator">
                <div class="app-icon-bg" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <rect x="4" y="2" width="16" height="20" rx="2"/>
                        <line x1="8" y1="6" x2="16" y2="6"/>
                        <line x1="8" y1="10" x2="16" y2="10"/>
                        <line x1="8" y1="14" x2="12" y2="14"/>
                    </svg>
                </div>
                <span class="app-label">Kalkulator</span>
            </a>

            <a href="https://generatorwan.netlify.app/" target="_blank" class="app-icon" data-name="Router">
                <div class="app-icon-bg" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
                        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
                        <line x1="6" y1="6" x2="6.01" y2="6"/>
                        <line x1="6" y1="18" x2="6.01" y2="18"/>
                    </svg>
                </div>
                <span class="app-label">Router</span>
            </a>

            <a href="admin.html" class="app-icon" data-name="Pelanggan">
                <div class="app-icon-bg" style="background: linear-gradient(135deg, #fa709a, #fee140);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                        <path d="M16 3.13a4 4 0 010 7.75"/>
                    </svg>
                </div>
                <span class="app-label">Pelanggan</span>
            </a>

            <a href="dashboard.html" class="app-icon" data-name="Dashboard">
                <div class="app-icon-bg" style="background: linear-gradient(135deg, #a8edea, #fed6e3);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                </div>
                <span class="app-label">Dashboard</span>
            </a>

            <a href="login.html" class="app-icon" data-name="Monitoring">
                <div class="app-icon-bg" style="background: linear-gradient(135deg, #ff9a9e, #fecfef);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </div>
                <span class="app-label">Monitoring</span>
            </a>

            <a href="login.html" class="app-icon" data-name="Profil">
                <div class="app-icon-bg" style="background: linear-gradient(135deg, #C9A961, #A08340);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <span class="app-label">Profil</span>
            </a>
        </div>

        <!-- Page Indicator -->
        <div class="page-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>

        <!-- Dock -->
        <div class="dock">
            <a href="index.html" class="dock-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </a>
            <button class="dock-item" onclick="openSearch()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
            <button class="dock-item" onclick="showNotification()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 01-3.46 0"/>
                </svg>
                <span class="notif-badge">3</span>
            </button>
            <button class="dock-item" onclick="openSettings()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                </svg>
            </button>
            <a href="login.html" class="dock-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- UNLOCK OVERLAY -->
    <div class="unlock-overlay" id="unlockOverlay"></div>

    <script src="assets/app.js"></script>
</body>
</html>
