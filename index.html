<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RNB Network | Vision OS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2888/2888447.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <!-- 1. MESH GRADIENT BACKGROUND -->
    <div class="bg-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="glass-overlay"></div>
    </div>

    <!-- 2. LOCK SCREEN -->
    <div class="screen" id="lock-screen">
        <div class="lock-top">
            <div id="lock-clock">00:00</div>
            <div id="lock-date">Senin, 1 Jan</div>
        </div>

        <div class="lock-middle">
            <svg class="brand-logo" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <div class="brand-text shimmer">RNB NETWORK</div>
            <div class="brand-sub">Liquid Glass Edition</div>
        </div>

        <div class="lock-bottom" id="unlock-trigger">
            <svg class="chevron-up" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"/>
            </svg>
            <div class="shimmer" style="font-size: 0.9rem; letter-spacing: 1px;">Swipe up to open</div>
        </div>
    </div>

    <!-- 3. HOME SCREEN -->
    <div class="screen hidden" id="home-screen">
        <div class="vision-container">

            <!-- VISION PANEL: Status & Clock -->
            <div class="vision-panel tilt-effect">
                <div class="panel-header">
                    <div>
                        <h3 id="home-clock">00:00</h3>
                        <div class="text-muted" id="home-date">Senin, 1 Jan</div>
                    </div>
                    <div class="network-status">
                        <div class="ping-dot"></div>
                        <span>System Online</span>
                    </div>
                </div>

                <!-- Stats Counters -->
                <div class="stats-container">
                    <div class="stat-box glow-gold">
                        <div class="stat-title">Total Users</div>
                        <div class="stat-value counter" data-target="62">0</div>
                    </div>
                    <div class="stat-box glow-blue">
                        <div class="stat-title">Active</div>
                        <div class="stat-value counter" data-target="12">0</div>
                    </div>
                    <div class="stat-box glow-purple">
                        <div class="stat-title">Pending</div>
                        <div class="stat-value counter" data-target="55">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-title">Offline</div>
                        <div class="stat-value counter" data-target="0">0</div>
                    </div>
                </div>
            </div>

            <!-- VISION PANEL: App Grid -->
            <div class="vision-panel tilt-effect">
                <div class="panel-header" style="margin-bottom: 20px;">
                    <div>
                        <h3 style="font-size: 1.5rem;">Applications</h3>
                        <div class="text-muted" style="font-size: 0.85rem;">Premium Network Tools</div>
                    </div>
                </div>

                <div class="app-layout">
                    <!-- 1. Penarikan -->
                    <a href="teknisi.html" class="app-card">
                        <div class="app-icon bg-red">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                            </svg>
                        </div>
                        <div class="app-name">Penarikan</div>
                    </a>

                    <!-- 2. Redaman -->
                    <a href="https://bot-production-ee35.up.railway.app/" target="_blank" class="app-card">
                        <div class="app-icon bg-blue">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                                <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                                <line x1="12" y1="20" x2="12.01" y2="20"/>
                            </svg>
                        </div>
                        <div class="app-name">Redaman</div>
                    </a>

                    <!-- 3. Kalkulator -->
                    <a href="https://ratioredaman.netlify.app/" target="_blank" class="app-card">
                        <div class="app-icon bg-cyan">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="4" y="2" width="16" height="20" rx="2"/>
                                <line x1="8" y1="6" x2="16" y2="6"/>
                                <line x1="8" y1="10" x2="16" y2="10"/>
                                <line x1="8" y1="14" x2="12" y2="14"/>
                            </svg>
                        </div>
                        <div class="app-name">Kalkulator</div>
                    </a>

                    <!-- 4. Router -->
                    <a href="https://generatorwan.netlify.app/" target="_blank" class="app-card">
                        <div class="app-icon bg-green">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
                                <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
                                <line x1="6" y1="6" x2="6.01" y2="6"/>
                                <line x1="6" y1="18" x2="6.01" y2="18"/>
                            </svg>
                        </div>
                        <div class="app-name">Router</div>
                    </a>

                    <!-- 5. Pelanggan -->
                    <a href="admin.html" class="app-card">
                        <div class="app-icon bg-gold">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                        </div>
                        <div class="app-name">Pelanggan</div>
                    </a>

                    <!-- 6. Dashboard -->
                    <a href="dashboard.html" class="app-card">
                        <div class="app-icon bg-purple">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="7"/>
                                <rect x="14" y="3" width="7" height="7"/>
                                <rect x="14" y="14" width="7" height="7"/>
                                <rect x="3" y="14" width="7" height="7"/>
                            </svg>
                        </div>
                        <div class="app-name">Dashboard</div>
                    </a>

                    <!-- 7. Monitoring -->
                    <a href="login.html" class="app-card">
                        <div class="app-icon bg-dark">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </div>
                        <div class="app-name">Monitoring</div>
                    </a>

                    <!-- 8. Profil -->
                    <a href="login.html" class="app-card">
                        <div class="app-icon bg-gray">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <div class="app-name">Profil</div>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <!-- 4. VISION DOCK -->
    <div class="vision-dock">
        <a href="index.html" class="dock-btn active" title="Home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </a>
        <button class="dock-btn" title="Search" onclick="alert('🔍 Search - Coming Soon')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </button>
        <button class="dock-btn" title="Notifications" onclick="alert('🔔 3 Notifikasi Baru')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </button>
        <button class="dock-btn" title="Settings" onclick="alert('⚙️ Settings - Coming Soon')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
        <a href="login.html" class="dock-btn" title="Profile">
            <div class="avatar"></div>
        </a>
    </div>

    <script src="assets/app.js"></script>
</body>
</html>
