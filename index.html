<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RNB NETWORK | Vision OS</title>
    
    <!-- PWA Support -->
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2888/2888447.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vision.css"> <!-- Kita pisahkan CSS khusus menu utama -->
</head>
<body>
    <!-- Premium Mesh Gradient Background -->
    <div class="bg-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="glass-overlay"></div>
    </div>

    <!-- LOCK SCREEN -->
    <section id="lock-screen" class="screen">
        <div class="lock-top">
            <h1 id="lock-clock">00:00</h1>
            <p id="lock-date">Senin, 1 Jan</p>
        </div>
        
        <div class="lock-middle">
            <div class="brand-logo">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="url(#gold-grad)" stroke-width="1.5">
                    <defs>
                        <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#FFF" />
                            <stop offset="100%" stop-color="#C9A961" />
                        </linearGradient>
                    </defs>
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h2 class="brand-text shimmer">IYANN RNB</h2>
            <p class="brand-sub">Network Tools • Vision Edition</p>
        </div>

        <div class="lock-bottom" id="unlock-trigger">
            <div class="chevron-up">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
            </div>
            <p class="shimmer">Swipe up to open</p>
        </div>
    </section>

    <!-- HOME SCREEN -->
    <section id="home-screen" class="screen hidden">
        <div class="vision-container">
            
            <!-- Dashboard Widget -->
            <div class="vision-panel main-dashboard tilt-effect">
                <div class="panel-header">
                    <div>
                        <h3 id="home-clock">00:00</h3>
                        <p id="home-date" class="text-muted">Senin, 1 Jan</p>
                    </div>
                    <div class="network-status">
                        <span class="ping-dot"></span> System Online
                    </div>
                </div>
                
                <div class="stats-container">
                    <div class="stat-box glow-gold">
                        <span class="stat-title">Network</span>
                        <span class="stat-value">Stable</span>
                    </div>
                    <div class="stat-box glow-blue">
                        <span class="stat-title">Tools</span>
                        <span class="stat-value counter" data-target="4">0</span>
                    </div>
                    <div class="stat-box glow-purple">
                        <span class="stat-title">Ping</span>
                        <span class="stat-value counter" data-target="12">0</span><span style="font-size: 12px; color: var(--text-muted);">ms</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-title">Version</span>
                        <span class="stat-value">v3.0</span>
                    </div>
                </div>
            </div>

            <!-- App Grid (Tautan Asli Anda) -->
            <div class="app-layout">
                <!-- 1. Penarikan -->
                <a href="login.html" class="app-card tilt-effect">
                    <div class="app-icon bg-gold"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
                    <span class="app-name">Penarikan</span>
                </a>
                
                <!-- 2. Cek Redaman -->
                <a href="https://bot-production-ee35.up.railway.app/" target="_blank" class="app-card tilt-effect">
                    <div class="app-icon bg-red"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg></div>
                    <span class="app-name">Redaman</span>
                </a>

                <!-- 3. Kalkulator -->
                <a href="https://ratioredaman.netlify.app/" target="_blank" class="app-card tilt-effect">
                    <div class="app-icon bg-blue"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg></div>
                    <span class="app-name">Kalkulator</span>
                </a>

                <!-- 4. Setting Router -->
                <a href="https://generatorwan.netlify.app/" target="_blank" class="app-card tilt-effect">
                    <div class="app-icon bg-green"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg></div>
                    <span class="app-name">Router V5</span>
                </a>
            </div>
        </div>

        <!-- Floating Glass Dock -->
        <nav class="vision-dock">
            <a href="#" class="dock-btn active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
            <a href="login.html" class="dock-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></a>
            <div class="dock-btn" onclick="installApp()" id="installBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>
        </nav>
    </section>

    <script src="app.js"></script>
    <script>
        // PWA Install Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                });
            } else {
                alert('Aplikasi sudah terinstall atau gunakan fitur "Add to Home Screen" di browser Anda.');
            }
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed', err));
            });
        }
    </script>
</body>
</html>
