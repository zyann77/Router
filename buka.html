<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Ngamuat...</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background-color: #050505; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        .back-btn { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: rgba(25, 25, 30, 0.9); color: white; padding: 12px 24px; 
            border-radius: 30px; text-decoration: none; font-family: sans-serif; 
            font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,0.15); 
            backdrop-filter: blur(10px); z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <iframe id="appFrame" allow="geolocation; microphone; camera"></iframe>
    <a href="index.html" class="back-btn">⬅ Wangsul ka Dasbor</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const targetUrl = params.get('url');
        if(targetUrl) { 
            document.getElementById('appFrame').src = targetUrl; 
        } else { 
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
